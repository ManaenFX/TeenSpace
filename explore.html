<main class="container">

<script>


const SUPABASE_URL =
  "https://gcigveojqwwovitlwtxl.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Br7HdEgbHvQxx4_8HHR9Fg_fJ5sH_r7";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true
      }
    }
  );


const profilesContainer =
  document.getElementById("profiles");

const message =
  document.getElementById("message");

const searchInput =
  document.getElementById("search");

const countrySelect =
  document.getElementById("country");


let allProfiles = [];

let currentUser = null;


/* =========================================
   HELPERS
========================================= */

function escapeHTML(value) {

  const div =
    document.createElement("div");

  div.textContent =
    value ?? "";

  return div.innerHTML;

}


function getAvatar(role) {

  if (role === "owner") {
    return "👑";
  }

  if (role === "staff") {
    return "🛡️";
  }

  return "👤";

}


function getBadges(profile) {

  const role =
    profile.role || "user";

  let html = "";


  if (role === "owner") {

    html += `
      <span class="badge owner">
        👑 ${escapeHTML(
          profile.badge || "FOUNDER"
        )}
      </span>
    `;

    html += `
      <span class="badge verified">
        ✅ VERIFIED
      </span>
    `;

  } else if (role === "staff") {

    html += `
      <span class="badge staff">
        🛡️ STAFF
      </span>
    `;

  } else {

    html += `
      <span class="badge member">
        👤 MEMBER
      </span>
    `;

  }


  if (profile.premium === true) {

    html += `
      <span class="badge premium">
        💎 PREMIUM
      </span>
    `;

  }


  return html;

}


/* =========================================
   DISPLAY PROFILES
========================================= */

function displayProfiles() {

  const search =
    searchInput.value
      .trim()
      .toLowerCase();

  const selectedCountry =
    countrySelect.value;


  const filtered =
    allProfiles.filter(profile => {

      const username =
        (
          profile.username || ""
        )
        .toLowerCase();

      const country =
        profile.country || "";


      return (
        username.includes(search) &&
        (
          !selectedCountry ||
          country === selectedCountry
        )
      );

    });


  profilesContainer.innerHTML =
    "";


  if (filtered.length === 0) {

    profilesContainer.innerHTML = `

      <div class="empty">

        😕 No members found.

      </div>

    `;

    return;

  }


  filtered.forEach(profile => {

    const username =
      profile.username ||
      "TeenSpace Member";

    const country =
      profile.country ||
      "Country not set";

    const bio =
      profile.bio ||
      "No bio yet.";

    const role =
      profile.role ||
      "user";


    const authUserId =
      profile["user-id"];


    const card =
      document.createElement("article");

    card.className =
      "profile-card";


    card.innerHTML = `

      <div class="top">

        <div class="avatar">
          ${getAvatar(role)}
        </div>

        <div>

          <div class="username">
            ${escapeHTML(username)}
          </div>

          <div class="badges">
            ${getBadges(profile)}
          </div>

        </div>

      </div>


      <div class="country">
        🌍 ${escapeHTML(country)}
      </div>


      <div class="about-title">
        ABOUT
      </div>


      <div class="bio">
        ${escapeHTML(bio)}
      </div>


      <div class="profile-actions">

        <a
          class="profile-button message-button"
          href="messages.html?user_id=${encodeURIComponent(
            authUserId || ""
          )}&name=${encodeURIComponent(
            username
          )}"
        >
          💬 Message
        </a>

      </div>

    `;


    profilesContainer.appendChild(card);

  });

}


/* =========================================
   LOAD CURRENT USER
========================================= */

async function loadCurrentUser() {

  const {
    data: {
      user
    }
  } =
  await supabaseClient.auth.getUser();

  currentUser =
    user || null;

}


/* =========================================
   LOAD PROFILES
========================================= */

async function loadProfiles() {

  message.className = "";

  message.textContent =
    "Loading community...";


  try {

    const {
      data,
      error
    } =
    await supabaseClient

      .from("profiles")

      .select(
        "username, country, bio, role, badge, premium, \"user-id\""
      );


    if (error) {
      throw error;
    }


    allProfiles =
      data || [];


    /*
      Don't show yourself as a PM target.
    */

    if (currentUser) {

      allProfiles =
        allProfiles.filter(
          profile =>
            profile["user-id"] !==
            currentUser.id
        );

    }


    message.className =
      "success";

    message.textContent =
      `✅ ${allProfiles.length} member(s) found`;


    displayProfiles();


  } catch (error) {

    console.error(error);

    message.className =
      "error";

    message.textContent =
      "❌ Could not load members.";

  }

}


/* =========================================
   SEARCH
========================================= */

searchInput.addEventListener(
  "input",
  displayProfiles
);


countrySelect.addEventListener(
  "change",
  displayProfiles
);


/* =========================================
   START
========================================= */

async function start() {

  await loadCurrentUser();

  await loadProfiles();

}


start();

</script>


</body>
