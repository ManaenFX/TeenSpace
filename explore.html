<body>

      >

      <select id="country">

        <option>United Kingdom</option>
        <option>France</option>

        <option>Switzerland</option>
        <option>Sweden</option>

        <option>India</option>
        <option>China</option>

        <option>Australia</option>
        <option>New Zealand</option>
      </select>

    </div>

    <div id="message" class="loading">
      Loading community...
    </div>

    <div id="profiles" class="profiles"></div>

    <a href="index.html" class="home-btn">
      🏠 Back Home
    </a>

  </div>

  <script>

    // =====================================================
    // SUPABASE SETTINGS
    // =====================================================

    const SUPABASE_URL = "https://gcigveojqwwovitlwtxl.supabase.co/rest/v1/";

    const SUPABASE_KEY = "sb_publishable_Br7HdEgbHvQxx4_8HHR9Fg_fJ5sH_r7";


    // =====================================================
    // CONNECT TO SUPABASE
    // =====================================================

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // =====================================================
    // PAGE ELEMENTS
    // =====================================================

    const profilesContainer =
      document.getElementById("profiles");

    const message =
      document.getElementById("message");

    const searchInput =
      document.getElementById("search");

    const countrySelect =
      document.getElementById("country");


    // =====================================================
    // LOAD PROFILES
    // =====================================================

    async function loadProfiles() {

      message.className = "loading";
      message.textContent = "Loading community...";

      profilesContainer.innerHTML = "";

      try {

        const { data, error } =
          await supabaseClient
            .from("profiles")
            .select("username, country, bio")
            .order("created_at", {
              ascending: false
            });

        if (error) {
          console.error("Supabase error:", error);
          throw error;
        }

        displayProfiles(data || []);

      } catch (error) {

        console.error(error);

        message.className = "error";
        message.textContent =
          "❌ Could not load the community.";

      }

    }


    // =====================================================
    // DISPLAY PROFILES
    // =====================================================

    function displayProfiles(profiles) {

      const search =
        searchInput.value
          .trim()
          .toLowerCase();

      const country =
        countrySelect.value;

      const filtered =
        profiles.filter(profile => {

          const username =
            (profile.username || "")
              .toLowerCase();

          const matchesUsername =
            username.includes(search);

          const matchesCountry =
            !country ||
            profile.country === country;

          return (
            matchesUsername &&
            matchesCountry
          );

        });


      message.textContent = "";


      if (filtered.length === 0) {

        profilesContainer.innerHTML = `
          <div class="empty">
            🌍 No members found yet.
          </div>
        `;

        return;
      }


      filtered.forEach(profile => {

        const card =
          document.createElement("div");

        card.className =
          "profile-card";


        const avatar =
          document.createElement("div");

        avatar.className =
          "avatar";

        avatar.textContent =
          "👤";


        const username =
          document.createElement("div");

        username.className =
          "username";

        username.textContent =
          profile.username || "TeenSpace Member";


        const country =
          document.createElement("div");

        country.className =
          "country";

        country.textContent =
          "🌍 " +
          (profile.country || "Unknown country");


        const bio =
          document.createElement("div");

        bio.className =
          "bio";

        bio.textContent =
          profile.bio ||
          "No bio yet.";


        card.appendChild(avatar);
        card.appendChild(username);
        card.appendChild(country);
        card.appendChild(bio);

        profilesContainer.appendChild(card);

      });

    }


    // =====================================================
    // SEARCH
    // =====================================================

    searchInput.addEventListener(
      "input",
      loadProfiles
    );

    countrySelect.addEventListener(
      "change",
      loadProfiles
    );


    // =====================================================
    // START
    // =====================================================

    loadProfiles();

  </script>

</body>
</html>
