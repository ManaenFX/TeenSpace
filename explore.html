
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Explore TeenSpace</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f7ff;
      color: #222;
    }

    header {
      text-align: center;
      padding: 45px 20px 25px;
    }

    header h1 {
      margin: 0;
      font-size: 48px;
      color: #6352e8;
    }

    header p {
      font-size: 20px;
      color: #555;
      margin-top: 15px;
    }

    .container {
      width: 92%;
      max-width: 1200px;
      margin: 25px auto;
    }

    .search-box {
      background: white;
      padding: 28px;
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    input,
    select {
      width: 100%;
      padding: 18px;
      margin-bottom: 16px;
      border: 1px solid #ccc;
      border-radius: 15px;
      font-size: 18px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #6352e8;
    }

    #message {
      text-align: center;
      font-size: 18px;
      margin: 25px 0;
      min-height: 28px;
    }

    .error {
      color: #ff2864;
    }

    .success {
      color: #159447;
    }

    #profiles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      margin-top: 25px;
    }

    .profile-card {
      background: white;
      border-radius: 22px;
      padding: 25px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .profile-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.12);
    }

    .avatar {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      background: #6352e8;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .username {
      font-size: 24px;
      font-weight: bold;
      color: #6352e8;
      margin-bottom: 8px;
    }

    .country {
      font-size: 17px;
      margin-bottom: 12px;
    }

    .bio {
      color: #666;
      line-height: 1.5;
    }

    .empty {
      text-align: center;
      background: white;
      padding: 30px;
      border-radius: 20px;
      color: #666;
    }

    .home-button {
      display: block;
      width: 92%;
      max-width: 1200px;
      margin: 35px auto;
      padding: 20px;
      background: #6352e8;
      color: white;
      text-decoration: none;
      text-align: center;
      border-radius: 18px;
      font-size: 22px;
      font-weight: bold;
    }

    .home-button:hover {
      background: #5140d5;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 34px;
      }

      header p {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🌍 Explore TeenSpace</h1>
    <p>Discover people around the TeenSpace community.</p>
  </header>

  <main class="container">

    <section class="search-box">

      <input
        type="text"
        id="search"
        placeholder="🔎 Search username..."
      >

      <select id="country">
        <option value="">🌍 All countries</option>

        <!-- Africa -->
        <option>Nigeria</option>
        <option>Ghana</option>
        <option>South Africa</option>
        <option>Kenya</option>
        <option>Uganda</option>
        <option>Tanzania</option>
        <option>Rwanda</option>
        <option>Egypt</option>
        <option>Morocco</option>
        <option>Algeria</option>
        <option>Zimbabwe</option>
        <option>Zambia</option>
        <option>Cameroon</option>
        <option>Ethiopia</option>

        <!-- Europe -->
        <option>United Kingdom</option>
        <option>Ireland</option>
        <option>France</option>
        <option>Germany</option>
        <option>Spain</option>
        <option>Italy</option>
        <option>Portugal</option>
        <option>Netherlands</option>
        <option>Belgium</option>
        <option>Switzerland</option>
        <option>Austria</option>
        <option>Sweden</option>
        <option>Norway</option>
        <option>Denmark</option>
        <option>Finland</option>
        <option>Poland</option>
        <option>Greece</option>
        <option>Ukraine</option>

        <!-- Americas -->
        <option>United States</option>
        <option>Canada</option>
        <option>Brazil</option>
        <option>Mexico</option>
        <option>Argentina</option>

        <!-- Asia -->
        <option>India</option>
        <option>China</option>
        <option>Japan</option>
        <option>South Korea</option>
        <option>Philippines</option>
        <option>Indonesia</option>
        <option>Malaysia</option>
        <option>Singapore</option>

        <!-- Oceania -->
        <option>Australia</option>
        <option>New Zealand</option>
      </select>

    </section>

    <div id="message">Loading community...</div>

    <section id="profiles"></section>

  </main>

  <a class="home-button" href="index.html">
    🏠 Back Home
  </a>

  <script>

    /* ==========================================
       TEENSPACE SUPABASE CONNECTION
       ========================================== */

    const SUPABASE_URL =
      "https://gcigveojqwwovitlwtxl.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_Br7HdEgbHvQxx4_8HHR9Fg_fJ5sH_r7";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* ==========================================
       PAGE ELEMENTS
       ========================================== */

    const profilesContainer =
      document.getElementById("profiles");

    const message =
      document.getElementById("message");

    const searchInput =
      document.getElementById("search");

    const countrySelect =
      document.getElementById("country");


    let allProfiles = [];


    /* ==========================================
       LOAD PROFILES
       ========================================== */

    async function loadProfiles() {

      message.className = "";
      message.textContent = "Loading community...";

      profilesContainer.innerHTML = "";

      try {

        const { data, error } =
          await supabaseClient
            .from("profiles")
            .select("username, country, bio")
            .order("created_at", {
              ascending: false
            });

        if (error) {
          console.error("Supabase error:", error);

          message.className = "error";
          message.textContent =
            "❌ Could not load the community.";

          return;
        }

        allProfiles = data || [];

        message.className = "success";
        message.textContent =
          `✅ ${allProfiles.length} member(s) found`;

        displayProfiles();

      } catch (err) {

        console.error("Connection error:", err);

        message.className = "error";
        message.textContent =
          "❌ Could not connect to TeenSpace.";

      }
    }


    /* ==========================================
       DISPLAY PROFILES
       ========================================== */

    function displayProfiles() {

      const search =
        searchInput.value
          .trim()
          .toLowerCase();

      const country =
        countrySelect.value;

      const filtered =
        allProfiles.filter(profile => {

          const username =
            (profile.username || "")
              .toLowerCase();

          const profileCountry =
            profile.country || "";

          const matchesSearch =
            username.includes(search);

          const matchesCountry =
            !country ||
            profileCountry === country;

          return matchesSearch &&
                 matchesCountry;
        });


      profilesContainer.innerHTML = "";


      if (filtered.length === 0) {

        profilesContainer.innerHTML = `
          <div class="empty">
            😕 No members found.
          </div>
        `;

        return;
      }


      filtered.forEach(profile => {

        const card =
          document.createElement("div");

        card.className =
          "profile-card";


        const username =
          profile.username ||
          "TeenSpace Member";


        const country =
          profile.country ||
          "Country not set";


        const bio =
          profile.bio ||
          "No bio yet.";


        const firstLetter =
          username
            .charAt(0)
            .toUpperCase();


        card.innerHTML = `

          <div class="avatar">
            ${firstLetter}
          </div>

          <div class="username">
            ${escapeHTML(username)}
          </div>

          <div class="country">
            🌍 ${escapeHTML(country)}
          </div>

          <div class="bio">
            ${escapeHTML(bio)}
          </div>

        `;


        profilesContainer.appendChild(card);

      });

    }


    /* ==========================================
       SEARCH + FILTER
       ========================================== */

    searchInput.addEventListener(
      "input",
      displayProfiles
    );

    countrySelect.addEventListener(
      "change",
      displayProfiles
    );


    /* ==========================================
       SECURITY
       ========================================== */

    function escapeHTML(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* ==========================================
       START
       ========================================== */

    loadProfiles();

  </script>

</body>
</html>
