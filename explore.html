<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TeenSpace - Explore</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f7ff;
      color: #222;
    }

    header {
      text-align: center;
      padding: 45px 20px 30px;
    }

    header h1 {
      margin: 0;
      font-size: 48px;
      color: #6352e8;
    }

    header p {
      font-size: 20px;
      color: #555;
      margin-top: 12px;
    }

    .container {
      width: 92%;
      max-width: 1200px;
      margin: 20px auto;
    }

    .search-box {
      background: white;
      padding: 28px;
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    input,
    select {
      width: 100%;
      padding: 18px;
      margin-bottom: 16px;
      border: 1px solid #ccc;
      border-radius: 15px;
      font-size: 18px;
      outline: none;
      background: white;
    }

    input:focus,
    select:focus {
      border-color: #6352e8;
      box-shadow: 0 0 0 3px rgba(99,82,232,0.12);
    }

    #message {
      text-align: center;
      font-size: 18px;
      margin: 28px 0;
      min-height: 28px;
    }

    .error {
      color: #ff2864;
    }

    .success {
      color: #159447;
    }

    #profiles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      margin-top: 25px;
    }

    .profile-card {
      background: white;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
      border: 1px solid rgba(99,82,232,0.08);
      min-height: 250px;
    }

    .profile-top {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .avatar {
      width: 72px;
      height: 72px;
      flex-shrink: 0;
      border-radius: 50%;
      background: linear-gradient(135deg, #6352e8, #8c7cff);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: bold;
      box-shadow: 0 6px 15px rgba(99,82,232,0.25);
    }

    .username {
      font-size: 23px;
      font-weight: bold;
      color: #6352e8;
      word-break: break-word;
    }

    .member-label {
      color: #999;
      font-size: 13px;
      margin-top: 4px;
    }

    .country-box {
      background: #f6f5ff;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 14px;
    }

    .bio-title {
      font-size: 13px;
      color: #888;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .bio {
      color: #555;
      line-height: 1.6;
      word-break: break-word;
    }

    .empty {
      text-align: center;
      background: white;
      padding: 40px 20px;
      border-radius: 20px;
      color: #666;
      grid-column: 1 / -1;
      box-shadow: 0 8px 25px rgba(0,0,0,0.06);
    }

    .home-button {
      display: block;
      width: 92%;
      max-width: 1200px;
      margin: 35px auto;
      padding: 20px;
      background: #6352e8;
      color: white;
      text-decoration: none;
      text-align: center;
      border-radius: 18px;
      font-size: 22px;
      font-weight: bold;
    }

    @media (max-width: 600px) {

      header h1 {
        font-size: 34px;
      }

      header p {
        font-size: 17px;
      }

      .container {
        width: 94%;
      }

      .search-box {
        padding: 20px;
      }

      .profile-card {
        padding: 22px;
      }

    }
  </style>
</head>

<body>

  <header>

    <h1>🌍 Explore TeenSpace</h1>

    <p>
      Discover people around the TeenSpace community.
    </p>

  </header>


  <main class="container">

    <section class="search-box">

      <input
        type="text"
        id="search"
        placeholder="🔎 Search username..."
        autocomplete="off"
      >

      <select id="country">

        <option value="">
          🌍 All countries
        </option>

        <option>Nigeria</option>
        <option>Ghana</option>
        <option>South Africa</option>
        <option>Kenya</option>
        <option>Uganda</option>
        <option>Tanzania</option>
        <option>Rwanda</option>
        <option>Egypt</option>
        <option>Morocco</option>
        <option>Algeria</option>
        <option>Zimbabwe</option>
        <option>Zambia</option>
        <option>Cameroon</option>
        <option>Ethiopia</option>

        <option>United Kingdom</option>
        <option>Ireland</option>
        <option>France</option>
        <option>Germany</option>
        <option>Spain</option>
        <option>Italy</option>
        <option>Portugal</option>
        <option>Netherlands</option>
        <option>Belgium</option>
        <option>Switzerland</option>
        <option>Austria</option>
        <option>Sweden</option>
        <option>Norway</option>
        <option>Denmark</option>
        <option>Finland</option>
        <option>Poland</option>
        <option>Greece</option>
        <option>Ukraine</option>

        <option>United States</option>
        <option>Canada</option>
        <option>Brazil</option>
        <option>Mexico</option>
        <option>Argentina</option>

        <option>India</option>
        <option>China</option>
        <option>Japan</option>
        <option>South Korea</option>
        <option>Philippines</option>
        <option>Indonesia</option>
        <option>Malaysia</option>
        <option>Singapore</option>

        <option>Australia</option>
        <option>New Zealand</option>

      </select>

    </section>


    <div id="message">
      Loading community...
    </div>


    <section id="profiles"></section>

  </main>


  <a class="home-button" href="index.html">
    🏠 Back Home
  </a>


  <script>

    // ==========================================
    // SUPABASE
    // ==========================================

    const SUPABASE_URL =
      "https://gcigveojqwwovitlwtxl.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_Br7HdEgbHvQxx4_8HHR9Fg_fJ5sH_r7";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ==========================================
    // ELEMENTS
    // ==========================================

    const profilesContainer =
      document.getElementById("profiles");

    const message =
      document.getElementById("message");

    const searchInput =
      document.getElementById("search");

    const countrySelect =
      document.getElementById("country");


    let allProfiles = [];


    // ==========================================
    // LOAD PROFILES
    // ==========================================

    async function loadProfiles() {

      message.className = "";

      message.textContent =
        "Loading community...";

      profilesContainer.innerHTML = "";


      try {

        const {
          data,
          error
        } = await supabaseClient
          .from("profiles")
          .select('"user-id", username, country, bio');


        if (error) {

          console.error(
            "Supabase error:",
            error
          );

          message.className =
            "error";

          message.textContent =
            "❌ Could not load the community.";

          return;

        }


        // ==========================================
        // REMOVE DUPLICATE USER IDS
        // ==========================================

        const uniqueProfiles =
          new Map();


        for (const profile of (data || [])) {

          const userId =
            profile["user-id"];


          if (!userId) {
            continue;
          }


          // Keep only ONE profile
          // for each "user-id"

          uniqueProfiles.set(
            userId,
            profile
          );

        }


        allProfiles =
          Array.from(
            uniqueProfiles.values()
          );


        message.className =
          "success";

        message.textContent =
          `✅ ${allProfiles.length} member(s) found`;


        displayProfiles();


      } catch (error) {

        console.error(error);

        message.className =
          "error";

        message.textContent =
          "❌ Could not connect to TeenSpace.";

      }

    }


    // ==========================================
    // DISPLAY PROFILES
    // ==========================================

    function displayProfiles() {

      const search =
        searchInput.value
          .trim()
          .toLowerCase();


      const selectedCountry =
        countrySelect.value;


      const filtered =
        allProfiles.filter(profile => {

          const username =
            (profile.username || "")
              .toLowerCase();


          const country =
            profile.country || "";


          const matchesSearch =
            username.includes(search);


          const matchesCountry =
            !selectedCountry ||
            country === selectedCountry;


          return (
            matchesSearch &&
            matchesCountry
          );

        });


      profilesContainer.innerHTML = "";


      if (filtered.length === 0) {

        profilesContainer.innerHTML = `

          <div class="empty">

            <div style="font-size:40px;">
              😕
            </div>

            <h2>
              No members found
            </h2>

            <p>
              Try another username or country.
            </p>

          </div>

        `;

        return;

      }


      filtered.forEach(profile => {

        const card =
          document.createElement("div");

        card.className =
          "profile-card";


        const username =
          profile.username ||
          "TeenSpace Member";


        const country =
          profile.country ||
          "Country not set";


        const bio =
          profile.bio ||
          "No bio yet.";


        const firstLetter =
          username
            .charAt(0)
            .toUpperCase();


        card.innerHTML = `

          <div class="profile-top">

            <div class="avatar">
              ${escapeHTML(firstLetter)}
            </div>

            <div>

              <div class="username">
                ${escapeHTML(username)}
              </div>

              <div class="member-label">
                TeenSpace Member
              </div>

            </div>

          </div>


          <div class="country-box">

            🌍 ${escapeHTML(country)}

          </div>


          <div class="bio-title">
            ABOUT
          </div>


          <div class="bio">

            ${escapeHTML(bio)}

          </div>

        `;


        profilesContainer.appendChild(card);

      });

    }


    // ==========================================
    // SEARCH
    // ==========================================

    searchInput.addEventListener(
      "input",
      displayProfiles
    );


    countrySelect.addEventListener(
      "change",
      displayProfiles
    );


    // ==========================================
    // SECURITY
    // ==========================================

    function escapeHTML(value) {

      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    // ==========================================
    // START
    // ==========================================

    loadProfiles();

  </script>

</body>
</html>
