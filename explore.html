```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TeenSpace - Explore</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f7ff;
      padding: 25px 15px;
    }

    .box {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: #6c5ce7;
      margin-bottom: 5px;
    }

    .intro {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .search-area {
      background: white;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    .profile-card {
      background: white;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .username {
      font-size: 21px;
      font-weight: bold;
      color: #6c5ce7;
    }

    .country {
      margin-top: 7px;
      color: #555;
    }

    .bio {
      margin-top: 12px;
      color: #333;
      line-height: 1.5;
    }

    .empty {
      background: white;
      padding: 25px;
      border-radius: 18px;
      text-align: center;
      color: #666;
    }

    .back {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border-radius: 10px;
      background: #6c5ce7;
      color: white;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
    }

    #message {
      text-align: center;
      margin: 15px 0;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>🌍 Explore TeenSpace</h1>

  <p class="intro">
    Discover people around the TeenSpace community.
  </p>

  <div class="search-area">

    <input
      type="text"
      id="search"
      placeholder="🔎 Search username..."
    >

    <select id="countryFilter">
      <option value="">🌍 All countries</option>
      <option value="Nigeria">🇳🇬 Nigeria</option>
      <option value="Ghana">🇬🇭 Ghana</option>
      <option value="Kenya">🇰🇪 Kenya</option>
      <option value="South Africa">🇿🇦 South Africa</option>
      <option value="United States">🇺🇸 United States</option>
      <option value="United Kingdom">🇬🇧 United Kingdom</option>
      <option value="Canada">🇨🇦 Canada</option>
      <option value="India">🇮🇳 India</option>
      <option value="Australia">🇦🇺 Australia</option>
      <option value="Other">🌍 Other</option>
    </select>

  </div>

  <div id="message">
    Loading community...
  </div>

  <div id="profiles"></div>

  <a class="back" href="index.html">
    🏠 Back Home
  </a>

</div>

<script>

  const SUPABASE_URL =
    "https://gcigveojqwwovitlwtxl.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_Br7HdEgbHvQxx4_8HHR9Fg_fJ5sH_r7Y";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  const profilesContainer =
    document.getElementById("profiles");

  const message =
    document.getElementById("message");

  const search =
    document.getElementById("search");

  const countryFilter =
    document.getElementById("countryFilter");


  let allProfiles = [];


  async function loadProfiles() {

    message.textContent =
      "Loading community...";


    const {
      data,
      error
    } = await supabaseClient
      .from("profiles")
      .select("username, country, bio")
      .order("created_at", {
        ascending: false
      });


    if (error) {

      console.error(error);

      message.textContent =
        "❌ Could not load the community.";

      return;
    }


    allProfiles = data || [];

    displayProfiles(allProfiles);
  }


  function displayProfiles(profiles) {

    profilesContainer.innerHTML = "";


    if (profiles.length === 0) {

      message.textContent = "";

      profilesContainer.innerHTML = `
        <div class="empty">
          🔎 No profiles found.
        </div>
      `;

      return;
    }


    message.textContent =
      `${profiles.length} profile${profiles.length === 1 ? "" : "s"} found.`;


    profiles.forEach(profile => {

      const card =
        document.createElement("div");

      card.className =
        "profile-card";


      const username =
        profile.username || "TeenSpace User";

      const country =
        profile.country || "Unknown country";

      const bio =
        profile.bio || "No bio yet.";


      card.innerHTML = `
        <div class="username">
          👤 ${escapeHTML(username)}
        </div>

        <div class="country">
          🌍 ${escapeHTML(country)}
        </div>

        <div class="bio">
          ${escapeHTML(bio)}
        </div>
      `;


      profilesContainer.appendChild(card);

    });

  }


  function escapeHTML(text) {

    const div =
      document.createElement("div");

    div.textContent =
      text;

    return div.innerHTML;
  }


  function filterProfiles() {

    const searchText =
      search.value
        .trim()
        .toLowerCase();

    const selectedCountry =
      countryFilter.value;


    const filtered =
      allProfiles.filter(profile => {

        const username =
          (profile.username || "")
            .toLowerCase();

        const matchesSearch =
          username.includes(searchText);

        const matchesCountry =
          !selectedCountry ||
          profile.country === selectedCountry;

        return matchesSearch &&
               matchesCountry;

      });


    displayProfiles(filtered);
  }


  search.addEventListener(
    "input",
    filterProfiles
  );

  countryFilter.addEventListener(
    "change",
    filterProfiles
  );


  loadProfiles();

</script>

</body>
</html>
