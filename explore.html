
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TeenSpace - Explore 🌍</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f7ff;
      color: #222;
    }

    header {
      background: #6c5ce7;
      color: white;
      padding: 20px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 18px;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .hero {
      text-align: center;
      background: white;
      padding: 50px 20px 35px;
    }

    .hero h1 {
      color: #6352e8;
      font-size: 44px;
      margin: 0 0 12px;
    }

    .hero p {
      color: #555;
      font-size: 19px;
    }

    .container {
      width: 92%;
      max-width: 1100px;
      margin: 30px auto 50px;
    }

    .search-box {
      background: white;
      padding: 25px;
      border-radius: 22px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
      margin-bottom: 25px;
    }

    input,
    select {
      width: 100%;
      padding: 17px;
      margin-bottom: 14px;
      border: 1px solid #ccc;
      border-radius: 14px;
      font-size: 17px;
      outline: none;
      background: white;
    }

    input:focus,
    select:focus {
      border-color: #6352e8;
    }

    #message {
      text-align: center;
      margin: 20px 0;
      min-height: 25px;
      font-size: 17px;
    }

    .error {
      color: #e74c3c;
    }

    .success {
      color: #159447;
    }

    #profiles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 22px;
    }

    .profile-card {
      background: white;
      padding: 25px;
      border-radius: 22px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.07);
    }

    .profile-top {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 18px;
    }

    .avatar {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6352e8, #8c7cff);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 27px;
      font-weight: bold;
      flex-shrink: 0;
    }

    .username {
      color: #6352e8;
      font-size: 22px;
      font-weight: bold;
      word-break: break-word;
    }

    .member {
      color: #999;
      font-size: 13px;
      margin-top: 4px;
    }

    .country {
      background: #f3f1ff;
      padding: 12px;
      border-radius: 11px;
      margin-bottom: 15px;
    }

    .bio-title {
      color: #888;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .bio {
      color: #555;
      line-height: 1.6;
      word-break: break-word;
    }

    .empty {
      background: white;
      padding: 40px 20px;
      border-radius: 20px;
      text-align: center;
      color: #666;
      grid-column: 1 / -1;
    }

    footer {
      background: #222;
      color: white;
      text-align: center;
      padding: 25px;
    }

    @media (max-width: 700px) {

      header {
        flex-direction: column;
        gap: 15px;
      }

      nav a {
        margin: 5px;
        display: inline-block;
      }

      .hero h1 {
        font-size: 34px;
      }

      .container {
        width: 94%;
      }
    }
  </style>
</head>


<body>

<header>

  <div class="logo">
    🌍 TeenSpace
  </div>

  <nav>

    <!-- HOME = home.html -->
    <a href="home.html">Home</a>

    <a href="explore.html">Explore</a>

    <a href="community.html">Community</a>

    <a href="profile.html">Profile</a>

  </nav>

</header>


<section class="hero">

  <h1>🌍 Explore TeenSpace</h1>

  <p>
    Discover people around the TeenSpace community.
  </p>

</section>


<main class="container">

  <section class="search-box">

    <input
      type="text"
      id="search"
      placeholder="🔎 Search username..."
      autocomplete="off"
    >

    <select id="country">

      <option value="">
        🌍 All countries
      </option>

      <option>Nigeria</option>
      <option>Ghana</option>
      <option>South Africa</option>
      <option>Kenya</option>
      <option>Uganda</option>
      <option>Tanzania</option>
      <option>Rwanda</option>
      <option>Egypt</option>
      <option>Morocco</option>
      <option>Algeria</option>
      <option>Zimbabwe</option>
      <option>Zambia</option>
      <option>Cameroon</option>
      <option>Ethiopia</option>

      <option>United Kingdom</option>
      <option>Ireland</option>
      <option>France</option>
      <option>Germany</option>
      <option>Spain</option>
      <option>Italy</option>
      <option>Portugal</option>
      <option>Netherlands</option>
      <option>Belgium</option>
      <option>Switzerland</option>
      <option>Austria</option>
      <option>Sweden</option>
      <option>Norway</option>
      <option>Denmark</option>
      <option>Finland</option>
      <option>Poland</option>
      <option>Greece</option>
      <option>Ukraine</option>

      <option>United States</option>
      <option>Canada</option>
      <option>Brazil</option>
      <option>Mexico</option>
      <option>Argentina</option>

      <option>India</option>
      <option>China</option>
      <option>Japan</option>
      <option>South Korea</option>
      <option>Philippines</option>
      <option>Indonesia</option>
      <option>Malaysia</option>
      <option>Singapore</option>

      <option>Australia</option>
      <option>New Zealand</option>

    </select>

  </section>


  <div id="message">
    Loading community...
  </div>


  <section id="profiles"></section>

</main>


<footer>

  © 2026 TeenSpace 🌍 |
  Made for teens, with safety in mind.

</footer>


<script>

// ==========================================
// SUPABASE
// ==========================================

const SUPABASE_URL =
  "https://gcigveojqwwovitlwtxl.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Br7HdEgbHvQxx4_8HHR9Fg_fJ5sH_r7";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


// ==========================================
// ELEMENTS
// ==========================================

const profilesContainer =
  document.getElementById("profiles");

const message =
  document.getElementById("message");

const searchInput =
  document.getElementById("search");

const countrySelect =
  document.getElementById("country");


// ==========================================
// LOAD PROFILES
// ==========================================

async function loadProfiles() {

  message.className = "";

  message.textContent =
    "Loading community...";

  profilesContainer.innerHTML = "";


  try {

    const {
      data: profiles,
      error
    } =
      await supabaseClient

        .from("profiles")

        .select(
          '"user-id", username, country, bio'
        );


    if (error) {

      console.error(
        "Supabase error:",
        error
      );

      message.className =
        "error";

      message.textContent =
        "❌ Could not load profiles.";

      return;

    }


    const uniqueProfiles = [];

    const seenUserIds =
      new Set();


    for (
      const profile
      of (profiles || [])
    ) {

      const userId =
        profile["user-id"];


      if (
        userId &&
        !seenUserIds.has(userId)
      ) {

        seenUserIds.add(userId);

        uniqueProfiles.push(
          profile
        );

      }

    }


    window.allProfiles =
      uniqueProfiles;


    message.className =
      "success";

    message.textContent =
      `✅ ${uniqueProfiles.length} member(s) found`;


    displayProfiles();


  } catch (error) {

    console.error(error);

    message.className =
      "error";

    message.textContent =
      "❌ Could not connect to TeenSpace.";

  }

}


// ==========================================
// DISPLAY
// ==========================================

function displayProfiles() {

  const profiles =
    window.allProfiles || [];


  const search =
    searchInput.value
      .trim()
      .toLowerCase();


  const selectedCountry =
    countrySelect.value;


  const filtered =
    profiles.filter(profile => {

      const username =
        (
          profile.username || ""
        )
        .toLowerCase();


      const profileCountry =
        profile.country || "";


      const matchesUsername =
        username.includes(search);


      const matchesCountry =
        !selectedCountry ||
        profileCountry === selectedCountry;


      return (
        matchesUsername &&
        matchesCountry
      );

    });


  profilesContainer.innerHTML =
    "";


  if (
    filtered.length === 0
  ) {

    profilesContainer.innerHTML = `

      <div class="empty">

        <div style="font-size:40px;">
          😕
        </div>

        <h2>
          No members found
        </h2>

        <p>
          Try another username or country.
        </p>

      </div>

    `;

    return;

  }


  filtered.forEach(
    profile => {

      const username =
        profile.username ||
        "TeenSpace Member";


      const country =
        profile.country ||
        "Country not set";


      const bio =
        profile.bio ||
        "No bio yet.";


      const firstLetter =
        username
          .charAt(0)
          .toUpperCase();


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "profile-card";


      card.innerHTML = `

        <div class="profile-top">

          <div class="avatar">

            ${escapeHTML(
              firstLetter
            )}

          </div>


          <div>

            <div class="username">

              ${escapeHTML(
                username
              )}

            </div>

            <div class="member">

              TeenSpace Member

            </div>

          </div>

        </div>


        <div class="country">

          🌍 ${escapeHTML(
            country
          )}

        </div>


        <div class="bio-title">
          ABOUT
        </div>


        <div class="bio">

          ${escapeHTML(
            bio
          )}

        </div>

      `;


      profilesContainer.appendChild(
        card
      );

    }
  );

}


// ==========================================
// SEARCH
// ==========================================

searchInput.addEventListener(
  "input",
  displayProfiles
);


countrySelect.addEventListener(
  "change",
  displayProfiles
);


// ==========================================
// SECURITY
// ==========================================

function escapeHTML(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


// ==========================================
// START
// ==========================================

loadProfiles();

</script>

</body>
</html>
