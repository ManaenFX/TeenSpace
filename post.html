
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Post | TeenSpace 🌍</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    background:#f4f7ff;
    color:#222;
}

.container{
    width:92%;
    max-width:700px;
    margin:50px auto;
}

h1{
    text-align:center;
    color:#6c5ce7;
    font-size:40px;
    margin-bottom:30px;
}

.card{
    background:white;
    padding:30px;
    border-radius:25px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

textarea{
    width:100%;
    height:180px;
    padding:20px;
    border-radius:15px;
    border:1px solid #ccc;
    font-size:18px;
    resize:none;
    outline:none;
}

textarea:focus{
    border-color:#6c5ce7;
}

button{
    width:100%;
    margin-top:20px;
    padding:18px;
    background:#6c5ce7;
    color:white;
    border:none;
    border-radius:15px;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#5849c4;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    text-align:center;
    margin-top:20px;
    font-size:18px;
    line-height:1.5;
}

.success{
    color:#16a34a;
}

.error{
    color:#ff3366;
}

.back{
    display:block;
    text-align:center;
    margin-top:25px;
    color:#6c5ce7;
    font-weight:bold;
    text-decoration:none;
}

</style>

</head>

<body>

<div class="container">

<h1>
✍️ Create a Post
</h1>

<div class="card">

<textarea
    id="content"
    placeholder="Share something with TeenSpace..."
    maxlength="2000"
></textarea>

<button id="publishButton" onclick="createPost()">
    Publish Post 🚀
</button>

<div id="message" class="message"></div>

</div>

<a href="community.html" class="back">
    ← Back to Community
</a>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://gcigveojqwwovitlwtxl.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Br7HdEgbHvQxx4_8HHR9Fg_fJ5sH_r7";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
        auth:{
            persistSession:true,
            autoRefreshToken:true,
            detectSessionInUrl:true
        }
    }
);


/* =========================================
   ELEMENTS
========================================= */

const contentBox =
document.getElementById("content");

const message =
document.getElementById("message");

const publishButton =
document.getElementById("publishButton");


/* =========================================
   SHOW MESSAGE
========================================= */

function showMessage(text, type){

    message.className =
        "message " + type;

    message.textContent = text;
}


/* =========================================
   CREATE POST
========================================= */

async function createPost(){

    const content =
        contentBox.value.trim();


    /* EMPTY POST */

    if(!content){

        showMessage(
            "Please write something first.",
            "error"
        );

        return;
    }


    /* PREVENT DOUBLE CLICK */

    publishButton.disabled = true;

    publishButton.textContent =
        "Publishing... 🚀";


    try{

        /* =====================================
           GET CURRENT LOGIN SESSION
        ===================================== */

        const {
            data: { session },
            error: sessionError
        } =
        await supabaseClient.auth.getSession();


        if(sessionError){

            console.error(
                "Session error:",
                sessionError
            );

            throw new Error(
                "Could not check your login session."
            );
        }


        /* =====================================
           USER NOT LOGGED IN
        ===================================== */

        if(!session || !session.user){

            showMessage(
                "You need to login before creating a post.",
                "error"
            );

            publishButton.disabled = false;

            publishButton.textContent =
                "Publish Post 🚀";

            return;
        }


        /* =====================================
           GET USER ID
        ===================================== */

        const user =
            session.user;


        console.log(
            "Logged-in user:",
            user.id
        );


        /* =====================================
           INSERT POST
        ===================================== */

        const { data, error } =
        await supabaseClient
            .from("posts")
            .insert({

                user_id: user.id,

                content: content

            })
            .select()
            .single();


        /* =====================================
           SUPABASE ERROR
        ===================================== */

        if(error){

            console.error(
                "POST INSERT ERROR:",
                error
            );

            showMessage(
                "❌ " + error.message,
                "error"
            );

            publishButton.disabled = false;

            publishButton.textContent =
                "Publish Post 🚀";

            return;
        }


        /* =====================================
           SUCCESS
        ===================================== */

        console.log(
            "Post created:",
            data
        );


        showMessage(
            "✅ Post published successfully!",
            "success"
        );


        contentBox.value = "";


        setTimeout(function(){

            window.location.href =
                "community.html";

        },1000);


    }catch(error){

        console.error(
            "Unexpected error:",
            error
        );


        showMessage(
            "❌ " + error.message,
            "error"
        );


        publishButton.disabled = false;

        publishButton.textContent =
            "Publish Post 🚀";
    }

}

</script>

</body>
</html>
