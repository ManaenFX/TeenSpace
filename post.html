<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Post | TeenSpace 🌍</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

margin:0;
background:#f4f7ff;
color:#222;

}


.container{

width:92%;
max-width:700px;
margin:50px auto;

}


h1{

text-align:center;
color:#6c5ce7;
font-size:40px;

}


.card{

background:white;
padding:30px;
border-radius:25px;
box-shadow:0 10px 30px rgba(0,0,0,.08);

}


textarea{

width:100%;
height:180px;
padding:20px;
border-radius:15px;
border:1px solid #ccc;
font-size:18px;
resize:none;

}


button{

width:100%;
margin-top:20px;
padding:18px;
background:#6c5ce7;
color:white;
border:none;
border-radius:15px;
font-size:22px;
font-weight:bold;
cursor:pointer;

}


button:hover{

background:#5849c4;

}



.message{

text-align:center;
margin-top:20px;
font-size:18px;

}


.success{

color:green;

}


.error{

color:#ff3366;

}


.back{

display:block;
text-align:center;
margin-top:25px;
color:#6c5ce7;
font-weight:bold;
text-decoration:none;

}


</style>

</head>


<body>


<div class="container">


<h1>
✍️ Create a Post
</h1>


<div class="card">


<textarea 
id="content"
placeholder="Share something with TeenSpace..."
></textarea>


<button onclick="createPost()">

Publish Post 🚀

</button>


<div id="message" class="message"></div>


</div>


<a href="community.html" class="back">

← Back to Community

</a>


</div>




<script>


const SUPABASE_URL =
"https://gcigveojqwwovitlwtxl.supabase.co";


const SUPABASE_KEY =
"sb_publishable_Br7HdEgbHvQxx4_8HHR9Fg_fJ5sH_r7";



const supabase =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



async function createPost(){


const content =
document.getElementById("content").value.trim();


const message =
document.getElementById("message");



if(!content){

message.className="message error";

message.textContent=
"Please write something first.";

return;

}



const {
data:{
user
}

}
=
await supabase.auth.getUser();



if(!user){


message.className="message error";

message.textContent=
"You need to login first.";

return;

}




const {error}=

await supabase

.from("posts")

.insert({

user_id:user.id,

content:content

});




if(error){


console.log(error);


message.className="message error";

message.textContent=
"❌ Could not publish post.";

return;


}



message.className="message success";

message.textContent=
"✅ Post published!";


document.getElementById("content").value="";



setTimeout(()=>{

window.location.href="community.html";

},1500);



}


</script>


</body>

</html>
