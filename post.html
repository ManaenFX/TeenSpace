<style>

label{

input,

select{

}

textarea{

input:focus,

select:focus{

}

.edit-actions{

}

.save-btn,
.cancel-btn{

}

}

.loading{
  color:#6c5ce7;
}

@media(max-width:700px){

  header{
    flex-direction:column;
  }

    padding:22px;
  }

    flex-direction:column;

  }

  .username{
    font-size:26px;
  }

  .badges{
    justify-content:center;
  }

    flex-direction:column;
  }

    width:100%;
  }

}

</style>

<script>


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://gcigveojqwwovitlwtxl.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Br7HdEgbHvQxx4_8HHR9Fg_fJ5sH_r7";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true
      }
    }
  );


/* =========================================
   ELEMENTS
========================================= */

const statusBox =
  document.getElementById("status");

const profileCard =
  document.getElementById("profileCard");

const avatar =
  document.getElementById("avatar");

const username =
  document.getElementById("username");

const badges =
  document.getElementById("badges");

const country =
  document.getElementById("country");

const bio =
  document.getElementById("bio");

const actions =
  document.getElementById("actions");

const editPanel =
  document.getElementById("editPanel");

const editUsername =
  document.getElementById("editUsername");

const editCountry =
  document.getElementById("editCountry");

const editBio =
  document.getElementById("editBio");

const saveProfile =
  document.getElementById("saveProfile");

const cancelEdit =
  document.getElementById("cancelEdit");


let currentUser = null;

let viewedUserId = null;

let viewedProfile = null;


/* =========================================
   HELPERS
========================================= */

function escapeHTML(value){

  const div =
    document.createElement("div");

  div.textContent =
    value ?? "";

  return div.innerHTML;

}


function showError(text){

  statusBox.className =
    "status error";

  statusBox.textContent =
    text;

}


/* =========================================
   GET CURRENT USER
========================================= */

async function getCurrentUser(){

  const {
    data:{
      user
    },
    error
  } =
  await supabaseClient.auth.getUser();


  if(error){

    console.error(error);

  }


  return user || null;

}


/* =========================================
   GET PROFILE ID FROM URL
========================================= */

function getProfileIdFromURL(){

  const params =
    new URLSearchParams(
      window.location.search
    );


  return (
    params.get("user_id") ||
    null
  );

}


/* =========================================
   LOAD PROFILE
========================================= */

async function loadProfile(){

  currentUser =
    await getCurrentUser();


  const urlUserId =
    getProfileIdFromURL();


  if(urlUserId){

    viewedUserId =
      urlUserId;

  }else if(currentUser){

    viewedUserId =
      currentUser.id;

  }else{

    window.location.href =
      "login.html";

    return;

  }


  const {
    data,
    error
  } =
  await supabaseClient

    .from("profiles")

    .select(
      'username, country, bio, role, badge, premium, "user-id", created_at'
    )

    .eq(
      "user-id",
      viewedUserId
    )

    .maybeSingle();


  if(error){

    console.error(
      "Profile error:",
      error
    );

    showError(
      "❌ Could not load this profile."
    );

    return;

  }


  if(!data){

    showError(
      "❌ This profile could not be found."
    );

    return;

  }


  viewedProfile =
    data;


  displayProfile();

}


/* =========================================
   DISPLAY PROFILE
========================================= */

function displayProfile(){

  const profile =
    viewedProfile;


  const name =
    profile.username ||
    "TeenSpace User";


  const profileCountry =
    profile.country ||
    "Country not set";


  const profileBio =
    profile.bio ||
    "No bio yet.";


  const role =
    profile.role ||
    "user";


  const isPremium =
    profile.premium === true;


  username.textContent =
    name;


  country.textContent =
    "🌍 " +
    profileCountry;


  bio.textContent =
    profileBio;


  const firstLetter =
    name
      .trim()
      .charAt(0)
      .toUpperCase();


  avatar.textContent =
    firstLetter ||
    "👤";


  /* =====================================
     BADGES
  ===================================== */

  badges.innerHTML =
    "";


  if(role === "owner"){

    const badge =
      document.createElement(
        "span"
      );

    badge.className =
      "badge owner";

    badge.textContent =
      "👑 " +
      (
        profile.badge ||
        "FOUNDER"
      );

    badges.appendChild(
      badge
    );

  }else if(role === "staff"){

    const badge =
      document.createElement(
        "span"
      );

    badge.className =
      "badge staff";

    badge.textContent =
      "🛡️ STAFF";

    badges.appendChild(
      badge
    );

  }else{

    const badge =
      document.createElement(
        "span"
      );

    badge.className =
      "badge member";

    badge.textContent =
      "👤 MEMBER";

    badges.appendChild(
      badge
    );

  }


  if(isPremium){

    const premiumBadge =
      document.createElement(
        "span"
      );

    premiumBadge.className =
      "badge premium";

    premiumBadge.textContent =
      "💎 PREMIUM";

    badges.appendChild(
      premiumBadge
    );

  }


  /* =====================================
     ACTIONS
  ===================================== */

  actions.innerHTML =
    "";


  const isOwnProfile =
    currentUser &&
    currentUser.id ===
      viewedUserId;


  if(isOwnProfile){

    const editButton =
      document.createElement(
        "button"
      );

    editButton.className =
      "action-btn edit-btn";

    editButton.textContent =
      "✏️ Edit Profile";


    editButton.addEventListener(
      "click",
      function(){

        openEditPanel();

      }
    );


    actions.appendChild(
      editButton
    );


  }else{

    const privateButton =
      document.createElement(
        "a"
      );


    privateButton.className =
      "action-btn private-btn";


    privateButton.href =
      "messages.html?user_id=" +
      encodeURIComponent(
        viewedUserId
      ) +
      "&name=" +
      encodeURIComponent(
        name
      );


    privateButton.textContent =
      "💬 Private Message";


    actions.appendChild(
      privateButton
    );

  }


  statusBox.style.display =
    "none";

  profileCard.style.display =
    "block";


  document.title =
    name +
    " | TeenSpace 🌍";

}


/* =========================================
   EDIT PANEL
========================================= */

function openEditPanel(){

  editUsername.value =
    viewedProfile.username ||
    "";

  editCountry.value =
    viewedProfile.country ||
    "";

  editBio.value =
    viewedProfile.bio ||
    "";


  editPanel.classList.add(
    "show"
  );


  editPanel.scrollIntoView({
    behavior:"smooth",
    block:"start"
  });

}


cancelEdit.addEventListener(
  "click",
  function(){

    editPanel.classList.remove(
      "show"
    );

  }
);


/* =========================================
   SAVE PROFILE
========================================= */

saveProfile.addEventListener(
  "click",
  async function(){

    if(
      !currentUser ||
      currentUser.id !==
        viewedUserId
    ){

      return;

    }


    const newUsername =
      editUsername.value.trim();


    const newCountry =
      editCountry.value;


    const newBio =
      editBio.value.trim();


    if(!newUsername){

      alert(
        "Please enter a username."
      );

      return;

    }


    if(newUsername.length < 2){

      alert(
        "Username must be at least 2 characters."
      );

      return;

    }


    saveProfile.disabled =
      true;

    saveProfile.textContent =
      "Saving...";


    const {
      error
    } =
    await supabaseClient

      .from("profiles")

      .update({

        username:
          newUsername,

        country:
          newCountry,

        bio:
          newBio

      })

      .eq(
        "user-id",
        currentUser.id
      );


    if(error){

      console.error(error);

      alert(
        "Could not save profile: " +
        error.message
      );

      saveProfile.disabled =
        false;

      saveProfile.textContent =
        "💾 Save Changes";

      return;

    }


    viewedProfile.username =
      newUsername;

    viewedProfile.country =
      newCountry;

    viewedProfile.bio =
      newBio;


    displayProfile();


    editPanel.classList.add(
      "show"
    );


    showTemporarySuccess();

    saveProfile.disabled =
      false;

    saveProfile.textContent =
      "💾 Save Changes";

  }
);


/* =========================================
   SUCCESS MESSAGE
========================================= */

function showTemporarySuccess(){

  const notice =
    document.createElement(
      "div"
    );

  notice.className =
    "status success";

  notice.textContent =
    "✅ Profile updated!";


  profileCard.parentNode.insertBefore(
    notice,
    profileCard
  );


  setTimeout(
    function(){

      notice.remove();

    },
    2500
  );

}


/* =========================================
   START
========================================= */

loadProfile();

</script>

</body>

</html>
