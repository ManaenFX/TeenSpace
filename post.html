```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Post | TeenSpace 🌍</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{
margin:0;
background:#f4f7ff;
color:#222;
}


.container{
width:92%;
max-width:700px;
margin:50px auto;
}


h1{
text-align:center;
color:#6c5ce7;
font-size:40px;
margin-bottom:30px;
}


.card{
background:white;
padding:30px;
border-radius:25px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
}


textarea{
width:100%;
height:200px;
padding:20px;
border-radius:15px;
border:1px solid #ccc;
font-size:18px;
resize:vertical;
outline:none;
line-height:1.6;
}


textarea:focus{
border-color:#6c5ce7;
box-shadow:0 0 0 3px rgba(108,92,231,.10);
}


.quote-box{
display:none;
margin-bottom:15px;
padding:14px;
background:#f2efff;
border-left:5px solid #6c5ce7;
border-radius:10px;
color:#555;
line-height:1.5;
white-space:pre-wrap;
word-break:break-word;
}


.quote-title{
font-size:13px;
font-weight:bold;
color:#6c5ce7;
margin-bottom:6px;
}


button{
width:100%;
margin-top:20px;
padding:18px;
background:#6c5ce7;
color:white;
border:none;
border-radius:15px;
font-size:22px;
font-weight:bold;
cursor:pointer;
}


button:hover{
background:#5849c4;
}


button:disabled{
opacity:.6;
cursor:not-allowed;
}


.message{
text-align:center;
margin-top:20px;
font-size:18px;
line-height:1.5;
min-height:25px;
}


.success{
color:#159447;
}


.error{
color:#ff3366;
}


.back{
display:block;
text-align:center;
margin-top:25px;
color:#6c5ce7;
font-weight:bold;
text-decoration:none;
}


</style>

</head>


<body>


<div class="container">


<h1>
✍️ Create a Post
</h1>


<div class="card">


<div
id="quoteBox"
class="quote-box"
>

<div class="quote-title">
💬 Replying to
</div>

<div id="quotePreview"></div>

</div>


<textarea
id="content"
maxlength="2000"
placeholder="Share something with TeenSpace..."
></textarea>


<button
id="publishButton"
onclick="createPost()"
>

Publish Post 🚀

</button>


<div
id="message"
class="message"
></div>


</div>


<a
href="community.html"
class="back"
>

← Back to Community

</a>


</div>




<script>


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://gcigveojqwwovitlwtxl.supabase.co";


const SUPABASE_KEY =
"sb_publishable_Br7HdEgbHvQxx4_8HHR9Fg_fJ5sH_r7";


const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY,
{
auth:{
persistSession:true,
autoRefreshToken:true,
detectSessionInUrl:true
}
}
);


/* =========================================
   ELEMENTS
========================================= */

const contentBox =
document.getElementById("content");

const message =
document.getElementById("message");

const publishButton =
document.getElementById("publishButton");

const quoteBox =
document.getElementById("quoteBox");

const quotePreview =
document.getElementById("quotePreview");


/* =========================================
   MESSAGE HELPER
========================================= */

function showMessage(
text,
type
){

message.className =
"message " + type;

message.textContent =
text;

}


/* =========================================
   LOAD QUOTE
========================================= */

function loadQuote(){

const params =
new URLSearchParams(
window.location.search
);


const quotedText =
params.get("quote");


if(!quotedText){
return;
}


/*
  Show quoted message
  above the composer.
*/

quoteBox.style.display =
"block";


quotePreview.textContent =
quotedText;


/*
  Also place it in the
  text box so the user
  can add their reply.
*/

contentBox.value =
quotedText + "\n\n";


/*
  Put cursor at end.
*/

contentBox.focus();

contentBox.setSelectionRange(
contentBox.value.length,
contentBox.value.length
);

}


/* =========================================
   CREATE POST
========================================= */

async function createPost(){

const content =
contentBox.value.trim();


if(!content){

showMessage(
"Please write something first.",
"error"
);

return;

}


publishButton.disabled =
true;

publishButton.textContent =
"Publishing... 🚀";


try{


/* =====================================
   GET CURRENT SESSION
===================================== */

const {
data:{
session
},
error:sessionError
}
=
await supabaseClient.auth.getSession();


if(sessionError){

throw sessionError;

}


if(
!session ||
!session.user
){

showMessage(
"You need to login before creating a post.",
"error"
);

publishButton.disabled =
false;

publishButton.textContent =
"Publish Post 🚀";

return;

}


const user =
session.user;


/* =====================================
   INSERT POST
===================================== */

const {
data,
error
}
=
await supabaseClient

.from("posts")

.insert({

user_id:
user.id,

content:
content

})

.select()
.single();


if(error){

console.error(
"Post insert error:",
error
);

throw error;

}


console.log(
"Post created:",
data
);


showMessage(
"✅ Post published successfully!",
"success"
);


contentBox.value =
"";


quoteBox.style.display =
"none";


/* =====================================
   RETURN TO COMMUNITY
===================================== */

setTimeout(
function(){

window.location.href =
"community.html";

},
1000
);


}catch(error){

console.error(error);


showMessage(
"❌ " +
(
error.message ||
"Could not publish post."
),
"error"
);


publishButton.disabled =
false;

publishButton.textContent =
"Publish Post 🚀";

}

}


/* =========================================
   START
========================================= */

loadQuote();

</script>


</body>
</html>
```
