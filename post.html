<style>

*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:
    linear-gradient(135deg,#f4f7ff,#eee8ff);

header{

/* QUOTE */

.quote-box{

}

/* EMOJI */

  border:none;

/* ATTACHMENT */

.preview{
  display:none;
  margin-top:14px;
  padding:14px;
  background:#faf9ff;
  border-radius:14px;
}

.preview img,
.preview video{
  width:100%;
  max-height:350px;

}

  width:100%;
}


/* PUBLISH */

.publish{
  width:100%;
  margin-top:14px;
  padding:17px;
  border:none;
  border-radius:14px;

  font-size:20px;
  font-weight:bold;

  background:#5747cf;
}

  opacity:.6;

}


/* STATUS */

#status{
  min-height:25px;
  text-align:center;
  margin-top:14px;
  line-height:1.5;
}

.success{
  color:#159447;
}

.error{
  color:#d63050;
}


/* LIVE FEED */

.feed-title{
  margin:40px 0 18px;
  color:#5f4ce0;
  font-size:27px;
  font-weight:bold;
}

.post{
  background:white;
  padding:22px;
  border-radius:20px;
  margin-bottom:18px;
  box-shadow:0 8px 24px rgba(0,0,0,.07);
  border-left:5px solid #6c5ce7;
}

.post-user{
  color:#5f4ce0;
  font-weight:bold;
  font-size:19px;
}

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:7px;
}

.badge{
  padding:5px 9px;
  border-radius:999px;
  font-size:11px;
  font-weight:bold;
}

.owner{
  background:#fff0b3;
  color:#946c00;
}

.staff{
  background:#e1f0ff;
  color:#1769aa;
}

.premium{
  background:#ffe0ef;
  color:#b52270;
}

.member{
  background:#eeeaff;
  color:#5f4ce0;
}

.post-content{
  margin-top:15px;
  font-size:18px;
  line-height:1.6;
  white-space:pre-wrap;
  word-break:break-word;
}

.post-media{
  margin-top:14px;
}

.post-media img,
.post-media video{
  width:100%;
  max-height:380px;
  object-fit:contain;
  border-radius:14px;
  background:#111;
}

.post-media audio{
  width:100%;
}

.post-time{
  margin-top:12px;
  color:#999;
  font-size:13px;
}

.empty{
  background:white;
  padding:30px;
  border-radius:18px;
  text-align:center;
  color:#777;
}


/* FOOTER */

footer{
  background:#222;
  color:white;
  text-align:center;
  padding:25px;
}


/* MOBILE */

@media(max-width:700px){

  header{
    flex-direction:column;
    gap:14px;
  }

  nav a{
    margin:4px 6px;
    display:inline-block;
  }

  .page{
    width:94%;
  }

}

</style>

<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://gcigveojqwwovitlwtxl.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Br7HdEgbHvQxx4_8HHR9Fg_fJ5sH_r7";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true
      }
    }
  );


/* =========================================
   ELEMENTS
========================================= */

const content =
  document.getElementById("content");

const publishButton =
  document.getElementById("publishButton");

const status =
  document.getElementById("status");

const feed =
  document.getElementById("feed");

const emojiButton =
  document.getElementById("emojiButton");

const emojiPanel =
  document.getElementById("emojiPanel");

const mediaButton =
  document.getElementById("mediaButton");

const mediaInput =
  document.getElementById("mediaInput");

const preview =
  document.getElementById("preview");

const voiceButton =
  document.getElementById("voiceButton");

const quoteBox =
  document.getElementById("quoteBox");

const quotePreview =
  document.getElementById("quotePreview");


let currentUser = null;
let selectedMedia = null;
let mediaType = null;
let mediaPath = null;
let voiceBlob = null;
let mediaRecorder = null;
let audioChunks = [];
let recording = false;


/* =========================================
   HELPERS
========================================= */

function escapeHTML(value){

  const div =
    document.createElement("div");

  div.textContent =
    value ?? "";

  return div.innerHTML;

}


function showStatus(
  text,
  type
){

  status.className =
    type || "";

  status.textContent =
    text;

}


/* =========================================
   EMOJI PANEL
========================================= */

emojiButton.addEventListener(
  "click",
  function(){

    emojiPanel.style.display =
      emojiPanel.style.display === "block"
        ? "none"
        : "block";

  }
);


document.querySelectorAll(
  ".emoji"
).forEach(
  button => {

    button.addEventListener(
      "click",
      function(){

        const emoji =
          button.textContent;

        const start =
          content.selectionStart;

        const end =
          content.selectionEnd;

        const value =
          content.value;

        content.value =
          value.slice(0,start) +
          emoji +
          value.slice(end);

        content.focus();

        content.selectionStart =
          start + emoji.length;

        content.selectionEnd =
          start + emoji.length;

      }
    );

  }
);


/* =========================================
   MEDIA PICKER
========================================= */

mediaButton.addEventListener(
  "click",
  function(){

    mediaInput.click();

  }
);


mediaInput.addEventListener(
  "change",
  function(){

    const file =
      mediaInput.files[0];

    if(!file){
      return;
    }


    /*
      Basic client-side limits.
      Keep uploads manageable.
    */

    const maxSize =
      25 * 1024 * 1024;


    if(file.size > maxSize){

      showStatus(
        "❌ Media must be 25MB or smaller.",
        "error"
      );

      mediaInput.value =
        "";

      return;

    }


    selectedMedia =
      file;


    mediaType =
      file.type.startsWith("video/")
        ? "video"
        : "image";


    preview.style.display =
      "block";


    const objectURL =
      URL.createObjectURL(file);


    if(mediaType === "image"){

      preview.innerHTML = `
        <img
          src="${objectURL}"
          alt="Selected media"
        >
      `;

    }else{

      preview.innerHTML = `
        <video
          src="${objectURL}"
          controls
        ></video>
      `;

    }

  }
);


/* =========================================
   VOICE RECORDING
========================================= */

voiceButton.addEventListener(
  "click",
  async function(){

    if(recording){

      stopRecording();

      return;

    }


    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      showStatus(
        "❌ Voice recording isn't supported in this browser.",
        "error"
      );

      return;

    }


    try{

      const stream =
        await navigator.mediaDevices.getUserMedia({
          audio:true
        });


      audioChunks = [];


      mediaRecorder =
        new MediaRecorder(stream);


      mediaRecorder.ondataavailable =
        function(event){

          if(event.data.size > 0){

            audioChunks.push(
              event.data
            );

          }

        };


      mediaRecorder.onstop =
        function(){

          const blob =
            new Blob(
              audioChunks,
              {
                type:
                  mediaRecorder.mimeType ||
                  "audio/webm"
              }
            );


          voiceBlob =
            blob;


          selectedMedia =
            null;

          mediaType =
            null;


          preview.style.display =
            "block";


          const url =
            URL.createObjectURL(blob);


          preview.innerHTML = `

            <audio
              class="voice-preview"
              src="${url}"
              controls
            ></audio>

          `;


          stream
            .getTracks()
            .forEach(
              track =>
                track.stop()
            );

        };


      mediaRecorder.start();

      recording =
        true;


      voiceButton.classList.add(
        "recording"
      );

      voiceButton.textContent =
        "⏹️ Stop Recording";


    }catch(error){

      console.error(error);

      showStatus(
        "❌ Microphone permission was not available.",
        "error"
      );

    }

  }
);


function stopRecording(){

  if(
    mediaRecorder &&
    recording
  ){

    mediaRecorder.stop();

    recording =
      false;


    voiceButton.classList.remove(
      "recording"
    );

    voiceButton.textContent =
      "🎤 Voice";

  }

}


/* =========================================
   STORAGE UPLOAD
========================================= */

async function uploadFile(
  file,
  folder
){

  const extension =
    file.name.includes(".")
      ? file.name
          .split(".")
          .pop()
          .toLowerCase()
      : "bin";


  const path =
    currentUser.id +
    "/" +
    folder +
    "/" +
    crypto.randomUUID() +
    "." +
    extension;


  const {
    data,
    error
  } =
  await supabaseClient

    .storage

    .from("community-media")

    .upload(
      path,
      file,
      {
        contentType:
          file.type,
        upsert:false
      }
    );


  if(error){

    throw error;

  }


  return data.path;

}


/* =========================================
   SIGNED URL
========================================= */

async function getSignedUrl(
  path
){

  const {
    data,
    error
  } =
  await supabaseClient

    .storage

    .from("community-media")

    .createSignedUrl(
      path,
      3600
    );


  if(error){

    console.error(
      "Signed URL error:",
      error
    );

    return null;

  }


  return data.signedUrl;

}


/* =========================================
   LOAD CURRENT USER
========================================= */

async function loadUser(){

  const {
    data:{
      session
    },
    error
  } =
  await supabaseClient
    .auth
    .getSession();


  if(
    error ||
    !session ||
    !session.user
  ){

    window.location.href =
      "login.html";

    return null;

  }


  currentUser =
    session.user;


  return currentUser;

}


/* =========================================
   QUOTE
========================================= */

function loadQuote(){

  const params =
    new URLSearchParams(
      window.location.search
    );


  const quote =
    params.get("quote");


  if(!quote){
    return;
  }


  quoteBox.style.display =
    "block";


  quotePreview.textContent =
    quote;


  content.value =
    quote + "\n\n";


  content.focus();

}


/* =========================================
   PUBLISH
========================================= */

publishButton.addEventListener(
  "click",
  async function(){

    const text =
      content.value.trim();


    if(
      !text &&
      !selectedMedia &&
      !voiceBlob
    ){

      showStatus(
        "Write something or add media first.",
        "error"
      );

      return;

    }


    publishButton.disabled =
      true;

    publishButton.textContent =
      "Publishing...";


    try{

      if(!currentUser){

        await loadUser();

      }


      let uploadedMediaPath =
        null;

      let uploadedVoicePath =
        null;


      /* MEDIA */

      if(selectedMedia){

        uploadedMediaPath =
          await uploadFile(
            selectedMedia,
            "media"
          );

      }


      /* VOICE */

      if(voiceBlob){

        uploadedVoicePath =
          await uploadFile(
            voiceBlob,
            "voice"
          );

      }


      /* POST */

      const {
        error
      } =
      await supabaseClient

        .from("posts")

        .insert({

          user_id:
            currentUser.id,

          content:
            text,

          media_url:
            uploadedMediaPath,

          voice_url:
            uploadedVoicePath

        });


      if(error){

        throw error;

      }


      showStatus(
        "✅ Published!",
        "success"
      );


      content.value =
        "";

      selectedMedia =
        null;

      voiceBlob =
        null;

      mediaInput.value =
        "";

      preview.innerHTML =
        "";

      preview.style.display =
        "none";


      quoteBox.style.display =
        "none";


      await loadFeed();


    }catch(error){

      console.error(
        "Publish error:",
        error
      );


      showStatus(
        "❌ " +
        error.message,
        "error"
      );


    }


    publishButton.disabled =
      false;

    publishButton.textContent =
      "Publish Post 🚀";

  }
);


/* =========================================
   LOAD FEED
========================================= */

async function loadFeed(){

  const {
    data:posts,
    error
  } =
  await supabaseClient

    .from("posts")

    .select(
      "id, user_id, content, created_at, edited, media_url, voice_url"
    )

    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(error){

    console.error(error);

    feed.innerHTML = `

      <div class="empty">

        ❌ Could not load posts.

      </div>

    `;

    return;

  }


  if(
    !posts ||
    posts.length === 0
  ){

    feed.innerHTML = `

      <div class="empty">

        🌟 No posts yet.

      </div>

    `;

    return;

  }


  /* PROFILE IDS */

  const ids =
    [
      ...new Set(
        posts.map(
          post =>
            post.user_id
        )
      )
    ];


  let profiles = [];


  if(ids.length){

    const {
      data
    } =
    await supabaseClient

      .from("profiles")

      .select(
        'username, role, badge, premium, "user-id"'
      )

      .in(
        "user-id",
        ids
      );


    profiles =
      data || [];

  }


  const profileMap =
    new Map();


  profiles.forEach(profile => {

    profileMap.set(
      profile["user-id"],
      profile
    );

  });


  feed.innerHTML =
    "";


  for(
    const post of posts
  ){

    const profile =
      profileMap.get(
        post.user_id
      ) || {};


    const username =
      profile.username ||
      "TeenSpace User";


    let badges =
      "";


    if(
      profile.role === "owner"
    ){

      badges += `

        <span class="badge owner">
          👑 ${escapeHTML(
            profile.badge ||
            "FOUNDER"
          )}
        </span>

      `;

    }else if(
      profile.role === "staff"
    ){

      badges += `

        <span class="badge staff">
          🛡️ STAFF
        </span>

      `;

    }else{

      badges += `

        <span class="badge member">
          👤 MEMBER
        </span>

      `;

    }


    if(
      profile.premium === true
    ){

      badges += `

        <span class="badge premium">
          💎 PREMIUM
        </span>

      `;

    }


    let mediaHTML =
      "";


    if(
      post.media_url
    ){

      const url =
        await getSignedUrl(
          post.media_url
        );


      if(url){

        if(
          /\.(mp4|webm|mov|m4v)$/i
            .test(post.media_url)
        ){

          mediaHTML = `

            <div class="post-media">

              <video
                src="${url}"
                controls
                preload="metadata"
              ></video>

            </div>

          `;

        }else{

          mediaHTML = `

            <div class="post-media">

              <img
                src="${url}"
                alt="Community media"
              >

            </div>

          `;

        }

      }

    }


    if(
      post.voice_url
    ){

      const url =
        await getSignedUrl(
          post.voice_url
        );


      if(url){

        mediaHTML += `

          <div class="post-media">

            <audio
              src="${url}"
              controls
            ></audio>

          </div>

        `;

      }

    }


    const card =
      document.createElement(
        "article"
      );


    card.className =
      "post";


    card.innerHTML = `

      <div class="post-user">

        👤 ${escapeHTML(username)}

        <div class="badges">

          ${badges}

        </div>

      </div>


      ${
        post.content
          ? `
            <div class="post-content">
              ${escapeHTML(
                post.content
              )}
            </div>
          `
          : ""
      }


      ${mediaHTML}


      <div class="post-time">

        ${new Date(
          post.created_at
        ).toLocaleString()}

        ${
          post.edited
            ? " · edited"
            : ""
        }

      </div>

    `;


    feed.appendChild(
      card
    );

  }

}


/* =========================================
   AUTO REFRESH
========================================= */

setInterval(
  loadFeed,
  10000
);


/* =========================================
   START
========================================= */

async function start(){

  const user =
    await loadUser();


  if(!user){
    return;
  }


  loadQuote();

  await loadFeed();
