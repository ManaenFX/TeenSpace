
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Post | TeenSpace 🌍</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f7ff;
      color: #222;
    }

    header {
      background: #6c5ce7;
      color: white;
      padding: 18px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 18px;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .container {
      width: 92%;
      max-width: 850px;
      margin: 60px auto;
    }

    .box {
      background: white;
      padding: 35px;
      border-radius: 22px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      color: #6352e8;
      margin-bottom: 30px;
    }

    textarea,
    select {
      width: 100%;
      padding: 18px;
      border: 1px solid #ccc;
      border-radius: 15px;
      font-size: 18px;
      margin-bottom: 18px;
      outline: none;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
    }

    textarea:focus,
    select:focus {
      border-color: #6352e8;
    }

    button {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 15px;
      background: #6352e8;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #5140d5;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      text-align: center;
      margin-top: 20px;
      font-size: 18px;
      line-height: 1.5;
    }

    .error {
      color: #ff3366;
    }

    .success {
      color: #00a86b;
    }

    @media (max-width: 700px) {
      header {
        flex-direction: column;
        gap: 15px;
      }

      nav a {
        margin: 5px;
        display: inline-block;
      }

      .container {
        margin: 35px auto;
      }

      .box {
        padding: 22px;
      }
    }
  </style>
</head>

<body>

  <header>

    <div class="logo">
      🌍 TeenSpace
    </div>

    <nav>
      <a href="home.html">Home</a>
      <a href="explore.html">Explore</a>
      <a href="community.html">Community</a>
      <a href="profile.html">Profile</a>
    </nav>

  </header>


  <div class="container">

    <div class="box">

      <h1>💬 Create a Post</h1>

      <textarea
        id="content"
        placeholder="What's on your mind?"
      ></textarea>

      <select id="topic">

        <option value="Around the World">
          🌍 Around the World
        </option>

        <option value="Gaming">
          🎮 Gaming
        </option>

        <option value="Creativity">
          🎨 Creativity
        </option>

        <option value="School & Learning">
          📚 School & Learning
        </option>

        <option value="Ideas & Projects">
          💡 Ideas & Projects
        </option>

      </select>

      <button id="publishButton">
        Publish Post 🚀
      </button>

      <div id="message"></div>

    </div>

  </div>


  <script>

    // =====================================================
    // SUPABASE
    // =====================================================

    const SUPABASE_URL =
      "https://gcigveojqwwovitlwtxl.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_Br7HdEgbHvQxx4_8HHR9Fg_fJ5sH_r7";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // =====================================================
    // ELEMENTS
    // =====================================================

    const content =
      document.getElementById("content");

    const topic =
      document.getElementById("topic");

    const publishButton =
      document.getElementById("publishButton");

    const message =
      document.getElementById("message");


    // =====================================================
    // CHECK LOGIN
    // =====================================================

    async function checkLogin() {

      const {
        data: { user },
        error
      } =
        await supabaseClient.auth.getUser();


      if (error || !user) {

        window.location.href =
          "index.html";

        return null;

      }


      return user;

    }


    // =====================================================
    // PUBLISH POST
    // =====================================================

    publishButton.addEventListener(
      "click",
      async function() {

        const text =
          content.value.trim();


        if (!text) {

          message.className =
            "error";

          message.textContent =
            "❌ Please write something first.";

          return;

        }


        publishButton.disabled =
          true;

        publishButton.textContent =
          "Publishing...";

        message.textContent = "";


        try {

          const user =
            await checkLogin();


          if (!user) {

            return;

          }


          // IMPORTANT:
          // Your existing database uses "user-id"
          // instead of "user_id".

          const {
            error
          } =
            await supabaseClient
              .from("posts")
              .insert({

                "user-id": user.id,

                content: text,

                topic: topic.value

              });


          if (error) {

            console.error(
              "Supabase post error:",
              error
            );

            throw error;

          }


          message.className =
            "success";

          message.textContent =
            "✅ Post published successfully!";


          content.value = "";


          setTimeout(
            function() {

              window.location.href =
                "community.html";

            },
            1000
          );


        } catch (error) {

          console.error(error);

          message.className =
            "error";

          message.textContent =
            "❌ Could not publish your post.";

        }


        publishButton.disabled =
          false;

        publishButton.textContent =
          "Publish Post 🚀";

      }
    );


    // =====================================================
    // START
    // =====================================================

    checkLogin();

  </script>

</body>
</html>
