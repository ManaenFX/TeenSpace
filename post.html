
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Post | TeenSpace 🌍</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f7ff;
      color: #222;
    }

    header {
      background: #6c5ce7;
      color: white;
      padding: 20px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 18px;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .container {
      width: 92%;
      max-width: 850px;
      margin: 50px auto;
    }

    .box {
      background: white;
      padding: 35px;
      border-radius: 22px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      color: #6c5ce7;
      margin-top: 0;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
      font-size: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      color: #444;
    }

    select,
    textarea {
      width: 100%;
      padding: 16px;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 18px;
      margin-bottom: 22px;
      outline: none;
      background: white;
    }

    select:focus,
    textarea:focus {
      border-color: #6c5ce7;
    }

    textarea {
      min-height: 220px;
      resize: vertical;
    }

    .publish {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 14px;
      background: #6c5ce7;
      color: white;
      font-size: 21px;
      font-weight: bold;
      cursor: pointer;
    }

    .publish:hover {
      background: #5849c4;
    }

    .publish:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    #message {
      text-align: center;
      margin-top: 22px;
      font-size: 18px;
      min-height: 25px;
    }

    .error {
      color: #ff2864;
    }

    .success {
      color: #159447;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #6c5ce7;
      text-decoration: none;
      font-weight: bold;
      font-size: 18px;
    }

    footer {
      background: #222;
      color: white;
      text-align: center;
      padding: 25px;
      margin-top: 50px;
    }

    @media (max-width: 700px) {

      header {
        flex-direction: column;
        gap: 15px;
      }

      nav a {
        margin: 5px;
        display: inline-block;
      }

      .box {
        padding: 25px 20px;
      }
    }
  </style>
</head>

<body>

  <header>

    <div class="logo">
      🌍 TeenSpace
    </div>

    <nav>
      <a href="home.html">Home</a>
      <a href="explore.html">Explore</a>
      <a href="community.html">Community</a>
      <a href="profile.html">Profile</a>
    </nav>

  </header>


  <main class="container">

    <div class="box">

      <h1>✍️ Create a Post</h1>

      <div class="subtitle">
        Share something with the TeenSpace community.
      </div>


      <label for="topic">
        Topic
      </label>

      <select id="topic">

        <option value="Around the World">
          🌎 Around the World
        </option>

        <option value="Gaming">
          🎮 Gaming
        </option>

        <option value="Creativity">
          🎨 Creativity
        </option>

        <option value="School & Learning">
          📚 School & Learning
        </option>

        <option value="Ideas & Projects">
          💡 Ideas & Projects
        </option>

      </select>


      <label for="content">
        Your post
      </label>

      <textarea
        id="content"
        placeholder="What's on your mind?"
      ></textarea>


      <button
        id="publishButton"
        class="publish"
      >
        Publish Post 🚀
      </button>


      <div id="message"></div>


      <a
        href="community.html"
        class="back"
      >
        ← Back to Community
      </a>

    </div>

  </main>


  <footer>

    © 2026 TeenSpace 🌍 |
    Made for teens, with safety in mind.

  </footer>


  <script>

    // ==========================================
    // SUPABASE
    // ==========================================

    const SUPABASE_URL =
      "https://gcigveojqwwovitlwtxl.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_Br7HdEgbHvQxx4_8HHR9Fg_fJ5sH_r7";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // ==========================================
    // ELEMENTS
    // ==========================================

    const topicInput =
      document.getElementById("topic");

    const contentInput =
      document.getElementById("content");

    const publishButton =
      document.getElementById("publishButton");

    const message =
      document.getElementById("message");


    // ==========================================
    // CHECK LOGIN
    // ==========================================

    async function checkLogin() {

      const {
        data: { user },
        error
      } =
        await supabaseClient.auth.getUser();


      if (error || !user) {

        window.location.href =
          "index.html";

        return null;
      }


      return user;
    }


    // ==========================================
    // PUBLISH POST
    // ==========================================

    publishButton.addEventListener(
      "click",
      async function() {

        const content =
          contentInput.value.trim();

        const topic =
          topicInput.value;


        if (!content) {

          message.className = "error";

          message.textContent =
            "❌ Please write something first.";

          return;
        }


        if (content.length > 2000) {

          message.className = "error";

          message.textContent =
            "❌ Your post is too long. Please keep it under 2000 characters.";

          return;
        }


        publishButton.disabled = true;

        publishButton.textContent =
          "Publishing...";


        message.className = "";

        message.textContent = "";


        try {

          const user =
            await checkLogin();


          if (!user) {
            return;
          }


          // IMPORTANT:
          // Your Supabase column is "user-id"
          // NOT "user_id".

          const { error } =
            await supabaseClient
              .from("posts")
              .insert([
                {
                  "user-id": user.id,
                  content: content,
                  topic: topic
                }
              ]);


          if (error) {

            console.error(
              "Supabase publish error:",
              error
            );

            throw error;
          }


          message.className =
            "success";

          message.textContent =
            "✅ Your post was published!";


          contentInput.value = "";


          setTimeout(function() {

            window.location.href =
              "community.html";

          }, 1000);


        } catch (error) {

          console.error(error);

          message.className =
            "error";

          message.textContent =
            "❌ Could not publish your post. Check your Supabase posts table permissions.";

          publishButton.disabled =
            false;

          publishButton.textContent =
            "Publish Post 🚀";
        }

      }
    );


    // ==========================================
    // START
    // ==========================================

    checkLogin();

  </script>

</body>
</html>
