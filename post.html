<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Post | TeenSpace 🌍</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
background:#f4f7ff;
color:#222;
}


.container{
width:92%;
max-width:700px;
margin:50px auto;
}


h1{
text-align:center;
color:#6c5ce7;
font-size:40px;
}


.card{

background:white;
padding:30px;
border-radius:20px;
box-shadow:0 8px 25px rgba(0,0,0,.08);

}


textarea,
select{

width:100%;
padding:18px;
margin-bottom:20px;
border-radius:12px;
border:1px solid #ccc;
font-size:18px;

}


textarea{

height:180px;
resize:none;

}


button{

width:100%;
padding:18px;
background:#6c5ce7;
color:white;
border:none;
border-radius:12px;
font-size:20px;
font-weight:bold;
cursor:pointer;

}


button:hover{

background:#5849c4;

}


#message{

text-align:center;
margin-top:20px;
font-size:18px;

}


.error{
color:#ff3366;
}


.success{
color:green;
}


.back{

display:block;
text-align:center;
margin-top:25px;
text-decoration:none;
color:#6c5ce7;
font-weight:bold;

}


</style>

</head>


<body>


<div class="container">


<h1>
✍️ Create Post
</h1>


<div class="card">


<select id="topic">

<option value="Around the World">
🌎 Around the World
</option>

<option value="Gaming">
🎮 Gaming
</option>

<option value="Creativity">
🎨 Creativity
</option>

<option value="School">
📚 School & Learning
</option>

<option value="Ideas">
💡 Ideas & Projects
</option>

</select>



<textarea
id="content"
placeholder="What do you want to share?"
></textarea>



<button id="postBtn">

Publish Post 🚀

</button>


<div id="message"></div>


</div>



<a class="back" href="community.html">
← Back to Community
</a>


</div>



<script>


const SUPABASE_URL =
"https://gcigveojqwwovitlwtxl.supabase.co";


const SUPABASE_KEY =
"sb_publishable_Br7HdEgbHvQxx4_8HHR9Fg_fJ5sH_r7";


const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



const content =
document.getElementById("content");


const topic =
document.getElementById("topic");


const button =
document.getElementById("postBtn");


const message =
document.getElementById("message");




async function createPost(){


button.disabled=true;

button.textContent=
"Publishing...";



try{


const {

data:{
user
}

}
=
await supabaseClient.auth.getUser();



if(!user){


window.location.href="index.html";

return;


}



const postText =
content.value.trim();



if(!postText){


throw new Error(
"Write something first."
);


}



const {error}=

await supabaseClient

.from("posts")

.insert({

user_id:user.id,

content:postText,

topic:topic.value

});



if(error){

throw error;

}



message.className="success";

message.textContent=
"✅ Post published!";


setTimeout(()=>{

window.location.href=
"community.html";

},1200);



}

catch(error){


console.log(error);


message.className="error";

message.textContent=
"❌ "+error.message;



}


button.disabled=false;

button.textContent=
"Publish Post 🚀";


}



button.addEventListener(
"click",
createPost
);



</script>


</body>
</html>
