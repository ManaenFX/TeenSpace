
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TeenSpace - Join</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #f4f7ff, #eeeaff);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .box {
      width: 100%;
      max-width: 520px;
      background: white;
      padding: 38px;
      border-radius: 28px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.10);
    }

    .logo {
      text-align: center;
      font-size: 48px;
      margin-bottom: 5px;
    }

    h1 {
      text-align: center;
      color: #6352e8;
      font-size: 42px;
      margin: 0;
    }

    .subtitle {
      text-align: center;
      color: #666;
      font-size: 18px;
      margin: 10px 0 30px;
      line-height: 1.5;
    }

    label {
      display: block;
      color: #555;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    select {
      width: 100%;
      padding: 15px;
      margin-bottom: 17px;
      border: 1px solid #ccc;
      border-radius: 13px;
      font-size: 16px;
      outline: none;
      background: white;
    }

    input:focus,
    select:focus {
      border-color: #6352e8;
      box-shadow: 0 0 0 3px rgba(99,82,232,0.12);
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 13px;
      background: #6352e8;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    button:hover {
      background: #5140d5;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      text-align: center;
      min-height: 25px;
      margin: 18px 0;
      line-height: 1.5;
    }

    .error {
      color: #e53935;
    }

    .success {
      color: #159447;
    }

    .login-box {
      text-align: center;
      margin-top: 25px;
      padding-top: 22px;
      border-top: 1px solid #eee;
      color: #666;
    }

    .login-box a {
      color: #6352e8;
      font-weight: bold;
      text-decoration: none;
    }

    .login-box a:hover {
      text-decoration: underline;
    }

    .small {
      text-align: center;
      color: #999;
      font-size: 13px;
      margin-top: 20px;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      .box {
        padding: 28px 22px;
      }

      h1 {
        font-size: 35px;
      }

      .logo {
        font-size: 42px;
      }
    }
  </style>
</head>

<body>

<div class="box">

  <div class="logo">🌍</div>

  <h1>TeenSpace</h1>

  <div class="subtitle">
    Meet the TeenSpace community.<br>
    Create your profile and explore.
  </div>


  <form id="signupForm">

    <label for="username">
      Username
    </label>

    <input
      id="username"
      type="text"
      placeholder="Choose your username"
      maxlength="30"
      autocomplete="username"
      required
    >


    <label for="country">
      Country
    </label>

    <select id="country" required>

      <option value="">
        🌍 Select your country
      </option>

      <option>Nigeria</option>
      <option>Ghana</option>
      <option>South Africa</option>
      <option>Kenya</option>
      <option>Uganda</option>
      <option>Tanzania</option>
      <option>Rwanda</option>
      <option>Egypt</option>
      <option>Morocco</option>
      <option>Algeria</option>
      <option>Zimbabwe</option>
      <option>Zambia</option>
      <option>Cameroon</option>
      <option>Ethiopia</option>

      <option>United Kingdom</option>
      <option>Ireland</option>
      <option>France</option>
      <option>Germany</option>
      <option>Spain</option>
      <option>Italy</option>
      <option>Portugal</option>
      <option>Netherlands</option>
      <option>Belgium</option>
      <option>Switzerland</option>
      <option>Austria</option>
      <option>Sweden</option>
      <option>Norway</option>
      <option>Denmark</option>
      <option>Finland</option>
      <option>Poland</option>
      <option>Greece</option>
      <option>Ukraine</option>

      <option>United States</option>
      <option>Canada</option>
      <option>Brazil</option>
      <option>Mexico</option>
      <option>Argentina</option>

      <option>India</option>
      <option>China</option>
      <option>Japan</option>
      <option>South Korea</option>
      <option>Philippines</option>
      <option>Indonesia</option>
      <option>Malaysia</option>
      <option>Singapore</option>

      <option>Australia</option>
      <option>New Zealand</option>

    </select>


    <label for="email">
      Email
    </label>

    <input
      id="email"
      type="email"
      placeholder="Your email"
      autocomplete="email"
      required
    >


    <label for="password">
      Password
    </label>

    <input
      id="password"
      type="password"
      placeholder="Create a password"
      minlength="6"
      autocomplete="new-password"
      required
    >


    <div id="message"></div>


    <button id="signupButton" type="submit">
      Join TeenSpace 🚀
    </button>

  </form>


  <div class="login-box">
    Already have an account?
    <a href="login.html">Log In</a>
  </div>


  <div class="small">
    Create one account and one TeenSpace profile.
  </div>

</div>


<script>

  // ==========================================
  // SUPABASE
  // ==========================================

  const SUPABASE_URL =
    "https://gcigveojqwwovitlwtxl.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_Br7HdEgbHvQxx4_8HHR9Fg_fJ5sH_r7";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ==========================================
  // ELEMENTS
  // ==========================================

  const signupForm =
    document.getElementById("signupForm");

  const usernameInput =
    document.getElementById("username");

  const countryInput =
    document.getElementById("country");

  const emailInput =
    document.getElementById("email");

  const passwordInput =
    document.getElementById("password");

  const signupButton =
    document.getElementById("signupButton");

  const message =
    document.getElementById("message");


  // ==========================================
  // SIGN UP
  // ==========================================

  signupForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const username =
        usernameInput.value.trim();

      const country =
        countryInput.value;

      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;


      if (
        !username ||
        !country ||
        !email ||
        !password
      ) {

        message.className = "error";

        message.textContent =
          "❌ Please complete all fields.";

        return;
      }


      signupButton.disabled = true;

      signupButton.textContent =
        "Creating account...";

      message.textContent = "";


      try {

        // ======================================
        // CREATE AUTH ACCOUNT
        // ======================================

        const {
          data,
          error
        } = await supabaseClient.auth.signUp({

          email: email,

          password: password,

          options: {

            data: {

              username: username,

              country: country

            }

          }

        });


        if (error) {

          console.error(error);

          message.className = "error";

          message.textContent =
            "❌ " + error.message;

          signupButton.disabled = false;

          signupButton.textContent =
            "Join TeenSpace 🚀";

          return;
        }


        if (!data.user) {

          message.className = "error";

          message.textContent =
            "❌ Account could not be created.";

          signupButton.disabled = false;

          signupButton.textContent =
            "Join TeenSpace 🚀";

          return;
        }


        // ======================================
        // CREATE PROFILE
        // ======================================

        const {
          error: profileError
        } = await supabaseClient
          .from("profiles")
          .upsert(
            {

              "user-id":
                data.user.id,

              username:
                username,

              country:
                country,

              bio:
                ""

            },
            {

              onConflict:
                '"user-id"'

            }
          );


        if (profileError) {

          console.error(profileError);

          message.className = "error";

          message.textContent =
            "❌ Profile could not be created: " +
            profileError.message;

          signupButton.disabled = false;

          signupButton.textContent =
            "Join TeenSpace 🚀";

          return;
        }


        // ======================================
        // SUCCESS
        // ======================================

        if (data.session) {

          message.className =
            "success";

          message.textContent =
            "✅ Welcome to TeenSpace!";

          setTimeout(() => {

            window.location.href =
              "profile.html";

          }, 800);

        } else {

          message.className =
            "success";

          message.textContent =
            "✅ Account created! Check your email to confirm your account, then log in.";

          signupButton.disabled = false;

          signupButton.textContent =
            "Account Created ✅";

        }


      } catch (error) {

        console.error(error);

        message.className = "error";

        message.textContent =
          "❌ Something went wrong. Please try again.";

        signupButton.disabled = false;

        signupButton.textContent =
          "Join TeenSpace 🚀";

      }

    }
  );

</script>

</body>
</html>
