<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Community | TeenSpace 🌍</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    background: linear-gradient(135deg,#f4f7ff,#eee8ff);
    color:#222;
}


header {
    background:#6c5ce7;
    color:white;
    padding:20px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}


.logo {
    font-size:28px;
    font-weight:bold;
}


nav a {
    color:white;
    text-decoration:none;
    margin-left:16px;
    font-weight:bold;
}


.container {
    width:92%;
    max-width:800px;
    margin:30px auto;
}


.hero {
    text-align:center;
    padding:40px 20px;
}


.hero h1 {
    color:#6c5ce7;
    font-size:42px;
}


.create-post {
    display:block;
    background:#6c5ce7;
    color:white;
    text-align:center;
    text-decoration:none;
    padding:18px;
    border-radius:16px;
    font-size:21px;
    font-weight:bold;
    margin-bottom:25px;
}


.post {

    background:white;
    padding:25px;
    border-radius:20px;
    margin-bottom:20px;
    box-shadow:0 8px 25px rgba(0,0,0,.08);

}


.post-header {

    display:flex;
    align-items:center;
    gap:10px;

}


.username {

    color:#6c5ce7;
    font-size:20px;
    font-weight:bold;

}


.badge {

    padding:5px 10px;
    border-radius:20px;
    color:white;
    font-size:12px;
    font-weight:bold;

}


.owner {

    background:#ffb000;

}


.staff {

    background:#0984e3;

}


.premium {

    background:#e84393;

}


.message {

    margin-top:15px;
    font-size:18px;
    line-height:1.6;

}


.time {

    margin-top:15px;
    color:#888;
    font-size:13px;

}


.actions {

    margin-top:15px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;

}


.action-btn {

    padding:9px 14px;
    border:none;
    border-radius:10px;
    background:#eeeaff;
    color:#6c5ce7;
    font-weight:bold;
    cursor:pointer;

}


.delete-btn {

    background:#ffe1e7;
    color:#d63050;

}


.status {

    background:white;
    padding:30px;
    text-align:center;
    border-radius:20px;

}


footer {

    background:#222;
    color:white;
    text-align:center;
    padding:25px;

}


</style>

</head>


<body>


<header>

<div class="logo">
🌍 TeenSpace
</div>


<nav>

<a href="home.html">Home</a>

<a href="explore.html">Explore</a>

<a href="community.html">Community</a>

<a href="profile.html">Profile</a>

</nav>
    <section class="hero">

<h1>
💬 TeenSpace Community
</h1>

<p>
Share, connect and build the TeenSpace world 🌍
</p>

</section>


<main class="container">


<a href="post.html" class="create-post">
✍️ Create a Post
</a>


<div id="posts">

<div class="status">
Loading posts...
</div>

</div>


</main>



<footer>

© 2026 TeenSpace 🌍 |
Made for teens, with safety in mind.

</footer>



<script>


const SUPABASE_URL =
"https://gcigveojqwwovitlwtxl.supabase.co";


const SUPABASE_KEY =
"sb_publishable_Br7HdEgbHvQxx4_8HHR9Fg_fJ5sH_r7";


const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



const postsContainer =
document.getElementById("posts");


let currentUser = null;



async function getCurrentUser(){

const {
data:{
user
}
}
=
await supabaseClient.auth.getUser();


currentUser = user;

}




function formatTime(time){

return new Date(time)
.toLocaleString();

}





async function loadPosts(){


const {
data,
error
}

=
await supabaseClient

.from("posts")

.select(`

id,
user_id,
content,
created_at,

profiles(

username,
role,
badge,
premium,
theme

)

`)

.order(

"created_at",

{
ascending:false
}

);



if(error){

console.log(error);


postsContainer.innerHTML = `

<div class="status">

❌ Could not load posts.

</div>

`;

return;

}




if(!data.length){


postsContainer.innerHTML = `

<div class="status">

🌟 No posts yet.

Be the first!

</div>

`;


return;

}



postsContainer.innerHTML="";



data.forEach(post=>{


const profile =
post.profiles || {};



const username =
profile.username ||
"TeenSpace User";



const role =
profile.role ||
"user";



const badge =
profile.badge ||
"";


let badgeHTML = "";



if(role==="owner"){


badgeHTML = `

<span class="badge owner">

👑 ${badge || "OWNER"}

</span>

`;

}


else if(role==="staff"){


badgeHTML = `

<span class="badge staff">

🛡️ STAFF

</span>

`;

}



else if(profile.premium){


badgeHTML = `

<span class="badge premium">

💎 PREMIUM

</span>

`;

}





const card =
document.createElement("div");


card.className =
"post";




card.innerHTML = `


<div class="post-header">


<div class="username">

👤 ${username}

${badgeHTML}

</div>


</div>



<div class="message">

${escapeHTML(post.content)}

</div>



<div class="time">

${formatTime(post.created_at)}

</div>



<div class="actions">


<button class="action-btn"
onclick="quotePost('${username}','${post.content.replace(/'/g,"\\'")}')">

💬 Quote

</button>


${
currentUser &&
currentUser.id === post.user_id

?

`

<button class="action-btn"
onclick="editPost('${post.id}','${post.content.replace(/'/g,"\\'")}')">

✏️ Edit

</button>


<button class="action-btn delete-btn"
onclick="deletePost('${post.id}')">

🗑️ Delete

</button>

`

:

""

}


</div>


`;



postsContainer.appendChild(card);


});


}

function escapeHTML(text){

const div =
document.createElement("div");

div.textContent = text;

return div.innerHTML;

}




async function editPost(id, oldContent){


const newContent =
prompt(
"Edit your post:",
oldContent
);


if(!newContent || newContent.trim()===""){

return;

}



const {
error
}

=
await supabaseClient

.from("posts")

.update({

content:newContent,

edited:true

})

.eq(

"id",

id

);



if(error){

alert(
"Could not edit post"
);

console.log(error);

return;

}



loadPosts();


}





async function deletePost(id){


const confirmDelete =
confirm(
"Delete this post?"
);



if(!confirmDelete){

return;

}



const {
error
}

=
await supabaseClient

.from("posts")

.delete()

.eq(

"id",

id

);



if(error){

alert(
"Could not delete post"
);

console.log(error);

return;

}



loadPosts();


}





function quotePost(username,message){


const quote =

"> " +
username +
": " +
message;



window.location.href =

"post.html?quote=" +

encodeURIComponent(
quote
);


}






async function start(){


await getCurrentUser();


await loadPosts();


}



start();



</script>


</body>

</html>

</header>
