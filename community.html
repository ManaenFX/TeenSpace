
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Community | TeenSpace 🌍</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f4f7ff;
  color:#222;
}

/* =========================
   HEADER
========================= */

header{
  background:#6c5ce7;
  color:white;
  padding:15px 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 3px 15px rgba(0,0,0,.12);
}

.logo{
  font-size:26px;
  font-weight:bold;
}

nav{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}

nav a{
  color:white;
  text-decoration:none;
  padding:8px 10px;
  border-radius:9px;
  font-weight:bold;
  font-size:14px;
}

nav a:hover{
  background:rgba(255,255,255,.15);
}

.active{
  background:rgba(255,255,255,.22);
}

.premium-nav{
  background:#f5cf45;
  color:#4c3a00 !important;
}

/* =========================
   CHAT AREA
========================= */

.chat-wrapper{
  width:94%;
  max-width:850px;
  margin:25px auto;
}

.chat-card{
  background:white;
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 8px 28px rgba(0,0,0,.08);
}

/* =========================
   CHAT HEADER
========================= */

.chat-header{
  padding:20px;
  background:linear-gradient(135deg,#6c5ce7,#806df0);
  color:white;
}

.chat-title{
  font-size:25px;
  font-weight:bold;
}

.chat-subtitle{
  margin-top:5px;
  opacity:.85;
  font-size:14px;
}

/* =========================
   POSTS / MESSAGES
========================= */

.messages{
  padding:18px;
  min-height:500px;
  max-height:650px;
  overflow-y:auto;
  background:#faf9ff;
}

.status{
  text-align:center;
  padding:35px 15px;
  color:#777;
}

.status.error{
  color:#d63050;
}

.message{
  display:flex;
  gap:10px;
  margin-bottom:18px;
}

.avatar{
  width:42px;
  height:42px;
  min-width:42px;
  border-radius:50%;
  background:#eeeaff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
}

.message-content{
  max-width:calc(100% - 55px);
}

.user-line{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:7px;
  cursor:pointer;
}

.username{
  color:#5f4ce0;
  font-weight:bold;
  font-size:16px;
}

.username:hover{
  text-decoration:underline;
}

.badge{
  font-size:10px;
  font-weight:bold;
  padding:4px 8px;
  border-radius:999px;
}

.owner{
  background:#fff0b3;
  color:#946c00;
}

.staff{
  background:#e1f0ff;
  color:#1769aa;
}

.premium{
  background:#ffe0ef;
  color:#b52270;
}

.member{
  background:#eeeaff;
  color:#5f4ce0;
}

.message-bubble{
  margin-top:5px;
  background:white;
  border:1px solid #eee;
  border-radius:5px 17px 17px 17px;
  padding:11px 14px;
  line-height:1.5;
  font-size:16px;
  word-break:break-word;
  white-space:pre-wrap;
  box-shadow:0 2px 7px rgba(0,0,0,.03);
}

.message-time{
  color:#999;
  font-size:11px;
  margin-top:5px;
}

.message-actions{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:5px;
}

.message-action{
  border:none;
  background:transparent;
  color:#777;
  font-size:12px;
  cursor:pointer;
  padding:3px 6px;
  border-radius:7px;
}

.message-action:hover{
  background:#eeeaff;
  color:#5f4ce0;
}

.delete-action:hover{
  color:#d63050;
}

/* =========================
   USER MENU
========================= */

.user-menu{
  position:fixed;
  display:none;
  background:white;
  border-radius:14px;
  padding:7px;
  box-shadow:0 8px 30px rgba(0,0,0,.18);
  z-index:500;
  min-width:170px;
  border:1px solid #eee;
}

.user-menu button{
  display:block;
  width:100%;
  border:none;
  background:white;
  padding:11px;
  text-align:left;
  border-radius:9px;
  cursor:pointer;
  font-weight:bold;
  color:#444;
}

.user-menu button:hover{
  background:#eeeaff;
  color:#5f4ce0;
}

/* =========================
   EMOJI PANEL
========================= */

.emoji-panel{
  display:none;
  background:white;
  border-top:1px solid #eee;
  padding:12px;
}

.emoji-tabs{
  display:flex;
  gap:5px;
  overflow-x:auto;
  margin-bottom:9px;
}

.emoji-tab{
  border:none;
  background:#f1efff;
  border-radius:9px;
  padding:7px 10px;
  cursor:pointer;
  font-size:16px;
}

.emoji-grid{
  display:grid;
  grid-template-columns:repeat(10,1fr);
  gap:3px;
  max-height:180px;
  overflow-y:auto;
}

.emoji-grid button{
  border:none;
  background:transparent;
  font-size:23px;
  padding:5px;
  border-radius:8px;
  cursor:pointer;
}

.emoji-grid button:hover{
  background:#eeeaff;
}

/* =========================
   COMPOSER
========================= */

.composer{
  background:white;
  border-top:1px solid #eee;
  padding:12px;
}

.toolbar{
  display:flex;
  gap:6px;
  margin-bottom:8px;
}

.tool{
  border:none;
  background:#eeeaff;
  color:#5f4ce0;
  padding:8px 11px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.tool:hover{
  background:#ddd6ff;
}

.compose-row{
  display:flex;
  gap:8px;
  align-items:flex-end;
}

textarea{
  flex:1;
  min-height:45px;
  max-height:130px;
  resize:none;
  border:1px solid #ccc;
  border-radius:15px;
  padding:12px;
  font-size:15px;
  outline:none;
}

textarea:focus{
  border-color:#6c5ce7;
}

.send-button{
  border:none;
  background:#6c5ce7;
  color:white;
  border-radius:13px;
  padding:13px 18px;
  font-weight:bold;
  cursor:pointer;
}

.send-button:hover{
  background:#5747cf;
}

.send-button:disabled{
  opacity:.6;
}

/* =========================
   EDIT
========================= */

.edit-area{
  margin-top:8px;
}

.edit-area textarea{
  width:100%;
  min-height:90px;
}

.save-edit{
  margin-top:6px;
  border:none;
  background:#6c5ce7;
  color:white;
  padding:9px 13px;
  border-radius:9px;
  font-weight:bold;
  cursor:pointer;
}

/* =========================
   FOOTER
========================= */

footer{
  background:#222;
  color:#aaa;
  text-align:center;
  padding:22px;
  margin-top:30px;
  font-size:13px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  header{
    flex-direction:column;
  }

  nav{
    justify-content:center;
  }

  .chat-wrapper{
    width:100%;
    margin:0;
  }

  .chat-card{
    border-radius:0;
  }

  .messages{
    min-height:calc(100vh - 260px);
    max-height:none;
  }

  .message-content{
    max-width:calc(100% - 50px);
  }

  .emoji-grid{
    grid-template-columns:repeat(8,1fr);
  }

  .compose-row{
    align-items:stretch;
  }

  .send-button{
    padding:10px 14px;
  }

}

</style>

</head>

let selectedUser = null;

/* =========================
   SHOW EMOJIS
========================= */

function showEmojiCategory(category){

  emojiGrid.innerHTML = "";

  emojis[category].forEach(emoji => {

    const button =
      document.createElement("button");

    button.textContent = emoji;

    button.type = "button";

    button.addEventListener(
      "click",
      function(){

        insertEmoji(emoji);

      }
    );

    emojiGrid.appendChild(button);

  });

}


function insertEmoji(emoji){

  const start =
    messageInput.selectionStart;

  const end =
    messageInput.selectionEnd;

  const text =
    messageInput.value;

  messageInput.value =
    text.slice(0,start) +
    emoji +
    text.slice(end);

  messageInput.focus();

  const position =
    start + emoji.length;

  messageInput.selectionStart =
    position;

  messageInput.selectionEnd =
    position;

}


document
  .querySelectorAll(".emoji-tab")
  .forEach(button => {

    button.addEventListener(
      "click",
      function(){

        showEmojiCategory(
          button.dataset.category
        );

      }
    );

  });


emojiButton.addEventListener(
  "click",
  function(){

    emojiPanel.style.display =
      emojiPanel.style.display === "block"
        ? "none"
        : "block";

  }
);


showEmojiCategory("faces");


/* =========================
   ESCAPE
========================= */

function escapeHTML(value){

  const div =
    document.createElement("div");

  div.textContent =
    value ?? "";

  return div.innerHTML;

}


/* =========================
   CURRENT USER
========================= */

async function getCurrentUser(){

  const {
    data:{
      user
    }
  } =
  await supabaseClient
    .auth
    .getUser();

  if(!user){

    window.location.href =
      "index.html";

    return null;

  }

  return user;

}


/* =========================
   LOAD POSTS
========================= */

async function loadPosts(){

  messages.innerHTML = `
    <div class="status">
      Loading community...
    </div>
  `;


  const {
    data:posts,
    error
  } =
  await supabaseClient
    .from("posts")
    .select(
      "id,user_id,content,created_at,edited"
    )
    .order(
      "created_at",
      {
        ascending:true
      }
    );


  if(error){

    console.error(error);

    messages.innerHTML = `
      <div class="status error">
        ❌ Could not load community.
      </div>
    `;

    return;

  }


  if(!posts || posts.length === 0){

    messages.innerHTML = `
      <div class="status">
        🌟 No messages yet.<br><br>
        Be the first to say something!
      </div>
    `;

    return;

  }


  const userIds =
    [
      ...new Set(
        posts.map(
          post => post.user_id
        )
      )
    ];


  let profiles = [];


  if(userIds.length){

    const {
      data,
      error:profileError
    } =
    await supabaseClient
      .from("profiles")
      .select(
        'username,role,badge,premium,"user-id"'
      )
      .in(
        "user-id",
        userIds
      );


    if(!profileError){

      profiles =
        data || [];

    }

  }


  const profileMap =
    new Map();


  profiles.forEach(profile => {

    profileMap.set(
      profile["user-id"],
      profile
    );

  });


  messages.innerHTML = "";


  posts.forEach(post => {

    renderPost(
      post,
      profileMap.get(post.user_id) || {}
    );

  });


  messages.scrollTop =
    messages.scrollHeight;

}


/* =========================
   RENDER POST
========================= */

function renderPost(
  post,
  profile
){

  const username =
    profile.username ||
    "TeenSpace User";

  const role =
    profile.role ||
    "user";


  const card =
    document.createElement("div");

  card.className =
    "message";


  let badgeHTML =
    `<span class="badge member">👤 MEMBER</span>`;


  if(role === "owner"){

    badgeHTML =
      `<span class="badge owner">
        👑 ${escapeHTML(
          profile.badge || "FOUNDER"
        )}
      </span>`;

  }else if(role === "staff"){

    badgeHTML =
      `<span class="badge staff">
        🛡️ STAFF
      </span>`;

  }


  if(profile.premium === true){

    badgeHTML +=
      `<span class="badge premium">
        💎 PREMIUM
      </span>`;

  }


  const mine =
    currentUser &&
    currentUser.id === post.user_id;


  card.innerHTML = `

    <div class="avatar">
      👤
    </div>

    <div class="message-content">

      <div
        class="user-line"
        data-user-id="${escapeHTML(post.user_id)}"
        data-username="${escapeHTML(username)}"
      >

        <span class="username">
          ${escapeHTML(username)}
        </span>

        ${badgeHTML}

      </div>


      <div class="message-bubble">
        ${escapeHTML(post.content)}
      </div>


      <div class="message-time">
        ${new Date(
          post.created_at
        ).toLocaleString()}

        ${
          post.edited
            ? " · edited"
            : ""
        }

      </div>


      <div class="message-actions">

        <button
          class="message-action quote-button"
        >
          💬 Reply
        </button>

        ${
          mine
            ? `
              <button
                class="message-action edit-button"
              >
                ✏️ Edit
              </button>

              <button
                class="message-action delete-action delete-button"
              >
                🗑️ Delete
              </button>
            `
            : ""
        }

      </div>

    </div>

  `;


  const userLine =
    card.querySelector(".user-line");


  userLine.addEventListener(
    "click",
    function(event){

      event.stopPropagation();

      selectedUser = {
        id:
          userLine.dataset.userId,

        name:
          userLine.dataset.username
      };


      const rect =
        userLine.getBoundingClientRect();


      userMenu.style.display =
        "block";

      userMenu.style.left =
        Math.min(
          rect.left,
          window.innerWidth - 190
        ) + "px";

      userMenu.style.top =
        (rect.bottom + 7) + "px";

    }
  );


  const quoteButton =
    card.querySelector(
      ".quote-button"
    );


  quoteButton.addEventListener(
    "click",
    function(){

      messageInput.value =
        "@" +
        username +
        " ";

      messageInput.focus();

    }
  );


  const editButton =
    card.querySelector(
      ".edit-button"
    );


  if(editButton){

    editButton.addEventListener(
      "click",
      function(){

        openEdit(
          card,
          post
        );

      }
    );

  }


  const deleteButton =
    card.querySelector(
      ".delete-button"
    );


  if(deleteButton){

    deleteButton.addEventListener(
      "click",
      function(){

        deletePost(
          post.id
        );

      }
    );

  }


  messages.appendChild(card);

}


/* =========================
   USER MENU
========================= */

profileButton.addEventListener(
  "click",
  function(){

    if(!selectedUser){
      return;
    }

    window.location.href =
      "profile.html?user_id=" +
      encodeURIComponent(
        selectedUser.id
      );

  }
);


privateButton.addEventListener(
  "click",
  function(){

    if(!selectedUser){
      return;
    }

    window.location.href =
      "messages.html?user_id=" +
      encodeURIComponent(
        selectedUser.id
      ) +
      "&name=" +
      encodeURIComponent(
        selectedUser.name
      );

  }
);


document.addEventListener(
  "click",
  function(event){

    if(
      !userMenu.contains(event.target) &&
      !event.target.closest(".user-line")
    ){

      userMenu.style.display =
        "none";

    }

  }
);


/* =========================
   EDIT
========================= */

function openEdit(
  card,
  post
){

  const bubble =
    card.querySelector(
      ".message-bubble"
    );

  const actions =
    card.querySelector(
      ".message-actions"
    );


  bubble.style.display =
    "none";

  actions.style.display =
    "none";


  const area =
    document.createElement("div");

  area.className =
    "edit-area";


  const textarea =
    document.createElement("textarea");

  textarea.value =
    post.content;


  const save =
    document.createElement("button");

  save.className =
    "save-edit";

  save.textContent =
    "Save Changes";


  save.addEventListener(
    "click",
    async function(){

      const content =
        textarea.value.trim();


      if(!content){

        return;

      }


      const {
        error
      } =
      await supabaseClient
        .from("posts")
        .update({
          content,
          edited:true
        })
        .eq(
          "id",
          post.id
        );


      if(error){

        alert(
          error.message
        );

        return;

      }


      loadPosts();

    }
  );


  area.appendChild(textarea);

  area.appendChild(save);

  card
    .querySelector(".message-content")
    .appendChild(area);

}


/* =========================
   DELETE
========================= */

async function deletePost(
  postId
){

  if(
    !confirm(
      "Delete this message?"
    )
  ){

    return;

  }


  const {
    error
  } =
  await supabaseClient
    .from("posts")
    .delete()
    .eq(
      "id",
      postId
    );


  if(error){

    alert(
      error.message
    );

    return;

  }


  loadPosts();

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

  const content =
    messageInput.value.trim();


  if(!content){

    return;

  }


  sendButton.disabled =
    true;


  const {
    error
  } =
  await supabaseClient
    .from("posts")
    .insert({

      user_id:
        currentUser.id,

      content:
        content

    });


  if(error){

    console.error(error);

    alert(
      error.message
    );

    sendButton.disabled =
      false;

    return;

  }


  messageInput.value =
    "";

  emojiPanel.style.display =
    "none";

  sendButton.disabled =
    false;


  await loadPosts();

}


/* =========================
   SEND BUTTON
========================= */

sendButton.addEventListener(
  "click",
  sendMessage
);


/* =========================
   ENTER
========================= */

messageInput.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================
   REALTIME
========================= */

function subscribe(){

  supabaseClient
    .channel(
      "community-posts"
    )
    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"posts"
      },
      function(){

        loadPosts();

      }
    )
    .subscribe();

}


/* =========================
   START
========================= */

async function start(){

  currentUser =
    await getCurrentUser();


  if(!currentUser){

    return;

  }


  await loadPosts();

  subscribe();

}


start();

</script>

</body>

</html>
