<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">

<style>

*{
  box-sizing:border-box;
}

:root{
  --accent:#7c4dff;
  --page-bg:#090d1d;
  --chat-bg:#0d1224;
  --card:#11172b;
  --bubble:#1b2340;

}

body{
  margin:0;
  min-height:100vh;
  background:var(--page-bg);
  color:var(--text);
  font-family:var(--font);
  transition:.25s;

/* HEADER */

header{
  background:var(--card);
  color:white;
  padding:15px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  border-bottom:1px solid var(--border);
}

.logo{
  font-size:25px;
  font-weight:bold;
  white-space:nowrap;
}

nav{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

nav a{
  color:white;
  text-decoration:none;
  padding:8px 10px;
  border-radius:9px;
  font-weight:bold;
}

nav a:hover{
  background:rgba(255,255,255,.10);
}

/* MAIN */

.container{
  width:94%;
  max-width:1000px;
  margin:25px auto 50px;
}

.chat{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 12px 40px rgba(0,0,0,.30);
}

/* TOP */

.chat-top{
  padding:20px;

}

.chat-title{
  font-size:22px;

}

.chat-subtitle{
  color:var(--muted);

}

.premium-label{
  display:inline-block;

}

/* MESSAGES */

.messages{
  height:600px;
  overflow-y:auto;

}

}

.message-row{
  display:flex;

}

.avatar-wrap{
  width:42px;
  height:42px;
  flex-shrink:0;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  background:#202846;

  cursor:pointer;
  border:2px solid rgba(255,255,255,.10);
}

.message-content{
  max-width:min(78%,650px);
}

.username{
  font-size:13px;

}

}

.badge{
  display:inline-block;

}

.composer{

}

  content:" 💎";

}

textarea{

}

.send{

.send:disabled{

}

/* EMOJIS */

.emoji-panel{
  display:none;
  padding:9px;

}

.emoji-panel button{
  border:0;

}

}

.premium-notice{

/* EDIT BOX */

.edit-buttons{

}

.edit-buttons button{

  cursor:pointer;

}

/* MOBILE */

@media(max-width:600px){

  header{
    flex-direction:column;
  }

  .messages{
    height:500px;
  }

  .message-content{
    max-width:83%;
  }

}

</style>

<script>

const SUPABASE_URL =

const SUPABASE_KEY =

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true

/* ELEMENTS */

const messagesBox =
  document.getElementById("messages");

const messageInput =
  document.getElementById("messageInput");

const sendBtn =

const emojiBtn =
  document.getElementById("emojiBtn");

const emojiPanel =

const mediaBtn =
  document.getElementById("mediaBtn");

const voiceBtn =
  document.getElementById("voiceBtn");

const mediaInput =

const fileName =
  document.getElementById("fileName");

const premiumNotice =
  document.getElementById("premiumNotice");

const premiumLabel =
  document.getElementById("premiumLabel");

const editBox =
  document.getElementById("editBox");

const editInput =
  document.getElementById("editInput");

const saveEditBtn =
  document.getElementById("saveEditBtn");

const cancelEditBtn =
  document.getElementById("cancelEditBtn");


let currentUser = null;
let currentProfile = null;
let isPremium = false;
let selectedFile = null;
let recorder = null;
let audioChunks = [];
let editingMessageId = null;


/* =====================================================
   USER
===================================================== */

async function loadCurrentUser(){

  const {
    data:{user},
    error
  } =
  await supabaseClient.auth.getUser();

  if(error || !user){

    window.location.href =
      "login.html";

    return false;

  }

  currentUser = user;

  const {
    data:profile,
    error:profileError
  } =
  await supabaseClient
    .from("profiles")
    .select("*")
    .eq("user-id",currentUser.id)
    .maybeSingle();

  if(profileError){
    console.error(profileError);
  }

  currentProfile =
    profile || {};

  isPremium =
    currentProfile.premium === true;

  applyTheme(currentProfile);

  if(isPremium){
    premiumLabel.style.display =
      "inline-block";
  }

  return true;
}


/* =====================================================
   THEME + FONT
===================================================== */

function applyTheme(profile){

  const root =
    document.documentElement;

  if(profile.accent_color)
    root.style.setProperty(
      "--accent",
      profile.accent_color
    );

  if(profile.background_color)
    root.style.setProperty(
      "--page-bg",
      profile.background_color
    );

  if(profile.chat_background)
    root.style.setProperty(
      "--chat-bg",
      profile.chat_background
    );

  if(profile.card_color)
    root.style.setProperty(
      "--card",
      profile.card_color
    );

  if(profile.bubble_color)
    root.style.setProperty(
      "--bubble",
      profile.bubble_color
    );

  if(profile.text_color)
    root.style.setProperty(
      "--text",
      profile.text_color
    );

  /*
    Premium fonts.
    Only allow known font families so a profile
    cannot inject arbitrary CSS.
  */

  const allowedFonts = {
    Arial:"Arial,sans-serif",
    Verdana:"Verdana,sans-serif",
    Georgia:"Georgia,serif",
    "Trebuchet MS":"'Trebuchet MS',sans-serif",
    "Courier New":"'Courier New',monospace",
    "Times New Roman":"'Times New Roman',serif"
  };

  if(
    isPremium &&
    allowedFonts[profile.font_family]
  ){

    root.style.setProperty(
      "--font",
      allowedFonts[profile.font_family]
    );

  }else{

    root.style.setProperty(
      "--font",
      "Arial,sans-serif"
    );

  }

}


/* =====================================================
   PREMIUM
===================================================== */

function requirePremium(){

  if(isPremium){

    premiumNotice.style.display =
      "none";

    return true;

  }

  premiumNotice.style.display =
    "block";

  setTimeout(
    ()=>{
      premiumNotice.style.display =
        "none";
    },
    4500
  );

  return false;
}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(value){

  const div =
    document.createElement("div");

  div.textContent =
    value || "";

  return div.innerHTML;
}


/* =====================================================
   PROFILES
===================================================== */

async function getProfiles(userIds){

  if(!userIds.length)
    return new Map();

  const {
    data,
    error
  } =
  await supabaseClient
    .from("profiles")
    .select(
      'username,avatar_url,"user-id",premium'
    )
    .in(
      "user-id",
      userIds
    );

  if(error){

    console.error(
      "Profile loading error:",
      error
    );

    return new Map();
  }

  const map =
    new Map();

  (data || []).forEach(
    profile=>{
      map.set(
        profile["user-id"],
        profile
      );
    }
  );

  return map;
}


/* =====================================================
   LOAD MESSAGES
===================================================== */

async function loadMessages(){

  const {
    data,
    error
  } =
  await supabaseClient
    .from("messages")
    .select(
      "id,sender_id,content,created_at,message_type,media_url,media_name,edited_at,reactions"
    )
    .is(
      "receiver_id",
      null
    )
    .order(
      "created_at",
      {
        ascending:true
      }
    );

  if(error){

    console.error(error);

    messagesBox.innerHTML = `
      <div class="status">
        ❌ Could not load community chat.
        <br><br>
        ${escapeHTML(error.message)}
      </div>
    `;

    return;
  }

  renderMessages(data || []);
}


/* =====================================================
   REACTIONS
===================================================== */

const reactionChoices =
  ["❤️","😂","🔥","😭","😎","👍"];

async function toggleReaction(message){

  let reactions =
    message.reactions || {};

  if(typeof reactions !== "object")
    reactions = {};

  const emoji =
    this.dataset.emoji;

  const userId =
    currentUser.id;

  if(!Array.isArray(reactions[emoji]))
    reactions[emoji] = [];

  const users =
    reactions[emoji];

  const index =
    users.indexOf(userId);

  if(index >= 0){

    users.splice(index,1);

  }else{

    users.push(userId);

  }

  if(users.length === 0){
    delete reactions[emoji];
  }

  const {
    error
  } =
  await supabaseClient
    .from("messages")
    .update({
      reactions:reactions
    })
    .eq(
      "id",
      message.id
    );

  if(error){

    console.error(error);

    alert(
      "Could not update reaction."
    );

    return;
  }

  await loadMessages();
}


/* =====================================================
   RENDER
===================================================== */

async function renderMessages(data){

  if(!data.length){

    messagesBox.innerHTML = `
      <div class="status">
        👋 No messages yet.
        <br><br>
        Start the conversation! 💬
      </div>
    `;

    return;
  }

  const ids =
    [
      ...new Set(
        data
          .map(
            m=>m.sender_id
          )
          .filter(Boolean)
      )
    ];

  const profiles =
    await getProfiles(ids);

  messagesBox.innerHTML = "";

  data.forEach(
    message=>{

      const profile =
        profiles.get(
          message.sender_id
        ) || {};

      const mine =
        message.sender_id ===
        currentUser.id;

      const row =
        document.createElement("div");

      row.className =
        "message-row" +
        (mine ? " mine" : "");

      /* AVATAR */

      const avatarWrap =
        document.createElement("div");

      avatarWrap.className =
        "avatar-wrap";

      const avatar =
        document.createElement("img");

      avatar.className =
        "avatar";

      avatar.alt =
        "Profile picture";

      avatar.src =
        profile.avatar_url ||
        createFallbackAvatar();

      avatar.onerror =
        function(){

          this.onerror = null;

          this.src =
            createFallbackAvatar();
        };

      avatar.onclick =
        ()=>{
          openProfile(
            message.sender_id
          );
        };

      avatarWrap.appendChild(avatar);

      /* CONTENT */

      const content =
        document.createElement("div");

      content.className =
        "message-content";

      const username =
        document.createElement("div");

      username.className =
        "username";

      username.textContent =
        profile.username ||
        "TeenSpace Member";

      username.onclick =
        ()=>{
          openProfile(
            message.sender_id
          );
        };

      if(profile.premium){

        const badge =
          document.createElement("span");

        badge.className =
          "badge premium";

        badge.textContent =
          "💎 PREMIUM";

        username.appendChild(badge);
      }

      content.appendChild(username);

      /* REPLY */

      if(message.reply_preview){

        const reply =
          document.createElement("div");

        reply.className =
          "reply-preview";

        reply.textContent =
          "↩️ " +
          message.reply_preview;

        content.appendChild(reply);
      }

      /* BUBBLE */

      const bubble =
        document.createElement("div");

      bubble.className =
        "bubble";

      const type =
        message.message_type ||
        "text";

      if(type === "image"){

        bubble.innerHTML =
          `<img class="media"
             src="${escapeHTML(message.media_url)}"
             alt="Shared image">`;

      }else if(type === "video"){

        bubble.innerHTML =
          `<video class="media"
             src="${escapeHTML(message.media_url)}"
             controls
             playsinline></video>`;

      }else if(type === "audio"){

        bubble.innerHTML =
          `<audio class="audio"
             src="${escapeHTML(message.media_url)}"
             controls></audio>`;

      }else{

        bubble.textContent =
          message.content || "";
      }

      content.appendChild(bubble);

      /* TIME */

      const time =
        document.createElement("div");

      time.className =
        "message-time";

      time.textContent =
        new Date(
          message.created_at
        ).toLocaleString();

      if(message.edited_at){

        const edited =
          document.createElement("span");

        edited.className =
          "edited";

        edited.textContent =
          "(edited)";

        time.appendChild(edited);
      }

      content.appendChild(time);

      /* ACTIONS */

      const actions =
        document.createElement("div");

      actions.className =
        "message-actions";

      reactionChoices.forEach(
        emoji=>{

          const btn =
            document.createElement("button");

          btn.className =
            "action-btn reaction-btn";

          const count =
            message.reactions &&
            Array.isArray(
              message.reactions[emoji]
            )
              ? message.reactions[emoji].length
              : 0;

          btn.textContent =
            emoji +
            (count ? " " + count : "");

          btn.dataset.emoji =
            emoji;

          btn.onclick =
            toggleReaction.bind(
              btn,
              message
            );

          actions.appendChild(btn);
        }
      );

      /* REPLY */

      const replyBtn =
        document.createElement("button");

      replyBtn.className =
        "action-btn";

      replyBtn.textContent =
        "↩️ Reply";

      replyBtn.onclick =
        ()=>{

          messageInput.focus();

          messageInput.value =
            "↩️ " +
            (
              profile.username ||
              "Member"
            ) +
            ": ";

        };

      actions.appendChild(replyBtn);

      /* OWN MESSAGE MENU */

      if(mine){

        const menu =
          document.createElement("div");

        menu.className =
          "action-menu";

        const menuButton =
          document.createElement("button");

        menuButton.className =
          "action-btn";

        menuButton.textContent =
          "•••";

        const panel =
          document.createElement("div");

        panel.className =
          "menu-panel";

        const editBtn =
          document.createElement("button");

        editBtn.textContent =
          "✏️ Edit";

        editBtn.onclick =
          ()=>{
            startEdit(message);
            panel.classList.remove("show");
          };

        const deleteBtn =
          document.createElement("button");

        deleteBtn.textContent =
          "🗑️ Delete";

        deleteBtn.onclick =
          ()=>{
            panel.classList.remove("show");
            deleteMessage(message);
          };

        panel.appendChild(editBtn);
        panel.appendChild(deleteBtn);

        menuButton.onclick =
          ()=>{
            panel.classList.toggle("show");
          };

        menu.appendChild(menuButton);
        menu.appendChild(panel);

        actions.appendChild(menu);
      }

      content.appendChild(actions);

      row.appendChild(avatarWrap);
      row.appendChild(content);

      messagesBox.appendChild(row);
    }
  );

  messagesBox.scrollTop =
    messagesBox.scrollHeight;
}


/* =====================================================
   EDIT
===================================================== */

function startEdit(message){

  if(
    message.sender_id !==
    currentUser.id
  ){
    return;
  }

  if(
    message.message_type &&
    message.message_type !== "text"
  ){

    alert(
      "Only text messages can be edited."
    );

    return;
  }

  editingMessageId =
    message.id;

  editInput.value =
    message.content || "";

  editBox.classList.add(
    "active"
  );

  editInput.focus();
}


cancelEditBtn.onclick =
  function(){

    editingMessageId =
      null;

    editInput.value =
      "";

    editBox.classList.remove(
      "active"
    );
  };


saveEditBtn.onclick =
  async function(){

    if(!editingMessageId)
      return;

    const text =
      editInput.value.trim();

    if(!text)
      return;

    saveEditBtn.disabled =
      true;

    const {
      error
    } =
    await supabaseClient
      .from("messages")
      .update({
        content:text,
        edited_at:new Date().toISOString()
      })
      .eq(
        "id",
        editingMessageId
      )
      .eq(
        "sender_id",
        currentUser.id
      );

    saveEditBtn.disabled =
      false;

    if(error){

      console.error(error);

      alert(
        error.message
      );

      return;
    }

    editingMessageId =
      null;

    editInput.value =
      "";

    editBox.classList.remove(
      "active"
    );

    await loadMessages();
  };


/* =====================================================
   DELETE
===================================================== */

async function deleteMessage(message){

  if(
    message.sender_id !==
    currentUser.id
  ){
    return;
  }

  const confirmed =
    confirm(
      "Delete this message? 🗑️"
    );

  if(!confirmed)
    return;

  const {
    error
  } =
  await supabaseClient
    .from("messages")
    .delete()
    .eq(
      "id",
      message.id
    )
    .eq(
      "sender_id",
      currentUser.id
    );

  if(error){

    console.error(error);

    alert(
      error.message
    );

    return;
  }

  await loadMessages();
}

emojiBtn.onclick =

/* =====================================================
   MEDIA
===================================================== */

mediaBtn.onclick =
  function(){

    if(!requirePremium())
      return;

    mediaInput.click();
  };


mediaInput.onchange =
  function(){

    if(!isPremium){

      mediaInput.value = "";
      selectedFile = null;
      return;
    }

    selectedFile =
      mediaInput.files &&
      mediaInput.files[0]
        ? mediaInput.files[0]
        : null;

    if(!selectedFile){

      fileName.textContent = "";
      return;
    }

    const maxSize =
      25 * 1024 * 1024;

    if(selectedFile.size > maxSize){

      alert(
        "Media must be 25 MB or smaller."
      );

      mediaInput.value = "";
      selectedFile = null;
      return;
    }

    fileName.textContent =
      "📎 " +
      selectedFile.name;
  };


/* =====================================================
   VOICE
===================================================== */

voiceBtn.onclick =
  async function(){

    if(!requirePremium())
      return;

    if(
      recorder &&
      recorder.state === "recording"
    ){

      recorder.stop();

      voiceBtn.textContent =
        "🎙️ Voice";

      voiceBtn.classList.remove(
        "recording"
      );

      return;
    }

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      alert(
        "Voice recording is not supported by this browser."
      );

      return;
    }

    try{

      const stream =
        await navigator.mediaDevices
          .getUserMedia({
            audio:true
          });

      audioChunks = [];

      recorder =
        new MediaRecorder(
          stream
        );

      recorder.ondataavailable =
        event=>{

          if(event.data.size > 0)
            audioChunks.push(event.data);
        };

      recorder.onstop =
        ()=>{

          stream
            .getTracks()
            .forEach(
              track=>track.stop()
            );

          const blob =
            new Blob(
              audioChunks,
              {
                type:
                  recorder.mimeType ||
                  "audio/webm"
              }
            );

          selectedFile =
            new File(
              [blob],
              "voice-" +
              Date.now() +
              ".webm",
              {
                type:blob.type
              }
            );

          fileName.textContent =
            "🎙️ Voice recording ready";
        };

      recorder.start();

      voiceBtn.textContent =
        "⏹️ Stop";

      voiceBtn.classList.add(
        "recording"
      );

    }catch(error){

      console.error(error);

      alert(
        "Microphone permission was not granted."
      );
    }
  };


/* =====================================================
   UPLOAD
===================================================== */

async function uploadFile(file){

  if(!isPremium){

    throw new Error(
      "Premium is required for media sharing."
    );
  }

  const extension =
    file.name.includes(".")
      ? file.name
          .split(".")
          .pop()
          .toLowerCase()
      : "bin";

  const path =
    currentUser.id +
    "/community-" +
    crypto.randomUUID() +
    "." +
    extension;

  const {
    data,
    error
  } =
  await supabaseClient
    .storage
    .from("chat-media")
    .upload(
      path,
      file,
      {
        contentType:
          file.type ||
          "application/octet-stream",
        upsert:false
      }
    );

  if(error)
    throw error;

  const {
    data:urlData
  } =
  supabaseClient
    .storage
    .from("chat-media")
    .getPublicUrl(
      data.path
    );

  return urlData.publicUrl;
}


/* =====================================================

sendBtn.onclick =
  async function(){

    if(!currentUser)
      return;

    const text =
      messageInput.value.trim();

    if(
      !text &&
      !selectedFile
    )
      return;

    sendBtn.disabled =
      true;

    try{

      let payload = {

        sender_id:
          currentUser.id,

        receiver_id:
          null,

        content:
          text,

        message_type:
          "text",

        media_url:
          null,

        media_name:
          null,

        reactions:
          {}

      };

      if(selectedFile){

        const url =
          await uploadFile(
            selectedFile
          );

        let type =
          "audio";

        if(
          selectedFile.type &&
          selectedFile.type.startsWith("image/")
        ){

          type = "image";

        }else if(
          selectedFile.type &&
          selectedFile.type.startsWith("video/")
        ){

          type = "video";
        }

        payload.message_type =
          type;

        payload.media_url =
          url;

        payload.media_name =
          selectedFile.name;
      }

      const {
        error
      } =
      await supabaseClient
        .from("messages")
        .insert(payload);

      if(error)
        throw error;

      messageInput.value =
        "";

      selectedFile =
        null;

      mediaInput.value =
        "";

      fileName.textContent =
        "";

      await loadMessages();

    }catch(error){

      console.error(error);

      alert(
        error.message ||
        "Could not send message."
      );

    }finally{

      sendBtn.disabled =
        false;
    }
  };
