/* =========================================
   HELPERS
========================================= */

function escapeHTML(value) {

  const div =
    document.createElement("div");

  div.textContent =
    value ?? "";

  return div.innerHTML;
}


function formatTime(dateString) {

  return new Date(
    dateString
  ).toLocaleString();

function showPageStatus(text) {

  pageStatus.innerHTML = `
    <div class="status">
      ${escapeHTML(text)}
    </div>
  `;

  setTimeout(() => {
    pageStatus.innerHTML = "";
  }, 2500);

/* =========================================
   CURRENT USER
========================================= */

async function getCurrentUser() {

  const {
    data: {
      user
    }
  } =
  await supabaseClient.auth.getUser();

  currentUser =
    user || null;

}


/* =========================================
   CHECK FRIEND STATUS
========================================= */

async function getFriendStatus(otherUserId) {

  if (!currentUser || currentUser.id === otherUserId) {
    return "self";
  }


  const {
    data: friendships,
    error: friendError
  } =
  await supabaseClient
    .from("friends")
    .select("id,user_id,friend_id")
    .or(
      `and(user_id.eq.${currentUser.id},friend_id.eq.${otherUserId}),and(user_id.eq.${otherUserId},friend_id.eq.${currentUser.id})`
    );


  if (!friendError && friendships && friendships.length > 0) {
    return "friends";
  }


  const {
    data: sentRequests,
    error: sentError
  } =
  await supabaseClient
    .from("friend_requests")
    .select("id,status")
    .eq("sender_id", currentUser.id)
    .eq("receiver_id", otherUserId)
    .eq("status", "pending")
    .limit(1);


  if (!sentError && sentRequests && sentRequests.length > 0) {
    return "sent";
  }


  const {
    data: receivedRequests,
    error: receivedError
  } =
  await supabaseClient
    .from("friend_requests")
    .select("id,status")
    .eq("sender_id", otherUserId)
    .eq("receiver_id", currentUser.id)
    .eq("status", "pending")
    .limit(1);


  if (
    !receivedError &&
    receivedRequests &&
    receivedRequests.length > 0
  ) {
    return "received";
  }


  return "none";

}


/* =========================================
   FRIEND REQUEST
========================================= */

async function sendFriendRequest(otherUserId, button) {

  if (!currentUser) {

    window.location.href =
      "login.html";

    return;

  }


  if (currentUser.id === otherUserId) {

    return;

  }


  button.disabled = true;
  button.textContent = "Sending...";


  try {

    const status =
      await getFriendStatus(otherUserId);


    if (status === "friends") {

      button.textContent =
        "👥 Friends";

      button.className =
        "action-btn pending-btn";

      return;

    }


    if (status === "sent") {

      button.textContent =
        "⏳ Request Sent";

      button.className =
        "action-btn pending-btn";

      return;

    }


    if (status === "received") {

      button.textContent =
        "📩 Check Requests";

      button.className =
        "action-btn pending-btn";

      return;

    }


    const {
      error
    } =
    await supabaseClient
      .from("friend_requests")
      .insert({

        sender_id:
          currentUser.id,

        receiver_id:
          otherUserId,

        status:
          "pending"

      });


    if (error) {
      throw error;
    }


    button.textContent =
      "⏳ Request Sent";

    button.className =
      "action-btn pending-btn";

    showPageStatus(
      "✅ Friend request sent!"
    );


  } catch (error) {

    console.error(
      "Friend request error:",
      error
    );

    button.disabled = false;

    button.textContent =
      "➕ Add Friend";

    showPageStatus(
      "❌ " +
      (
        error.message ||
        "Could not send friend request."
      )
    );

  }

}

    if (friendStatus === "friends") {

      friendButton.textContent =
        "👥 Friends";

      friendButton.className =
        "action-btn pending-btn";

      friendButton.disabled =
        true;

    } else if (friendStatus === "sent") {

        "⏳ Request Sent";

        "action-btn pending-btn";

      friendButton.disabled =
        true;

    } else if (friendStatus === "received") {

      friendButton.textContent =

      friendButton.className =

      friendButton.disabled =
        true;

    } else {

      friendButton.addEventListener(
        "click",
        function() {

          sendFriendRequest(
            userId,
            friendButton
          );

        }
      );

    }


    actions.appendChild(
      friendButton
    );

  }


  return actions;

}


/* =========================================
   LOAD POSTS
========================================= */

async function loadPosts() {

  postsContainer.innerHTML = `
    <div class="status">
      Loading posts...
    </div>
  `;


  const {
    data: posts,
    error: postsError
  } =
  await supabaseClient
    .from("posts")
    .select(
      "id,user_id,content,created_at,edited"
    )
    .order(
      "created_at",
      {
        ascending: false
      }
    );


  if (postsError) {

    console.error(
      "Posts error:",
      postsError
    );

    postsContainer.innerHTML = `
      <div class="status error">
        ❌ Could not load posts.<br><br>
        ${escapeHTML(postsError.message)}
      </div>
    `;

    return;

  }


  if (
    !posts ||
    posts.length === 0
  ) {

    postsContainer.innerHTML = `
      <div class="status">
        🌟 No posts yet.<br><br>
        Be the first person to post!
      </div>
    `;

    return;

  }


  const userIds =
    [
      ...new Set(
        posts.map(
          post => post.user_id
        )
      )
    ];


  let profiles = [];


  if (userIds.length > 0) {

    const {
      data,
      error: profileError
    } =
    await supabaseClient
      .from("profiles")
      .select(
        'username,role,badge,premium,"user-id"'
      )
      .in(
        "user-id",
        userIds
      );


    if (profileError) {

      console.error(
        "Profiles error:",
        profileError
      );

    } else {

      profiles =
        data || [];

    }

  }


  const profileMap =
    new Map();


  profiles.forEach(
    profile => {

      profileMap.set(
        profile["user-id"],
        profile
      );

    }
  );


  postsContainer.innerHTML = "";


  for (
    const post of posts
  ) {

    const profile =
      profileMap.get(
        post.user_id
      ) || {};


    const username =
      profile.username ||
      "TeenSpace User";


    const role =
      profile.role ||
      "user";


    const isPremium =
      profile.premium === true;


    const card =
      document.createElement(
        "article"
      );


    card.className =
      "post";


    if (role === "owner") {
      card.classList.add(
        "post-owner"
      );
    }


    if (role === "staff") {
      card.classList.add(
        "post-staff"
      );
    }


    let badgeHTML = "";


    if (role === "owner") {

      badgeHTML += `
        <span class="badge owner-badge">
          👑 ${escapeHTML(
            profile.badge ||
            "FOUNDER"
          )}
        </span>
      `;

    } else if (role === "staff") {

      badgeHTML += `
        <span class="badge staff-badge">
          🛡️ STAFF
        </span>
      `;

    } else {

      badgeHTML += `
        <span class="badge member-badge">
          👤 MEMBER
        </span>
      `;

    }


    if (isPremium) {

      badgeHTML += `
        <span class="badge premium-badge">
          💎 PREMIUM
        </span>
      `;

    }


    card.innerHTML = `

      <div class="post-header">

        <div>

          <div class="username">
            👤 ${escapeHTML(username)}
          </div>

          <div class="badge-row">
            ${badgeHTML}
          </div>

        </div>

      </div>


      <div class="message">
        ${escapeHTML(post.content)}
      </div>


      <div class="time">

        ${formatTime(

        )}

        ${

            ? '<span class="edited">(edited)</span>'
            : ''
        }

      </div>

    `;


    /*
      Store this post's content for Quote.
    */

    const quoteButton =
      document.createElement("button");

    quoteButton.className =
      "action-btn quote-button";

    quoteButton.textContent =
      "💬 Quote";


    quoteButton.addEventListener(
      "click",
      function() {

        const quoteText =
          "> " +
          username +
          ": " +

        window.location.href =

          encodeURIComponent(

      }

    const actions =

    actions.className =

    actions.appendChild(
      quoteButton
    );


    /*
      Add Message + Friend buttons
      for other members.
    */

    if (
      currentUser &&
      currentUser.id !== post.user_id
    ) {

      const messageLink =
        document.createElement("a");

      messageLink.className =
        "action-btn message-btn";

      messageLink.textContent =
        "💬 Message";

      messageLink.href =
        "messages.html?user_id=" +
        encodeURIComponent(
          post.user_id
        ) +
        "&name=" +

      actions.appendChild(

      const friendButton =
        document.createElement("button");

      friendButton.className =
        "action-btn friend-btn";

      friendButton.textContent =

/* =========================================
   EDIT POST
========================================= */

function openEdit(
  card,
  post
) {

  const message =
    card.querySelector(
      ".message"
    );

  const actions =
    card.querySelector(
      ".actions"
    );


  message.style.display =
    "none";

  actions.style.display =
    "none";


  const editArea =
    document.createElement(
      "div"
    );

  editArea.className =
    "edit-area";


  const textarea =
    document.createElement(
      "textarea"
    );

  textarea.value =
    post.content;


  const saveButton =
    document.createElement(
      "button"
    );

  saveButton.className =
    "save-edit";

  saveButton.textContent =
    "Save Changes";


  saveButton.addEventListener(
    "click",
    async function() {

      const newContent =
        textarea.value.trim();


      if (!newContent) {

        alert(
          "Post cannot be empty."
        );

        return;

      }


      const {
        error
      } =
      await supabaseClient
        .from("posts")
        .update({

          content:
            newContent,

          edited:
            true

        })
        .eq(
          "id",
          post.id
        );


      if (error) {

        console.error(
          error
        );

        alert(
          error.message
        );

        return;

      }


      loadPosts();

    }
  );


  editArea.appendChild(
    textarea
  );

  editArea.appendChild(
    saveButton
  );

  card.appendChild(
    editArea
  );

}


/* =========================================
   DELETE POST
========================================= */

async function deletePost(
  postId
) {

  const confirmed =
    confirm(
      "Delete this post?"
    );


  if (!confirmed) {
    return;
  }


  const {
    error
  } =
  await supabaseClient
    .from("posts")
    .delete()
    .eq(
      "id",
      postId
    );


  if (error) {
