
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Community | TeenSpace 🌍</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    background: linear-gradient(135deg, #f4f7ff, #eee8ff);
    color: #222;
}


/* HEADER */

header {
    background: #6c5ce7;
    color: white;
    padding: 20px 8%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 28px;
    font-weight: bold;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 16px;
    font-weight: bold;
}

nav a:hover {
    text-decoration: underline;
}


/* HERO */

.hero {
    text-align: center;
    padding: 45px 20px 25px;
}

.hero h1 {
    color: #6c5ce7;
    font-size: 42px;
    margin-bottom: 10px;
}

.hero p {
    color: #666;
    font-size: 18px;
}


/* MAIN */

.container {
    width: 92%;
    max-width: 800px;
    margin: 20px auto 60px;
}


/* CREATE POST */

.create-post {
    display: block;
    width: 100%;
    background: #6c5ce7;
    color: white;
    text-decoration: none;
    text-align: center;
    padding: 19px;
    border-radius: 16px;
    font-size: 21px;
    font-weight: bold;
    margin-bottom: 28px;
    box-shadow: 0 7px 20px rgba(108,92,231,0.25);
}

.create-post:hover {
    background: #5849c4;
}


/* POST CARD */

.post {
    background: white;
    border-radius: 20px;
    padding: 23px;
    margin-bottom: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    border-left: 6px solid #6c5ce7;
}

.post-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.username {
    color: #6c5ce7;
    font-size: 20px;
    font-weight: bold;
}

.message {
    margin-top: 16px;
    font-size: 18px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-wrap: break-word;
}

.time {
    margin-top: 14px;
    color: #999;
    font-size: 13px;
}


/* BUTTONS */

.actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 18px;
}

.action-btn {
    border: none;
    padding: 9px 13px;
    border-radius: 9px;
    cursor: pointer;
    font-weight: bold;
    background: #eeeaff;
    color: #5a49c7;
}

.action-btn:hover {
    background: #ddd6ff;
}

.delete-btn {
    background: #ffe7eb;
    color: #d63050;
}

.delete-btn:hover {
    background: #ffd4dc;
}


/* EDIT BOX */

.edit-box {
    margin-top: 15px;
}

.edit-box textarea {
    width: 100%;
    min-height: 120px;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 12px;
    font-size: 17px;
    resize: vertical;
}

.save-btn {
    margin-top: 8px;
    border: none;
    padding: 10px 16px;
    border-radius: 9px;
    background: #6c5ce7;
    color: white;
    font-weight: bold;
    cursor: pointer;
}


/* QUOTE */

.quote {
    margin-top: 15px;
    padding: 14px;
    border-left: 4px solid #6c5ce7;
    background: #f5f2ff;
    color: #666;
    border-radius: 8px;
}


/* EMPTY / LOADING */

.status {
    background: white;
    padding: 30px;
    border-radius: 18px;
    text-align: center;
    color: #666;
    box-shadow: 0 6px 20px rgba(0,0,0,0.06);
}


/* FOOTER */

footer {
    background: #222;
    color: white;
    text-align: center;
    padding: 25px;
}


/* MOBILE */

@media (max-width: 700px) {

    header {
        flex-direction: column;
        gap: 15px;
    }

    nav a {
        margin: 5px;
        display: inline-block;
    }

    .hero h1 {
        font-size: 33px;
    }

    .post {
        padding: 20px;
    }

}

</style>

</head>


<body>


<header>

    <div class="logo">
        🌍 TeenSpace
    </div>

    <nav>

        <a href="home.html">Home</a>

        <a href="explore.html">Explore</a>

        <a href="community.html">Community</a>

        <a href="profile.html">Profile</a>

    </nav>

</header>



<section class="hero">

    <h1>
        💬 TeenSpace Community
    </h1>

    <p>
        Share, reply and connect with the TeenSpace community.
    </p>

</section>



<main class="container">


    <a
        href="post.html"
        class="create-post"
    >
        ✍️ Create a Post
    </a>


    <div id="posts">

        <div class="status">
            Loading posts...
        </div>

    </div>


</main>



<footer>

    © 2026 TeenSpace 🌍 |
    Made for teens, with safety in mind.

</footer>



<script>


/* SUPABASE */

const SUPABASE_URL =
    "https://gcigveojqwwovitlwtxl.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Br7HdEgbHvQxx4_8HHR9Fg_fJ5sH_r7";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const postsContainer =
    document.getElementById("posts");


let currentUser = null;


/* CHECK USER */

async function getCurrentUser() {

    const {
        data: {
            user
        }
    } =
    await supabaseClient.auth.getUser();

    currentUser = user;

}


/* ESCAPE HTML */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* TIME */

function formatTime(dateString) {

    const date =
        new Date(dateString);

    return date.toLocaleString();

}


/* LOAD POSTS */

async function loadPosts() {


    const {
        data,
        error
    } =
    await supabaseClient

        .from("posts")

        .select(`
            id,
            user_id,
            content,
            created_at,
            profiles (
                username
            )
        `)

        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(error);

        postsContainer.innerHTML = `

            <div class="status">

                ❌ Could not load posts.

            </div>

        `;

        return;

    }


    if (!data || data.length === 0) {

        postsContainer.innerHTML = `

            <div class="status">

                🌟 No posts yet.

                <br><br>

                Be the first person to post!

            </div>

        `;

        return;

    }


    postsContainer.innerHTML = "";


    data.forEach(post => {


        const username =
            post.profiles?.username ||
            "TeenSpace User";


        const card =
            document.createElement("div");

        card.className = "post";


        const header =
            document.createElement("div");

        header.className =
            "post-header";


        const name =
            document.createElement("div");

        name.className =
            "username";


        name.textContent =
            "👤 " + username;


        header.appendChild(name);


        card.appendChild(header);


        const message =
            document.createElement("div");

        message.className =
            "message";


        message.textContent =
            post.content;


        card.appendChild(message);


        const time =
            document.createElement("div");

        time.className =
            "time";


        time.textContent =
            formatTime(
                post.created_at
            );


        card.appendChild(time);


        /* ACTIONS */

        const actions =
            document.createElement("div");

        actions.className =
            "actions";


        /* QUOTE */

        const quoteButton =
            document.createElement("button");

        quoteButton.className =
            "action-btn";

        quoteButton.textContent =
            "💬 Quote";


        quoteButton.onclick =
            function() {

                const quoteText =
                    "> " +
                    username +
                    ": " +
                    post.content;


                window.location.href =
                    "post.html?quote=" +
                    encodeURIComponent(
                        quoteText
                    );

            };


        actions.appendChild(
            quoteButton
        );


        /* OWN POST BUTTONS */

        if (
            currentUser &&
            currentUser.id === post.user_id
        ) {


            /* EDIT */

            const editButton =
                document.createElement("button");

            editButton.className =
                "action-btn";

            editButton.textContent =
                "✏️ Edit";


            editButton.onclick =
                function() {

                    openEdit(
                        card,
                        post
                    );

                };


            actions.appendChild(
                editButton
            );


            /* DELETE */

            const deleteButton =
                document.createElement("button");

            deleteButton.className =
                "action-btn delete-btn";

            deleteButton.textContent =
                "🗑️ Delete";


            deleteButton.onclick =
                function() {

                    deletePost(
                        post.id
                    );

                };


            actions.appendChild(
                deleteButton
            );

        }


        card.appendChild(actions);


        postsContainer.appendChild(card);


    });


}


/* EDIT */

function openEdit(card, post) {


    const oldMessage =
        card.querySelector(".message");


    const oldActions =
        card.querySelector(".actions");


    oldMessage.style.display =
        "none";

    oldActions.style.display =
        "none";


    const editBox =
        document.createElement("div");

    editBox.className =
        "edit-box";


    const textarea =
        document.createElement("textarea");

    textarea.value =
        post.content;


    const save =
        document.createElement("button");

    save.className =
        "save-btn";

    save.textContent =
        "Save Changes";


    save.onclick =
        async function() {


            const newContent =
                textarea.value.trim();


            if (!newContent) {

                alert(
                    "Post cannot be empty."
                );

                return;

            }


            const {
                error
            } =
            await supabaseClient

                .from("posts")

                .update({

                    content:
                        newContent

                })

                .eq(
                    "id",
                    post.id
                );


            if (error) {

                console.error(error);

                alert(
                    "Could not edit post."
                );

                return;

            }


            loadPosts();

        };


    editBox.appendChild(
        textarea
    );


    editBox.appendChild(
        save
    );


    card.appendChild(
        editBox
    );

}


/* DELETE */

async function deletePost(postId) {


    const confirmed =
        confirm(
            "Delete this post?"
        );


    if (!confirmed) {

        return;

    }


    const {
        error
    } =
    await supabaseClient

        .from("posts")

        .delete()

        .eq(
            "id",
            postId
        );


    if (error) {

        console.error(error);

        alert(
            "Could not delete post."
        );

        return;

    }


    loadPosts();

}


/* START */

async function start() {

    await getCurrentUser();

    await loadPosts();

}


start();

</script>


</body>
</html>
