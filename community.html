<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Community | TeenSpace 🌍</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

margin:0;
background:linear-gradient(
135deg,
#f4f7ff,
#eee8ff
);

color:#222;

}



header{

background:#6c5ce7;
color:white;
padding:20px 8%;
display:flex;
justify-content:space-between;
align-items:center;

}



.logo{

font-size:28px;
font-weight:bold;

}



nav a{

color:white;
text-decoration:none;
margin-left:15px;
font-weight:bold;

}



.hero{

text-align:center;
padding:45px 20px;

}



.hero h1{

color:#6c5ce7;
font-size:42px;

}



.hero p{

color:#555;
font-size:18px;

}



.container{

width:92%;
max-width:800px;
margin:auto;

}



.create{

background:#6c5ce7;
color:white;
text-decoration:none;
display:block;
text-align:center;
padding:18px;
border-radius:15px;
font-size:22px;
font-weight:bold;
margin-bottom:30px;

}



.create:hover{

background:#5849c4;

}




.post{

background:white;
padding:25px;
border-radius:20px;
margin-bottom:20px;
box-shadow:0 8px 25px rgba(0,0,0,.08);

}



.username{

font-size:20px;
font-weight:bold;
color:#6c5ce7;

}



.badge{

background:#ffd700;
padding:5px 10px;
border-radius:20px;
font-size:12px;
margin-left:8px;

}



.message{

margin-top:15px;
font-size:18px;
line-height:1.5;

}



.time{

margin-top:15px;
color:#888;
font-size:14px;

}



.loading{

text-align:center;
color:#6c5ce7;
font-size:20px;

}



footer{

background:#222;
color:white;
text-align:center;
padding:25px;
margin-top:50px;

}



@media(max-width:700px){

header{

flex-direction:column;
gap:15px;

}


.hero h1{

font-size:32px;

}

}

</style>

</head>



<body>



<header>


<div class="logo">
🌍 TeenSpace
</div>


<nav>

<a href="home.html">Home</a>
<a href="explore.html">Explore</a>
<a href="community.html">Community</a>
<a href="profile.html">Profile</a>

</nav>


</header>




<section class="hero">


<h1>
💬 TeenSpace Community
</h1>


<p>
Share messages and connect with everyone.
</p>


</section>





<div class="container">



<a href="post.html" class="create">

✍️ Create a Post

</a>



<div id="posts">

<div class="loading">

Loading messages...

</div>

</div>



</div>




<footer>

© 2026 TeenSpace 🌍

</footer>





<script>


const SUPABASE_URL =
"https://gcigveojqwwovitlwtxl.supabase.co";


const SUPABASE_KEY =
"sb_publishable_Br7HdEgbHvQxx4_8HHR9Fg_fJ5sH_r7";



const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



const postsBox =
document.getElementById("posts");




async function loadPosts(){


const {data,error}=

await supabaseClient

.from("posts")

.select(`
content,
created_at,
user_id
`)

.order(
"created_at",
{
ascending:false
}
);



if(error){

postsBox.innerHTML=

"❌ Could not load posts";

console.log(error);

return;

}



if(data.length===0){

postsBox.innerHTML=

"No posts yet. Be the first! 🚀";

return;

}



let html="";



for(let post of data){



let username="TeenSpace User";



const {data:profile}=

await supabaseClient

.from("profiles")

.select("username")

.eq(
"id",
post.user_id
)

.single();



if(profile){

username=profile.username;

}



html += `


<div class="post">


<div class="username">

👤 ${username}

</div>



<div class="message">

${post.content}

</div>



<div class="time">

${new Date(post.created_at)
.toLocaleString()}

</div>



</div>


`;

}



postsBox.innerHTML=html;



}



loadPosts();



</script>


</body>

</html>
