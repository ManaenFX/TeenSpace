
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TeenSpace Community 💬</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}

body{
  margin:0;
  background:#17151f;
  color:#eee;
  height:100vh;
  overflow:hidden;
}

.app{
  height:100vh;
  display:flex;
}

/* SIDEBAR */
.sidebar{
  width:270px;
  background:#211f2b;
  border-right:1px solid #302d3c;
  padding:22px 16px;
  display:flex;
  flex-direction:column;
}

.logo{
  font-size:25px;
  font-weight:800;
  color:#9b8cff;
  padding:8px 12px 25px;
}

.menu-title,
.channel-title{
  color:#777285;
  font-size:11px;
  font-weight:bold;
  text-transform:uppercase;
  padding:0 12px 8px;
}

.nav a{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  margin-bottom:4px;
  border-radius:10px;
  color:#b9b5c5;
  text-decoration:none;
  font-weight:bold;
}

.nav a:hover,
.nav a.active{
  background:#302b49;
  color:#b39cff;
}

.channel-title{
  margin-top:25px;
}

.channel{
  padding:12px;
  border-radius:10px;
  color:#b39cff;
  background:#302b49;
  font-weight:bold;
}

.sidebar-bottom{
  margin-top:auto;
}

.premium{
  display:block;
  background:#342e20;
  color:#e8c75b;
  text-decoration:none;
  padding:13px;
  border-radius:10px;
  font-weight:bold;
  text-align:center;
}

/* MAIN */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
}

.topbar{
  height:75px;
  background:#211f2b;
  border-bottom:1px solid #302d3c;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
}

.channel-name{
  font-size:21px;
  font-weight:800;
}

.channel-description{
  color:#817d8e;
  font-size:13px;
  margin-top:3px;
}

.online{
  color:#58c98a;
  font-size:13px;
  font-weight:bold;
}

/* CHAT */
.chat{
  flex:1;
  overflow-y:auto;
  padding:25px;
  background:#17151f;
}

.welcome{
  background:#211f2b;
  border:1px solid #302d3c;
  border-radius:16px;
  padding:20px;
  margin-bottom:22px;
}

.welcome h2{
  margin:0 0 7px;
  color:#a08dff;
}

.welcome p{
  margin:0;
  color:#9994a6;
  line-height:1.5;
}

.message{
  display:flex;
  gap:12px;
  margin-bottom:22px;
  padding:8px;
  border-radius:12px;
}

.message:hover{
  background:#1e1c27;
}

.avatar{
  width:43px;
  height:43px;
  min-width:43px;
  border-radius:50%;
  background:#302b49;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:20px;
}

.message-body{
  min-width:0;
}

.message-top{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.username{
  font-weight:800;
  color:#a895ff;
  cursor:pointer;
}

.username:hover{
  text-decoration:underline;
}

.badge{
  font-size:10px;
  font-weight:bold;
  padding:4px 7px;
  border-radius:999px;
}

.owner{
  background:#4a3e20;
  color:#e7c65c;
}

.staff{
  background:#233b52;
  color:#72b9ee;
}

.premium-badge{
  background:#4a2940;
  color:#ed72b4;
}

.member{
  background:#302b49;
  color:#a895ff;
}

.message-time{
  color:#666273;
  font-size:11px;
}

.message-text{
  margin-top:6px;
  color:#ddd9e5;
  line-height:1.55;
  white-space:pre-wrap;
  word-break:break-word;
}

.reactions{
  display:flex;
  gap:5px;
  margin-top:8px;
}

.react{
  border:1px solid #393545;
  background:#24212e;
  color:#ccc7d7;
  border-radius:999px;
  padding:4px 9px;
  cursor:pointer;
}

.react:hover{
  background:#302b49;
  border-color:#504777;
}

/* COMPOSER */
.composer{
  background:#211f2b;
  border-top:1px solid #302d3c;
  padding:14px 20px;
}

.tools{
  display:flex;
  gap:6px;
  margin-bottom:8px;
}

.tool{
  border:1px solid #393545;
  background:#292633;
  color:#c9c3d6;
  border-radius:9px;
  padding:7px 10px;
  cursor:pointer;
}

.tool:hover{
  background:#302b49;
  color:#b39cff;
}

.emoji-panel{
  display:none;
  background:#24212e;
  border:1px solid #393545;
  padding:8px;
  border-radius:12px;
  margin-bottom:8px;
}

.emoji-panel button{
  border:none;
  background:none;
  color:white;
  font-size:22px;
  cursor:pointer;
  padding:5px;
}

.emoji-panel button:hover{
  background:#302b49;
  border-radius:7px;
}

.input-row{
  display:flex;
  gap:10px;
}

textarea{
  flex:1;
  resize:none;
  min-height:48px;
  max-height:120px;
  border:1px solid #393545;
  background:#181620;
  color:#eee;
  border-radius:13px;
  padding:13px;
  outline:none;
  font-size:15px;
}

textarea::placeholder{
  color:#716c7c;
}

textarea:focus{
  border-color:#7662dc;
}

.send{
  border:none;
  background:#6c5ce7;
  color:#fff;
  border-radius:13px;
  padding:0 22px;
  font-weight:bold;
  cursor:pointer;
}

.send:hover{
  background:#7b6bed;
}

.status{
  text-align:center;
  padding:8px;
  font-size:13px;
  color:#777285;
  background:#211f2b;
}

.error{color:#ff6b81}
.success{color:#58c98a}

@media(max-width:750px){

  .sidebar{
    width:68px;
    padding:15px 7px;
  }

  .logo{
    font-size:0;
    text-align:center;
  }

  .logo::first-letter{
    font-size:25px;
  }

  .nav a{
    justify-content:center;
    font-size:0;
  }

  .nav a:first-letter{
    font-size:20px;
  }

  .menu-title,
  .channel-title,
  .channel,
  .premium{
    display:none;
  }

  .topbar{
    padding:0 15px;
  }

  .channel-description{
    display:none;
  }

  .chat{
    padding:15px;
  }

  .composer{
    padding:10px;
  }

  .send{
    padding:0 15px;
  }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

  <div class="logo">🌍 TeenSpace</div>

  <div class="menu-title">Navigation</div>

  <nav class="nav">
    <a href="home.html">🏠 Home</a>
    <a href="explore.html">🌍 Explore</a>
    <a href="community.html" class="active">💬 Community</a>
    <a href="profile.html">👤 Profile</a>
    <a href="friends.html">👥 Friends</a>
  </nav>

  <div class="channel-title">Community</div>

  <div class="channel">
    💬 General Chat
  </div>

  <div class="sidebar-bottom">
    <a href="premium.html" class="premium">
      💎 Premium
    </a>
  </div>

</aside>

<main class="main">

<header class="topbar">

  <div>
    <div class="channel-name"># General Chat</div>
    <div class="channel-description">
      Talk, share ideas and meet the TeenSpace community.
    </div>
  </div>

  <div class="online">
    🟢 Online
  </div>

</header>

<section id="chat" class="chat">

  <div class="welcome">
    <h2>👋 Welcome to TeenSpace!</h2>
    <p>
      Talk with the community, share ideas and have fun 🌍💜
    </p>
  </div>

  <div id="loading" class="status">
    Loading community...
  </div>

  <div id="messages"></div>

</section>

<div id="status" class="status"></div>

<section class="composer">

  <div id="emojiPanel" class="emoji-panel">
    <button>😀</button>
    <button>😂</button>
    <button>😍</button>
    <button>🥰</button>
    <button>😎</button>
    <button>😭</button>
    <button>😱</button>
    <button>🤔</button>
    <button>🙌</button>
    <button>👏</button>
    <button>❤️</button>
    <button>💜</button>
    <button>💙</button>
    <button>🔥</button>
    <button>⭐</button>
    <button>🎉</button>
    <button>🤣</button>
    <button>😮</button>
    <button>👍</button>
    <button>👀</button>
    <button>💯</button>
    <button>😄</button>
    <button>😢</button>
    <button>😡</button>
    <button>🤩</button>
    <button>🥳</button>
    <button>🙈</button>
    <button>💀</button>
    <button>✨</button>
    <button>🌍</button>
    <button>🚀</button>
  </div>

  <div class="tools">
    <button id="emojiBtn" class="tool">
      😀 Emoji
    </button>
  </div>

  <div class="input-row">

    <textarea
      id="messageInput"
      maxlength="2000"
      placeholder="Message #general..."
    ></textarea>

    <button id="sendBtn" class="send">
      Send
    </button>

  </div>

</section>

</main>

</div>

<script>

const SUPABASE_URL =
  "https://gcigveojqwwovitlwtxl.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Br7HdEgbHvQxx4_8HHR9Fg_fJ5sH_r7";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true
      }
    }
  );

const messagesBox =
  document.getElementById("messages");

const loading =
  document.getElementById("loading");

const input =
  document.getElementById("messageInput");

const sendBtn =
  document.getElementById("sendBtn");

const status =
  document.getElementById("status");

const emojiBtn =
  document.getElementById("emojiBtn");

const emojiPanel =
  document.getElementById("emojiPanel");

let currentUser = null;

function escapeHTML(value){

  const div =
    document.createElement("div");

  div.textContent =
    value || "";

  return div.innerHTML;
}

async function getUser(){

  const {
    data:{
      user
    }
  } =
  await supabaseClient.auth.getUser();

  if(!user){

    window.location.href =
      "login.html";

    return null;
  }

  return user;
}

/* EMOJI */

emojiBtn.addEventListener(
  "click",
  function(){

    emojiPanel.style.display =
      emojiPanel.style.display === "block"
      ? "none"
      : "block";

  }
);

emojiPanel
.querySelectorAll("button")
.forEach(button=>{

  button.addEventListener(
    "click",
    function(){

      const emoji =
        button.textContent;

      const start =
        input.selectionStart;

      const end =
        input.selectionEnd;

      input.value =
        input.value.slice(0,start) +
        emoji +
        input.value.slice(end);

      input.focus();

      input.selectionStart =
        input.selectionEnd =
        start + emoji.length;

    }
  );

});

/* LOAD POSTS */

async function loadPosts(){

  const {
    data:posts,
    error
  } =
  await supabaseClient
    .from("posts")
    .select(
      "id,user_id,content,created_at"
    )
    .order(
      "created_at",
      {
        ascending:true
      }
    );

  if(error){

    console.error(error);

    loading.textContent =
      "❌ Could not load community.";

    loading.className =
      "status error";

    return;
  }

  loading.remove();

  if(!posts || posts.length === 0){

    messagesBox.innerHTML = `
      <div class="status">
        🌟 No messages yet. Start the conversation!
      </div>
    `;

    return;
  }

  const ids =
    [
      ...new Set(
        posts.map(
          post=>post.user_id
        )
      )
    ];

  let profiles = [];

  if(ids.length){

    const {
      data
    } =
    await supabaseClient
      .from("profiles")
      .select(
        'username,role,badge,premium,"user-id"'
      )
      .in(
        "user-id",
        ids
      );

    profiles =
      data || [];
  }

  const profileMap =
    new Map();

  profiles.forEach(profile=>{

    profileMap.set(
      profile["user-id"],
      profile
    );

  });

  messagesBox.innerHTML = "";

  posts.forEach(post=>{

    const profile =
      profileMap.get(
        post.user_id
      ) || {};

    renderMessage(
      post,
      profile
    );

  });

  scrollBottom();
}

/* RENDER */

function renderMessage(post,profile){

  const username =
    profile.username ||
    "TeenSpace Member";

  const role =
    profile.role ||
    "user";

  const premium =
    profile.premium === true;

  const div =
    document.createElement("div");

  div.className =
    "message";

  let badge = "";

  if(role === "owner"){

    badge =
      `<span class="badge owner">👑 ${
        escapeHTML(
          profile.badge || "FOUNDER"
        )
      }</span>`;

  }else if(role === "staff"){

    badge =
      `<span class="badge staff">🛡️ STAFF</span>`;

  }else{

    badge =
      `<span class="badge member">👤 MEMBER</span>`;

  }

  if(premium){

    badge +=
      `<span class="badge premium-badge">
        💎 PREMIUM
      </span>`;

  }

  div.innerHTML = `

    <div class="avatar">
      👤
    </div>

    <div class="message-body">

      <div class="message-top">

        <span class="username">
          ${escapeHTML(username)}
        </span>

        ${badge}

        <span class="message-time">
          ${new Date(
            post.created_at
          ).toLocaleString()}
        </span>

      </div>

      <div class="message-text">
        ${escapeHTML(post.content)}
      </div>

      <div class="reactions">

        <button class="react">❤️</button>
        <button class="react">😂</button>
        <button class="react">🔥</button>
        <button class="react">👍</button>
        <button class="react">💯</button>

      </div>

    </div>
  `;

  messagesBox.appendChild(div);
}

/* SEND */

async function sendMessage(){

  const content =
    input.value.trim();

  if(!content) return;

  sendBtn.disabled =
    true;

  const {
    error
  } =
  await supabaseClient
    .from("posts")
    .insert({
      user_id:
        currentUser.id,
      content:
        content
    });

  if(error){

    console.error(error);

    status.textContent =
      "❌ " + error.message;

    status.className =
      "status error";

  }else{

    input.value = "";

    status.textContent =
      "✅ Message sent!";

    status.className =
      "status success";

    await loadPosts();

  }

  sendBtn.disabled =
    false;

  setTimeout(
    function(){
      status.textContent = "";
    },
    1500
  );
}

sendBtn.addEventListener(
  "click",
  sendMessage
);

input.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);

/* REACTIONS */

messagesBox.addEventListener(
  "click",
  function(event){

    if(
      event.target.classList.contains(
        "react"
      )
    ){

      event.target.style.background =
        "#302b49";

      event.target.style.borderColor =
        "#6558a0";

    }

  }
);

function scrollBottom(){

  const chat =
    document.getElementById("chat");

  chat.scrollTop =
    chat.scrollHeight;
}

/* REALTIME */

function subscribe(){

  supabaseClient
    .channel(
      "teen-space-community-dark"
    )
    .on(
      "postgres_changes",
      {
        event:"*",
        schema:"public",
        table:"posts"
      },
      function(){

        loadPosts();

      }
    )
    .subscribe();

}

/* START */

async function start(){

  currentUser =
    await getUser();

  if(!currentUser) return;

  await loadPosts();

  subscribe();

}

start();

</script>

</body>
</html>
