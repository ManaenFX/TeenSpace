<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join TeenSpace 🌍</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f7ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .box {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #6c5ce7;
        }

        .intro {
            text-align: center;
            color: #555;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            background: white;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #6c5ce7;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5849c4;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #6c5ce7;
            text-decoration: none;
        }

        .privacy {
            font-size: 13px;
            color: #777;
            margin-top: 18px;
            line-height: 1.5;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>🌍 Join TeenSpace</h1>

        <p class="intro">
            Create your TeenSpace profile and join teens
            from around the world.
        </p>

        <form onsubmit="joinSite(event)">

            <label for="username">Username</label>

            <input
                type="text"
                id="username"
                placeholder="Choose a username"
                required
            >


            <label for="country">Country</label>

            <select id="country" required>

                <option value="">Select your country</option>

                <option>Nigeria 🇳🇬</option>
                <option>Ghana 🇬🇭</option>
                <option>Kenya 🇰🇪</option>
                <option>South Africa 🇿🇦</option>
                <option>United States 🇺🇸</option>
                <option>Canada 🇨🇦</option>
                <option>United Kingdom 🇬🇧</option>
                <option>France 🇫🇷</option>
                <option>Germany 🇩🇪</option>
                <option>Spain 🇪🇸</option>
                <option>Italy 🇮🇹</option>
                <option>Brazil 🇧🇷</option>
                <option>Mexico 🇲🇽</option>
                <option>India 🇮🇳</option>
                <option>China 🇨🇳</option>
                <option>Japan 🇯🇵</option>
                <option>South Korea 🇰🇷</option>
                <option>Australia 🇦🇺</option>
                <option>New Zealand 🇳🇿</option>
                <option>Other 🌍</option>

            </select>


            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Create a password"
                required
            >


            <button type="submit">
                Create Account 🚀
            </button>

        </form>


        <p class="privacy">
            🛡️ Keep your personal information private.
            Never share your password or home address with other users.
        </p>


        <a class="back" href="index.html">
            ← Back to TeenSpace
        </a>

    </div>


    <script>

        function joinSite(event) {

            event.preventDefault();

            const username =
                document.getElementById("username").value;

            const country =
                document.getElementById("country").value;

            alert(
                "Welcome to TeenSpace, " +
                username +
                "! 🌍\n\nCountry: " +
                country
            );

            window.location.href = "index.html";
        }

    </script>

</body>
</html>
