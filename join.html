<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeenSpace - Join</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7ff;
      margin: 0;
      padding: 40px 20px;
    }

    .box {
      max-width: 450px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      background: #6c5ce7;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      opacity: 0.9;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>🌍 Join TeenSpace</h1>

    <p>Create your TeenSpace account and connect with teens around the world.</p>

    <form id="joinForm">

      <input
        type="text"
        id="username"
        placeholder="Username"
        required
      >

      <select id="country" required>
        <option value="">Select your country</option>
        <option>Nigeria</option>
        <option>Ghana</option>
        <option>United States</option>
        <option>United Kingdom</option>
        <option>Canada</option>
        <option>South Africa</option>
        <option>Kenya</option>
        <option>India</option>
        <option>Australia</option>
        <option>Other</option>
      </select>

      <input
        type="email"
        id="email"
        placeholder="Email address"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        minlength="6"
        required
      >

      <button type="submit">Create Account</button>

    </form>

    <div id="message"></div>

    <a class="back" href="index.html">← Back to TeenSpace</a>
  </div>

<script>
  const SUPABASE_URL = https://YOUR-PROJECT-ID.supabase.co
  const SUPABASE_KEY = sb_publishable_Br7HdEgbHvQxx4_8HHR9Fg_fJ5sH_r7

  const { createClient } = supabase;

  const supabaseClient = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const form = document.getElementById("joinForm");
  const message = document.getElementById("message");

  form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const username = document.getElementById("username").value.trim();
    const country = document.getElementById("country").value;
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    message.textContent = "Creating your account...";

    const { error } = await supabaseClient.auth.signUp({
      email: email,
      password: password,
      options: {
        data: {
          username: username,
          country: country
        }
      }
    });

    if (error) {
      message.textContent = error.message;
      return;
    }

    message.textContent =
      "🎉 Account created! Check your email to confirm your account.";

    form.reset();
  });
</script>

</body>
</html>
