<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join TeenSpace 🌍</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f7ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .box {
            background: white;
            width: 90%;
            max-width: 450px;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #6c5ce7;
        }

        p {
            text-align: center;
            color: #555;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #6c5ce7;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5849c4;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #6c5ce7;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>🌍 Join TeenSpace</h1>

        <p>Create your TeenSpace profile.</p>

        <form onsubmit="joinSite(event)">

            <label>Username</label>
            <input type="text" id="username" placeholder="Choose a username" required>

            <label>Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" id="password" placeholder="Create a password" required>

            <button type="submit">Create Account</button>

        </form>

        <a class="back" href="index.html">← Back to TeenSpace</a>

    </div>

    <script>
        function joinSite(event) {
            event.preventDefault();

            const username = document.getElementById("username").value;

            alert("Welcome to TeenSpace, " + username + "! 🌍");

            window.location.href = "index.html";
        }
    </script>

</body>
</html>
