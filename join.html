<script>


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://gcigveojqwwovitlwtxl.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Br7HdEgbHvQxx4_8HHR9Fg_fJ5sH_r7";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    }
  );


/* =========================================
   ELEMENTS
========================================= */

const form =
  document.getElementById("joinForm");

const message =
  document.getElementById("message");

const button =
  document.getElementById("joinButton");

const password =
  document.getElementById("password");

const togglePassword =
  document.getElementById("togglePassword");


/* =========================================
   SHOW / HIDE PASSWORD
========================================= */

togglePassword.addEventListener(
  "click",
  function() {

    if (
      password.type === "password"
    ) {

      password.type = "text";

      togglePassword.textContent =
        "Hide";

    } else {

      password.type = "password";

      togglePassword.textContent =
        "Show";

    }

  }
);


/* =========================================
   SIGN UP
========================================= */

form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    const username =
      document
        .getElementById("username")
        .value
        .trim();


    const country =
      document
        .getElementById("country")
        .value;


    const email =
      document
        .getElementById("email")
        .value
        .trim();


    const passwordValue =
      password.value;


    if (
      username.length < 2
    ) {

      showError(
        "Please choose a username with at least 2 characters."
      );

      return;

    }


    button.disabled =
      true;

    button.textContent =
      "Creating account...";


    message.textContent =
      "";


    try {


      /*
        Supabase creates the Auth account.
        The database trigger automatically creates
        the matching profiles row.
      */

      const {
        data,
        error
      } =
      await supabaseClient.auth.signUp({

        email:
          email,

        password:
          passwordValue,

        options: {

          data: {

            username:
              username,

            country:
              country

          }

        }

      });


      if (error) {

        throw error;

      }


      /*
        If email confirmation is enabled,
        session may be null. That's okay.
      */

      if (
        data &&
        data.session
      ) {

        message.className =
          "success";

        message.textContent =
          "🎉 Account created! Welcome to TeenSpace.";

        setTimeout(
          function() {

            window.location.href =
              "home.html";

          },
          1200
        );


      } else {

        message.className =
          "success";

        message.textContent =
          "🎉 Account created! Check your email to confirm your account.";

        form.reset();

        togglePassword.textContent =
          "Show";

      }


    } catch (error) {

      console.error(
        "Signup error:",
        error
      );


      showError(
        "❌ " +
        (
          error.message ||
          "Something went wrong."
        )
      );


    } finally {

      button.disabled =
        false;

      button.textContent =
        "Create Account 🚀";

    }

  }
);


/* =========================================
   ERROR
========================================= */

function showError(text) {

  message.className =
    "error";

  message.textContent =
    text;

}

</script>


</body>
