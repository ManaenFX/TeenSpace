<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TeenSpace - Join</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f7ff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 450px;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #6c5ce7;
      margin-bottom: 10px;
    }

    .intro {
      text-align: center;
      color: #666;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-top: 16px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    .password-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }

    .password-row input {
      flex: 1;
      min-width: 0;
    }

    .show-button {
      width: 70px;
      margin-top: 7px;
      border: none;
      border-radius: 8px;
      background: #ddd;
      color: #333;
      cursor: pointer;
    }

    .join-button {
      width: 100%;
      padding: 13px;
      margin-top: 22px;
      border: none;
      border-radius: 8px;
      background: #6c5ce7;
      color: white;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    .join-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      line-height: 1.5;
      font-weight: bold;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #6c5ce7;
      text-decoration: none;
    }

    .privacy {
      margin-top: 18px;
      text-align: center;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>🌍 Join TeenSpace</h1>

    <p class="intro">
      Create your TeenSpace account and connect with teens around the world.
    </p>

    <form id="joinForm">

      <label for="username">Username</label>

      <input
        type="text"
        id="username"
        placeholder="Choose a username"
        maxlength="20"
        required
      >


      <label for="country">Country</label>

      <select id="country" required>
        <option value="">Select your country</option>
        <option value="Nigeria">🇳🇬 Nigeria</option>
        <option value="Ghana">🇬🇭 Ghana</option>
        <option value="Kenya">🇰🇪 Kenya</option>
        <option value="South Africa">🇿🇦 South Africa</option>
        <option value="United States">🇺🇸 United States</option>
        <option value="Canada">🇨🇦 Canada</option>
        <option value="United Kingdom">🇬🇧 United Kingdom</option>
        <option value="France">🇫🇷 France</option>
        <option value="Germany">🇩🇪 Germany</option>
        <option value="India">🇮🇳 India</option>
        <option value="Japan">🇯🇵 Japan</option>
        <option value="Australia">🇦🇺 Australia</option>
        <option value="Brazil">🇧🇷 Brazil</option>
        <option value="Mexico">🇲🇽 Mexico</option>
        <option value="Other">🌍 Other</option>
      </select>


      <label for="email">Email</label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >


      <label for="password">Password</label>

      <div class="password-row">

        <input
          type="password"
          id="password"
          placeholder="Create a password"
          minlength="6"
          required
        >

        <button
          type="button"
          class="show-button"
          id="togglePassword"
        >
          Show
        </button>

      </div>


      <button
        type="submit"
        class="join-button"
        id="joinButton"
      >
        Create Account 🚀
      </button>

    </form>


    <div id="message"></div>


    <p class="privacy">
      🛡️ Keep your password private.
    </p>


    <a class="back" href="index.html">
      ← Back to TeenSpace
    </a>

  </div>


  <script>

    // =========================
    // SUPABASE
    // =========================

    const SUPABASE_URL =
      "https://gcigveojqwwovitlwtxl.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_Br7HdEgbHvQxx4_8HHR9Fg_fJ5sH_r7";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // =========================
    // ELEMENTS
    // =========================

    const form =
      document.getElementById("joinForm");

    const message =
      document.getElementById("message");

    const button =
      document.getElementById("joinButton");

    const password =
      document.getElementById("password");

    const togglePassword =
      document.getElementById("togglePassword");


    // =========================
    // SHOW / HIDE PASSWORD
    // =========================

    togglePassword.addEventListener("click", function() {

      if (password.type === "password") {

        password.type = "text";
        togglePassword.textContent = "Hide";

      } else {

        password.type = "password";
        togglePassword.textContent = "Show";

      }

    });


    // =========================
    // CREATE ACCOUNT
    // =========================

    form.addEventListener("submit", async function(event) {

      event.preventDefault();


      const username =
        document.getElementById("username").value.trim();

      const country =
        document.getElementById("country").value;

      const email =
        document.getElementById("email").value.trim();

      const passwordValue =
        password.value;


      button.disabled = true;
      button.textContent = "Creating account...";

      message.textContent = "";


      try {

        const { error } =
          await supabaseClient.auth.signUp({

            email: email,

            password: passwordValue,

            options: {

              data: {
                username: username,
                country: country
              }

            }

          });


        if (error) {

          message.textContent =
            "❌ " + error.message;

          button.disabled = false;
          button.textContent =
            "Create Account 🚀";

          return;
        }


        message.textContent =
          "🎉 Account created! Check your email to confirm your account.";

        form.reset();

        button.textContent =
          "Account Created ✓";

        togglePassword.textContent =
          "Show";


      } catch (error) {

        console.error(error);

        message.textContent =
          "❌ Something went wrong. Please try again.";

        button.disabled = false;
        button.textContent =
          "Create Account 🚀";

      }

    });

  </script>

</body>
</html>
