<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Messages | TeenSpace 💬</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: linear-gradient(135deg, #f4f7ff, #eee8ff);
      color: #222;
    }

    header {
      background: #6c5ce7;
      color: white;
      padding: 18px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 16px;
      font-weight: bold;
    }

    .container {
      width: 92%;
      max-width: 800px;
      margin: 35px auto;
    }

    .chat-card {
      background: white;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 10px 35px rgba(0,0,0,.08);
    }

    .chat-header {
      padding: 22px;
      background: linear-gradient(135deg, #6c5ce7, #8e74ff);
      color: white;
    }

    .chat-name {
      font-size: 25px;
      font-weight: bold;
    }

    .chat-subtitle {
      margin-top: 5px;
      opacity: .9;
    }

    .messages {
      height: 500px;
      overflow-y: auto;
      padding: 22px;
      background: #faf9ff;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 50px 20px;
    }

    .bubble-row {
      display: flex;
      margin-bottom: 14px;
    }

    .bubble-row.mine {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 75%;
      padding: 12px 15px;
      border-radius: 18px;
      background: #eeeaff;
      color: #333;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .mine .bubble {
      background: #6c5ce7;
      color: white;
      border-bottom-right-radius: 5px;
    }

    .bubble-time {
      font-size: 11px;
      margin-top: 6px;
      opacity: .7;
    }

    .composer {
      padding: 18px;
      display: flex;
      gap: 10px;
      background: white;
      border-top: 1px solid #eee;
    }

    textarea {
      flex: 1;
      min-height: 55px;
      max-height: 140px;
      resize: vertical;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 14px;
      font-size: 16px;
      outline: none;
    }

    textarea:focus {
      border-color: #6c5ce7;
    }

    .send {
      width: 120px;
      border: none;
      border-radius: 14px;
      background: #6c5ce7;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .send:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #status {
      text-align: center;
      padding: 12px;
      min-height: 20px;
    }

    .error {
      color: #d63050;
    }

    .success {
      color: #159447;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #6c5ce7;
      text-decoration: none;
      font-weight: bold;
    }

    @media (max-width: 700px) {
      header {
        flex-direction: column;
        gap: 14px;
      }

      nav a {
        margin: 4px 6px;
        display: inline-block;
      }

      .messages {
        height: 430px;
      }

      .composer {
        flex-direction: column;
      }

      .send {
        width: 100%;
        padding: 15px;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    🌍 TeenSpace
  </div>

  <nav>
    <a href="home.html">Home</a>
    <a href="explore.html">Explore</a>
    <a href="community.html">Community</a>
    <a href="profile.html">Profile</a>
  </nav>

</header>


<main class="container">

  <div class="chat-card">

    <div class="chat-header">

      <div id="chatName" class="chat-name">
        Private Message
      </div>

      <div class="chat-subtitle">
        🔒 Private conversation
      </div>

    </div>


    <div id="messages" class="messages">

      <div class="empty">
        Loading messages...
      </div>

    </div>


    <div
      id="status"
    ></div>


    <div class="composer">

      <textarea
        id="messageInput"
        maxlength="2000"
        placeholder="Write a private message..."
      ></textarea>

      <button
        id="sendButton"
        class="send"
      >
        Send 💬
      </button>

    </div>

  </div>


  <a
    href="explore.html"
    class="back"
  >
    ← Back to Explore
  </a>

</main>


<script>

const SUPABASE_URL =
  "https://gcigveojqwwovitlwtxl.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Br7HdEgbHvQxx4_8HHR9Fg_fJ5sH_r7";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true
      }
    }
  );


const messagesBox =
  document.getElementById("messages");

const messageInput =
  document.getElementById("messageInput");

const sendButton =
  document.getElementById("sendButton");

const status =
  document.getElementById("status");

const chatName =
  document.getElementById("chatName");


let currentUser = null;
let receiverId = null;
let receiverName = "User";


function escapeHTML(value) {

  const div =
    document.createElement("div");

  div.textContent =
    value ?? "";

  return div.innerHTML;

}


function getReceiverFromURL() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  receiverId =
    params.get("user_id");

  receiverName =
    params.get("name") ||
    "TeenSpace User";

  chatName.textContent =
    "💬 " + receiverName;
}


async function getCurrentUser() {

  const {
    data: {
      user
    },
    error
  } =
  await supabaseClient.auth.getUser();

  if (error || !user) {

    window.location.href =
      "login.html";

    return null;
  }

  return user;
}


async function loadMessages() {

  if (!currentUser || !receiverId) {
    return;
  }

  const {
    data,
    error
  } =
  await supabaseClient

    .from("messages")

    .select(
      "id, sender_id, receiver_id, content, created_at"
    )

    .or(
      `and(sender_id.eq.${currentUser.id},receiver_id.eq.${receiverId}),and(sender_id.eq.${receiverId},receiver_id.eq.${currentUser.id})`
    )

    .order(
      "created_at",
      {
        ascending: true
      }
    );


  if (error) {

    console.error(error);

    messagesBox.innerHTML = `
      <div class="empty">
        ❌ Could not load messages.
      </div>
    `;

    return;
  }


  if (!data || data.length === 0) {

    messagesBox.innerHTML = `
      <div class="empty">
        👋 Start the conversation.
      </div>
    `;

    return;
  }


  messagesBox.innerHTML = "";


  data.forEach(message => {

    const mine =
      message.sender_id === currentUser.id;


    const row =
      document.createElement("div");

    row.className =
      "bubble-row" +
      (mine ? " mine" : "");


    const bubble =
      document.createElement("div");

    bubble.className =
      "bubble";


    bubble.innerHTML = `
      <div>
        ${escapeHTML(message.content)}
      </div>

      <div class="bubble-time">
        ${new Date(
          message.created_at
        ).toLocaleString()}
      </div>
    `;


    row.appendChild(bubble);

    messagesBox.appendChild(row);

  });


  messagesBox.scrollTop =
    messagesBox.scrollHeight;
}


async function sendMessage() {

  const content =
    messageInput.value.trim();


  if (!content) {
    return;
  }


  if (!receiverId) {

    status.className =
      "error";

    status.textContent =
      "No recipient was selected.";

    return;
  }


  sendButton.disabled =
    true;

  sendButton.textContent =
    "Sending...";


  const {
    error
  } =
  await supabaseClient

    .from("messages")

    .insert({
      sender_id: currentUser.id,
      receiver_id: receiverId,
      content: content
    });


  if (error) {

    console.error(error);

    status.className =
      "error";

    status.textContent =
      "❌ " + error.message;

  } else {

    status.className =
      "success";

    status.textContent =
      "Sent ✓";

    messageInput.value = "";

    await loadMessages();

  }


  sendButton.disabled =
    false;

  sendButton.textContent =
    "Send 💬";


  setTimeout(() => {

    status.textContent = "";

  }, 1800);
}


sendButton.addEventListener(
  "click",
  sendMessage
);


messageInput.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


async function start() {

  getReceiverFromURL();

  currentUser =
    await getCurrentUser();

  if (!currentUser) {
    return;
  }

  await loadMessages();

}


start();

</script>

</body>
</html>
