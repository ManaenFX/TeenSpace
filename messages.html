/* =========================================
   VOICE RECORDING
========================================= */

voiceButton.addEventListener(
  "click",
  async function(){

    if(recording){

      stopRecording();

      return;

    }

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      showStatus(
        "❌ Voice recording is not supported by this browser.",
        "error"
      );

      return;

    }

    try{

      const stream =
        await navigator.mediaDevices
          .getUserMedia({
            audio:true
          });

      audioChunks = [];

      let mimeType =
        "audio/webm";

      if(
        MediaRecorder.isTypeSupported &&
        MediaRecorder.isTypeSupported(
          "audio/webm"
        )
      ){

        mimeType =
          "audio/webm";

      }

      mediaRecorder =
        new MediaRecorder(
          stream,
          {
            mimeType
          }
        );

      mediaRecorder.ondataavailable =
        function(event){

          if(event.data.size > 0){

            audioChunks.push(
              event.data
            );

          }

        };


      mediaRecorder.onstop =
        function(){

          stream
            .getTracks()
            .forEach(
              track =>
                track.stop()
            );

          const blob =
            new Blob(
              audioChunks,
              {
                type:
                  mediaRecorder.mimeType ||
                  "audio/webm"
              }
            );

          const file =
            new File(
              [blob],
              "voice-" +
              Date.now() +
              ".webm",
              {
                type:
                  blob.type
              }
            );

          selectedFile =
            file;

          fileName.textContent =
            "🎙️ Voice recording ready";

          showStatus(
            "Voice recording ready. Press Send.",
            "success"
          );

          recording =
            false;

          voiceButton.textContent =
            "🎙️ Voice";

          voiceButton.classList.remove(
            "recording"
          );

        };


      mediaRecorder.start();

      recording =
        true;

      voiceButton.textContent =
        "⏹️ Stop";

      voiceButton.classList.add(
        "recording"
      );

      showStatus(
        "🎙️ Recording...",
        "success"
      );

    }catch(error){

      console.error(error);

      showStatus(
        "❌ Microphone permission was not granted.",
        "error"
      );

    }

  }
);


function stopRecording(){

  if(
    mediaRecorder &&
    mediaRecorder.state !== "inactive"
  ){

    mediaRecorder.stop();

  }

}


/* =========================================
   FIXED MEDIA UPLOAD
========================================= */

async function uploadMedia(file){

  if(!file){

    throw new Error(
      "No media file was selected."
    );

  }

  if(!currentUser){

    throw new Error(
      "You are not logged in."
    );

  }


  const fileName =
    String(
      file.name ||
      "upload"
    );


  const extension =
    fileName.includes(".")
      ? fileName
          .split(".")
          .pop()
          .toLowerCase()
      : "bin";


  const path =
    currentUser.id +
    "/" +
    crypto.randomUUID() +
    "." +
    extension;


  const {
    data,
    error
  } =
  await supabaseClient
    .storage
    .from("chat-media")
    .upload(
      path,
      file,
      {
        contentType:
          file.type ||
          "application/octet-stream",

        upsert:false
      }
    );


  if(error){

    throw error;

  }


  if(!data || !data.path){

    throw new Error(
      "Upload completed but no file path was returned."
    );

  }


  const {
    data:urlData
  } =
  supabaseClient
    .storage
    .from("chat-media")
    .getPublicUrl(
      data.path
    );


  if(
    !urlData ||
    !urlData.publicUrl
  ){

    throw new Error(
      "Could not create media URL."
    );

  }


  return urlData.publicUrl;

}


/* =========================================
   LOAD MESSAGES
========================================= */

async function loadMessages(){

  if(
    !currentUser ||
    !receiverId
  ){

    return;

  }


  const {
    data,
    error
  } =
  await supabaseClient
    .from("messages")
    .select(`
      id,
      sender_id,
      receiver_id,
      content,
      created_at,
      message_type,
      media_url,
      media_name,
      poll_question,
      poll_options
    `)
    .or(
      `and(sender_id.eq.${currentUser.id},receiver_id.eq.${receiverId}),and(sender_id.eq.${receiverId},receiver_id.eq.${currentUser.id})`
    )
    .order(
      "created_at",
      {
        ascending:true
      }
    );


  if(error){

    console.error(error);

    messagesBox.innerHTML = `

      <div class="empty">
        ❌ Could not load messages.
      </div>

    `;

    return;

  }


  if(
    !data ||
    data.length === 0
  ){

    messagesBox.innerHTML = `

      <div class="empty">
        👋 Start the conversation.
      </div>

    `;

    return;

  }


  messagesBox.innerHTML =
    "";


  data.forEach(
    message =>
      renderMessage(message)
  );


  messagesBox.scrollTop =
    messagesBox.scrollHeight;

}


/* =========================================
   RENDER MESSAGE
========================================= */

function renderMessage(message){

  const mine =
    message.sender_id ===
    currentUser.id;


  const row =
    document.createElement(
      "div"
    );

  row.className =
    "bubble-row" +
    (
      mine
        ? " mine"
        : ""
    );


  const bubble =
    document.createElement(
      "div"
    );

  bubble.className =
    "bubble";


  const type =
    message.message_type ||
    "text";


  let contentHTML =
    "";


  if(type === "image"){

    contentHTML = `

      <img
        class="media"
        src="${escapeHTML(message.media_url)}"
        alt="Shared image"
      >

    `;

  }else if(type === "video"){

    contentHTML = `

      <video
        class="media"
        src="${escapeHTML(message.media_url)}"
        controls
        playsinline
      ></video>

    `;

  }else if(type === "audio"){

    contentHTML = `

      <audio
        class="audio"
        src="${escapeHTML(message.media_url)}"
        controls
      ></audio>

    `;

  }else if(type === "poll"){

    contentHTML =
      renderPoll(
        message
      );

  }else{

    contentHTML = `

      <div>
        ${escapeHTML(
          message.content
        )}
      </div>

    `;

  }


  bubble.innerHTML =
    contentHTML +
    `

      <div class="bubble-time">
        ${new Date(
          message.created_at
        ).toLocaleString()}
      </div>

    `;


  row.appendChild(
    bubble
  );

  messagesBox.appendChild(
    row
  );

}

function renderPoll(message){

  if(
    typeof options === "string"

      options =

    }catch{

  let html = `

    <div class="poll">

      <div class="poll-question">
        📊 ${escapeHTML(
          message.poll_question ||
          "Poll"
        )}
      </div>

  `;


  options.forEach(
    (option,index) => {

      const text =
        typeof option === "string"
          ? option
          : option.text || "";


      html += `

        <button
          class="poll-option"
          data-message-id="${escapeHTML(message.id)}"
          data-option="${index}"
        >
          ${escapeHTML(text)}
        </button>

      `;

    }
  );


  html += `

      <div class="poll-result">
        Choose an option to vote.
      </div>

    </div>

  `;


  return html;

}


/* =========================================
   POLL VOTING
========================================= */

messagesBox.addEventListener(
  "click",
  async function(event){

    const button =
      event.target.closest(
        ".poll-option"
      );


    if(!button){

      return;

    }


    if(!currentUser){

      return;

    }


    const messageId =
      button.dataset.messageId;

    const optionIndex =
      Number(
        button.dataset.option
      );


    const {
      error
    } =
    await supabaseClient
      .from("poll_votes")
      .upsert(
        {
          message_id:
            messageId,

          user_id:
            currentUser.id,

          option_index:
            optionIndex
        },
        {
          onConflict:
            "message_id,user_id"
        }
      );


    if(error){

      console.error(error);

      showStatus(
        "❌ Could not save your vote.",
        "error"
      );

      return;

    }


    showStatus(
      "✅ Vote saved!",
      "success"
    );

  }
);


/* =========================================
   SEND TEXT
========================================= */

async function sendTextMessage(){

  const content =
    messageInput.value.trim();


  if(!content){

    return;

  }


  await insertMessage({

    message_type:
      "text",

    content:
      content

  });

}


/* =========================================
   SEND MEDIA
========================================= */

async function sendMediaMessage(){

  if(!selectedFile){

    showStatus(
      "❌ Please select a file first.",
      "error"
    );

    return;

  }


  showStatus(
    "Uploading...",
    "success"
  );


  const file =
    selectedFile;


  const url =
    await uploadMedia(
      file
    );


  let type =
    "audio";


  if(
    file.type &&
    file.type.startsWith(
      "image/"
    )
  ){

    type =
      "image";

  }else if(
    file.type &&
    file.type.startsWith(
      "video/"
    )
  ){

    type =
      "video";

  }


  await insertMessage({

    message_type:
      type,

    content:
      file.name ||
      "Shared media",

    media_url:
      url,

    media_name:
      file.name ||
      "Shared media"

  });


  selectedFile =
    null;

  mediaInput.value =
    "";

  fileName.textContent =
    "";

}


/* =========================================
   SEND POLL
========================================= */

async function sendPoll(){

  const question =
    pollQuestion.value.trim();


  const inputs =
    [
      ...pollOptions.querySelectorAll(
        ".poll-input"
      )
    ];


  const options =
    inputs
      .map(
        input =>
          input.value.trim()
      )
      .filter(
        value =>
          value.length > 0
      );


  if(!question){

    showStatus(
      "❌ Enter a poll question.",
      "error"
    );

    return;

  }


  if(options.length < 2){

    showStatus(
      "❌ Add at least 2 options.",
      "error"
    );

    return;

  }


  await insertMessage({

    message_type:
      "poll",

    content:
      question,

    poll_question:
      question,

    poll_options:
      options

  });


  cancelPoll.click();

}


/* =========================================
   INSERT MESSAGE
========================================= */

async function insertMessage(payload){

  if(!currentUser){

    showStatus(
      "❌ You are not logged in.",
      "error"
    );

    return;

  }


  if(!receiverId){

    showStatus(
      "❌ No recipient selected.",
      "error"
    );

    return;

  }


  if(
    receiverId ===
    currentUser.id
  ){

    showStatus(
      "❌ You cannot message yourself.",
      "error"
    );

    return;

  }


  sendButton.disabled =
    true;


  try{

    const {
      error
    } =
    await supabaseClient
      .from("messages")
      .insert({

        sender_id:
          currentUser.id,

        receiver_id:
          receiverId,

        content:
          payload.content ||
          "",

        message_type:
          payload.message_type ||
          "text",

        media_url:
          payload.media_url ||
          null,

        media_name:
          payload.media_name ||
          null,

        poll_question:
          payload.poll_question ||
          null,

        poll_options:
          payload.poll_options ||
          null

      });


    if(error){

      throw error;

    }


    messageInput.value =
      "";


    showStatus(
      "✅ Sent!",
      "success"
    );


    await loadMessages();

    await updateStreak();


  }catch(error){

    console.error(error);

    showStatus(
      "❌ " +
      (
        error.message ||
        "Could not send message."
      ),
      "error"
    );

  }


  sendButton.disabled =
    false;


  setTimeout(
    () =>
      showStatus(""),
    1800
  );

}


/* =========================================
   STREAK
========================================= */

async function updateStreak(){

  if(
    !currentUser ||
    !receiverId
  ){

    return;

  }


  const today =
    new Date()
      .toISOString()
      .slice(0,10);


  const {
    data,
    error
  } =
  await supabaseClient
    .from("chat_streaks")
    .select(
      "id,user_a,user_b,streak_count,last_message_date"
    )
    .or(
      `and(user_a.eq.${currentUser.id},user_b.eq.${receiverId}),and(user_a.eq.${receiverId},user_b.eq.${currentUser.id})`
    )
    .maybeSingle();


  if(error){

    console.error(
      "Streak error:",
      error
    );

    return;

  }


  if(!data){

    const {
      error:insertError
    } =
    await supabaseClient
      .from("chat_streaks")
      .insert({

        user_a:
          currentUser.id,

        user_b:
          receiverId,

        streak_count:
          1,

        last_message_date:
          today

      });


    if(!insertError){

      streak.textContent =
        "🔥 Streak: 1 day";

    }

    return;

  }


  if(
    data.last_message_date ===
    today
  ){

    streak.textContent =
      "🔥 Streak: " +
      data.streak_count +
      " days";

    return;

  }


  const yesterday =
    new Date();


  yesterday.setDate(
    yesterday.getDate() - 1
  );


  const yesterdayString =
    yesterday
      .toISOString()
      .slice(0,10);


  let newCount;


  if(
    data.last_message_date ===
    yesterdayString
  ){

    newCount =
      data.streak_count + 1;

  }else{

    newCount =
      1;

  }


  const {
    error:updateError
  } =
  await supabaseClient
    .from("chat_streaks")
    .update({

      streak_count:
        newCount,

      last_message_date:
        today

    })
    .eq(
      "id",
      data.id
    );


  if(!updateError){

    streak.textContent =
      "🔥 Streak: " +
      newCount +
      " days";

  }

}

async function loadStreak(){

  if(
    !currentUser ||
    !receiverId
  ){

    return;

  }


  const {
    data,
    error
  } =
  await supabaseClient
    .from("chat_streaks")
    .select(

    )
    .or(
      `and(user_a.eq.${currentUser.id},user_b.eq.${receiverId}),and(user_a.eq.${receiverId},user_b.eq.${currentUser.id})`
    )
    .maybeSingle();


  if(
    error ||
    !data
  ){

    streak.textContent =
      "🔥 Streak: 0 days";

    return;

  }


  streak.textContent =
    "🔥 Streak: " +
    data.streak_count +
    " days";

}

/* =========================================
   REALTIME
========================================= */

function subscribeToMessages(){

  supabaseClient
    .channel(
      "teen-space-messages-" +
      currentUser.id +
      "-" +
      receiverId
    )
    .on(
      "postgres_changes",
      {
        event:"INSERT",
        schema:"public",
        table:"messages"
      },
      function(payload){

        const message =
          payload.new;


        const belongsToChat =
          (
            message.sender_id ===
              currentUser.id &&
            message.receiver_id ===
              receiverId
          ) ||
          (
            message.sender_id ===
              receiverId &&
            message.receiver_id ===
              currentUser.id
          );


        if(belongsToChat){

          loadMessages();

        }

      }
    )
    .subscribe();

}

    `;


    sendButton.disabled =
      true;

    messageInput.disabled =
      true;

    return;

  }


  await loadMessages();

  await loadStreak();

  subscribeToMessages();

}


start();
