<script>

const SUPABASE_URL =
"https://gcigveojqwwovitlwtxl.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Br7HdEgbHvQxx4_8HHR9Fg_fJ5sH_r7";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true
    }
  }
);


const friendsList =
document.getElementById(
  "friendsList"
);

const requestsList =
document.getElementById(
  "requestsList"
);

const sentList =
document.getElementById(
  "sentList"
);


let currentUser = null;


/* =========================================
   HELPERS
========================================= */

function escapeHTML(value){

  const div =
  document.createElement("div");

  div.textContent =
  value ?? "";

  return div.innerHTML;

}


function avatarFor(profile){

  if(profile?.role === "owner"){
    return "👑";
  }

  if(profile?.role === "staff"){
    return "🛡️";
  }

  return "👤";

}


/* =========================================
   CURRENT USER
========================================= */

async function loadCurrentUser(){

  const {
    data:{
      user
    },
    error
  } =
  await supabaseClient.auth.getUser();


  if(
    error ||
    !user
  ){

    window.location.href =
    "login.html";

    return null;

  }


  currentUser =
  user;

  return user;

}


/* =========================================
   PROFILE MAP
========================================= */

async function getProfiles(ids){

  if(!ids.length){
    return new Map();
  }


  const {
    data,
    error
  } =
  await supabaseClient

  .from("profiles")

  .select(
    'username,country,role,badge,premium,"user-id"'
  )

  .in(
    "user-id",
    ids
  );


  if(error){
    throw error;
  }


  const map =
  new Map();


  (data || []).forEach(
    profile => {

      map.set(
        profile["user-id"],
        profile
      );

    }
  );


  return map;

}


/* =========================================
   FRIENDS
========================================= */

async function loadFriends(){

  friendsList.innerHTML = `
    <div class="status">
      Loading friends...
    </div>
  `;


  const {
    data,
    error
  } =
  await supabaseClient

  .from("friends")

  .select(
    "id,user_id,friend_id,created_at"
  )

  .or(
    "user_id.eq." +
    currentUser.id +
    ",friend_id.eq." +
    currentUser.id
  )


  if(error){
    throw error;
  }


  if(
    !data ||
    data.length === 0
  ){

    friendsList.innerHTML = `
      <div class="empty">
        👥 You don't have any friends yet.
      </div>
    `;

    return;

  }


  const ids =
  data.map(
    friendship =>
      friendship.user_id === currentUser.id
        ? friendship.friend_id
        : friendship.user_id
  );


  const profileMap =
  await getProfiles(ids);


  friendsList.innerHTML =
  "";


  data.forEach(
    friendship => {

      const friendId =
      friendship.user_id === currentUser.id
        ? friendship.friend_id
        : friendship.user_id;


      const profile =
      profileMap.get(
        friendId
      ) || {};


      const row =
      document.createElement("div");


      row.className =
      "item";


      row.innerHTML = `

        <div class="user">

          <div class="avatar">
            ${avatarFor(profile)}
          </div>

          <div>

            <div class="username">
              ${escapeHTML(
                profile.username ||
                "TeenSpace Member"
              )}
            </div>

            <div class="country">
              🌍 ${escapeHTML(
                profile.country ||
                "Unknown"
              )}
            </div>

          </div>

        </div>


        <div class="actions">

          <a
            class="message-link message"
            href="messages.html?user_id=${
              encodeURIComponent(friendId)
            }&name=${
              encodeURIComponent(
                profile.username ||
                "TeenSpace Member"
              )
            }"
          >
            💬 Message
          </a>


          <button
            class="remove"
            data-id="${friendship.id}"
          >
            Remove
          </button>

        </div>

      `;


      row
      .querySelector(".remove")
      .addEventListener(
        "click",
        () =>
          removeFriend(
            friendship.id
          )
      );


      friendsList.appendChild(
        row
      );

    }
  );

}


/* =========================================
   INCOMING REQUESTS
========================================= */

async function loadRequests(){

  requestsList.innerHTML = `
    <div class="status">
      Loading requests...
    </div>
  `;


  const {
    data,
    error
  } =
  await supabaseClient

  .from("friend_requests")

  .select(
    "id,sender_id,created_at"
  )

  .eq(
    "receiver_id",
    currentUser.id
  )

  .eq(
    "status",
    "pending"
  )


  if(error){
    throw error;
  }


  if(
    !data ||
    data.length === 0
  ){

    requestsList.innerHTML = `
      <div class="empty">
        📭 No new friend requests.
      </div>
    `;

    return;

  }


  const ids =
  data.map(
    request =>
      request.sender_id
  );


  const profileMap =
  await getProfiles(ids);


  requestsList.innerHTML =
  "";


  data.forEach(
    request => {

      const profile =
      profileMap.get(
        request.sender_id
      ) || {};


      const row =
      document.createElement("div");


      row.className =
      "item";


      row.innerHTML = `

        <div class="user">

          <div class="avatar">
            ${avatarFor(profile)}
          </div>

          <div>

            <div class="username">
              ${escapeHTML(
                profile.username ||
                "TeenSpace Member"
              )}
            </div>

            <div class="country">
              🌍 ${escapeHTML(
                profile.country ||
                "Unknown"
              )}
            </div>

          </div>

        </div>


        <div class="actions">

          <button
            class="accept"
            data-id="${request.id}"
          >
            ✅ Accept
          </button>

          <button
            class="decline"
            data-id="${request.id}"
          >
            ❌ Decline
          </button>

        </div>

      `;


      row
      .querySelector(".accept")
      .addEventListener(
        "click",
        () =>
          acceptRequest(
            request
          )
      );


      row
      .querySelector(".decline")
      .addEventListener(
        "click",
        () =>
          declineRequest(
            request.id
          )
      );


      requestsList.appendChild(
        row
      );

    }
  );

}


/* =========================================
   SENT REQUESTS
========================================= */

async function loadSentRequests(){

  sentList.innerHTML = `
    <div class="status">
      Loading requests...
    </div>
  `;


  const {
    data,
    error
  } =
  await supabaseClient

  .from("friend_requests")

  .select(
    "id,receiver_id,created_at"
  )

  .eq(
    "sender_id",
    currentUser.id
  )

  .eq(
    "status",
    "pending"
  )


  if(error){
    throw error;
  }


  if(
    !data ||
    data.length === 0
  ){

    sentList.innerHTML = `
      <div class="empty">
        📤 No pending sent requests.
      </div>
    `;

    return;

  }


  const ids =
  data.map(
    request =>
      request.receiver_id
  );


  const profileMap =
  await getProfiles(ids);


  sentList.innerHTML =
  "";


  data.forEach(
    request => {

      const profile =
      profileMap.get(
        request.receiver_id
      ) || {};


      const row =
      document.createElement("div");


      row.className =
      "item";


      row.innerHTML = `

        <div class="user">

          <div class="avatar">
            ${avatarFor(profile)}
          </div>

          <div>

            <div class="username">
              ${escapeHTML(
                profile.username ||
                "TeenSpace Member"
              )}
            </div>

            <div class="country">
              🌍 ${escapeHTML(
                profile.country ||
                "Unknown"
              )}
            </div>

          </div>

        </div>


        <div class="actions">

          <button
            class="decline cancel-request"
          >
            Cancel
          </button>

        </div>

      `;


      row
      .querySelector(".cancel-request")
      .addEventListener(
        "click",
        () =>
          cancelRequest(
            request.id
          )
      );


      sentList.appendChild(
        row
      );

    }
  );

}


/* =========================================
   ACCEPT REQUEST
========================================= */

async function acceptRequest(
  request
){

  try{

    const {
      error:updateError
    } =
    await supabaseClient

    .from("friend_requests")

    .update({
      status:"accepted"
    })

    .eq(
      "id",
      request.id
    )

    .eq(
      "receiver_id",
      currentUser.id
    );


    if(updateError){
      throw updateError;
    }


    /*
      Create both friendship directions
      so either user can query normally.
    */

    const {
      error:friendError
    } =
    await supabaseClient

    .from("friends")

    .insert([

      {
        user_id:
          currentUser.id,

        friend_id:
          request.sender_id
      },

      {
        user_id:
          request.sender_id,

        friend_id:
          currentUser.id
      }

    ]);


    if(friendError){
      throw friendError;
    }


    await refreshAll();

  }catch(error){

    console.error(error);

    alert(
      error.message ||
      "Could not accept request."
    );

  }

}


/* =========================================
   DECLINE
========================================= */

async function declineRequest(
  requestId
){

  const {
    error
  } =
  await supabaseClient

  .from("friend_requests")

  .update({
    status:"declined"
  })

  .eq(
    "id",
    requestId
  )

  .eq(
    "receiver_id",
    currentUser.id
  );


  if(error){

    alert(
      error.message
    );

    return;

  }


  await loadRequests();

}


/* =========================================
   CANCEL
========================================= */

async function cancelRequest(
  requestId
){

  const {
    error
  } =
  await supabaseClient

  .from("friend_requests")

  .delete()

  .eq(
    "id",
    requestId
  )

  .eq(
    "sender_id",
    currentUser.id
  );


  if(error){

    alert(
      error.message
    );

    return;

  }


  await loadSentRequests();

}


/* =========================================
   REMOVE FRIEND
========================================= */

async function removeFriend(
  friendshipId
){

  const confirmed =
  confirm(
    "Remove this friend?"
  );


  if(!confirmed){
    return;
  }


  const {
    data:friendship,
    error:fetchError
  } =
  await supabaseClient

  .from("friends")

  .select(
    "user_id,friend_id"
  )

  .eq(
    "id",
    friendshipId
  )

  .maybeSingle();


  if(fetchError){
    alert(fetchError.message);
    return;
  }


  if(!friendship){
    return;
  }


  const userA =
    friendship.user_id;

  const userB =
    friendship.friend_id;


  const {
    error
  } =
  await supabaseClient

  .from("friends")

  .delete()

  .or(
    "and(user_id.eq." +
    userA +
    ",friend_id.eq." +
    userB +
    "),and(user_id.eq." +
    userB +
    ",friend_id.eq." +
    userA +
    ")"
  );


  if(error){

    alert(
      error.message
    );

    return;

  }


  await loadFriends();

}


/* =========================================
   REFRESH
========================================= */

async function refreshAll(){

  await Promise.all([

    loadFriends(),
    loadRequests(),
    loadSentRequests()

  ]);

}


/* =========================================
   START
========================================= */

}
